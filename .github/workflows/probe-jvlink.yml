# JV-Link（JRA-VAN の取り込み部品）が GitHub の Windows の実行環境に人の操作なしで入るかを確かめるだけの試し。
# 手で動かす時だけ。鍵（利用キー）は使わない。データは取りに行かない。何も保存しない。
name: probe-jvlink
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: インストーラを取る
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://dl.cdn.jra-van.ne.jp/datalab/JV-Link/web/JV-Link.exe" -OutFile "$env:RUNNER_TEMP\JV-Link.exe"
          $f = Get-Item "$env:RUNNER_TEMP\JV-Link.exe"
          "サイズ $($f.Length)"
          "バージョン情報 " + ($f.VersionInfo | Select-Object FileVersion, ProductName, CompanyName, FileDescription | ConvertTo-Json -Compress)
      - name: 人の操作なしで入れてみる
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\JV-Link.exe"
          $dll = "C:\Windows\SysWOW64\JVDTLAB\JVDTLab.dll"
          function KillAll { Get-Process -Name "JVLinkSetup","ISBEW64","JV-Link" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue; Start-Sleep -Seconds 3 }
          # 1) まず普通に起動して、中から出てくる本体（JVLinkSetup）の場所と起動のしかたを見る
          Start-Process -FilePath $exe | Out-Null
          Start-Sleep -Seconds 25
          $procs = Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'JVLinkSetup|ISBEW64|JV-Link' }
          $procs | Select-Object Name, ExecutablePath, CommandLine | Format-List | Out-String -Width 300
          $inner = ($procs | Where-Object { $_.Name -match 'JVLinkSetup' } | Select-Object -First 1).ExecutablePath
          "本体: $inner"
          if ($inner) {
            $dir = Split-Path $inner
            Get-ChildItem $dir -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300
            $keep = "$env:RUNNER_TEMP\jvsetup"; Copy-Item $dir $keep -Recurse -Force
            KillAll
            $in2 = Join-Path $keep (Split-Path $inner -Leaf)
            $tries = @('/s /v"/qn /norestart"', '/s /sms', '/s', '/S /v/qn')
            foreach ($a in $tries) {
              if (Test-Path $dll) { break }
              "--- 本体に引数: $a"
              $p = Start-Process -FilePath $in2 -ArgumentList $a -PassThru -WorkingDirectory $keep
              if (-not $p.WaitForExit(120000)) { "時間切れ"; KillAll } else { "終了コード $($p.ExitCode)" }
              $n = 0; while ((Get-Process -Name "JVLinkSetup","ISBEW64" -ErrorAction SilentlyContinue) -and $n -lt 20) { Start-Sleep -Seconds 5; $n++ }
              if ($n -ge 20) { "まだ動いている（画面で止まっている可能性）"; KillAll }
              "入ったか: " + (Test-Path $dll)
            }
          }
          "最終 入ったか: " + (Test-Path $dll)
          Get-ChildItem "C:\Windows\SysWOW64\JVDTLAB","C:\Windows\System32\JVDTLAB" -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 200
      - name: 部品を呼べるか（32ビット）
        if: always()
        shell: pwsh
        run: |
          $ps32 = "C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe"
          & $ps32 -NoProfile -Command "try { `$j = New-Object -ComObject JVDTLab.JVLink; 'COM 作成 OK'; 'JVInit の戻り値 ' + `$j.JVInit('UNKNOWN'); 'バージョン ' + `$j.m_JVLinkVersion } catch { 'COM 失敗: ' + `$_.Exception.Message }"
          "サービス: " + ((Get-Service | Where-Object { $_.Name -match 'JV|JRA' -or $_.DisplayName -match 'JV|JRA' } | Select-Object Name, Status | ConvertTo-Json -Compress))
