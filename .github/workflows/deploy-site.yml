# 予想ページ一式（seventh-well.com/odds・/lab）を Cloudflare に公開する
# main に反映したとき（関係するファイルが変わったときだけ）・毎朝・手動で動く
# 公開のたびに、地方の成績索引（馬・騎手・調教師・父）を公式データから作り直す（backtest/build_nar_index.py）
#   毎朝の回で取得に失敗したら公開ごと止める（GitHub から失敗の通知が来る。本番は前のまま）
#   main への反映の回で取得に失敗したら、リポにある索引のまま公開する（警告を出す）
# 続けて、実運用の成績表（backtest/scoreboard.py）を作り直す。失敗しても公開は止めない
name: deploy-site
on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "core/**"
      - "cloudflare/**"
      - "backtest/deploy.py"
      - "backtest/site_config.py"
      - "backtest/build_nar_index.py"
      - "backtest/build_time_feats.py"
      - "backtest/scoreboard.py"
      - ".github/workflows/deploy-site.yml"
  # ★GitHub の時刻指定は遅れる★ 2026-11-13 は 4:40 の回が 9:40、7:40 の回が 11:53 に動いた（朝8:30の投稿に間に合わず）。
  #   対策: 2:40〜7:40（日本時間）に1時間おきで6回並べる。5時間遅れても最初の回は 7:40 に動く。
  #   すでに前日ぶんの結果が入っていれば、その回は何もせず終わる（下の fresh）。
  #   公式データは 2:00 ごろ更新される。まだ入っていなければ次の回がやり直す。
  schedule:
    - cron: "40 17 * * *"   # 2:40
    - cron: "40 18 * * *"   # 3:40
    - cron: "40 19 * * *"   # 4:40
    - cron: "40 20 * * *"   # 5:40
    - cron: "40 21 * * *"   # 6:40
    - cron: "40 22 * * *"   # 7:40
  workflow_dispatch:
concurrency:
  group: deploy-site
  cancel-in-progress: false
jobs:
  # 毎朝の回だけ: 公開中の索引がもう前日ぶんまで入っていれば、作り直さずに終わる（1日6回並べたぶんの無駄を省く）
  fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    outputs:
      skip: ${{ steps.f.outputs.skip }}
    steps:
      - id: f
        env:
          EVENT: ${{ github.event_name }}
        run: |
          skip=false
          if [ "$EVENT" = "schedule" ]; then
            want=$(TZ=Asia/Tokyo date -d yesterday +%Y%m%d)
            today=$(TZ=Asia/Tokyo date +%Y%m%d)
            # 「前日ぶんまで入っている」かつ「今日つくった」ときだけ飛ばす（前の晩に作った途中の索引で満足しないため）
            got=$(curl -fsS --max-time 20 "https://seventh-well.com/odds/data/nar_index_asof.json?_=$(date +%s)" | python3 -c "import sys,json;j=json.load(sys.stdin);print(j.get('asof',''),j.get('built',''))" || true)
            asof=${got%% *}; built=${got##* }
            echo "公開中の索引: ${asof:-読めず} まで（作った日 ${built:-不明}） / ほしいのは ${want} まで・今日 ${today}"
            if [ -n "$asof" ] && [ "$asof" -ge "$want" ] 2>/dev/null && [ "$built" = "$today" ]; then skip=true; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "作り直さない: $skip"
  check:
    needs: fresh
    if: needs.fresh.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - name: tweet.html の書き間違い確認
        run: |
          python3 -c "import re;open('/tmp/script.js','w',encoding='utf-8').write(re.findall(r'<script>([\s\S]*?)</script>',open('deploy/tweet.html',encoding='utf-8').read())[0])"
          node -e "new Function(require('fs').readFileSync('/tmp/script.js','utf8'))"
      - name: 採点の二重管理がずれていないか
        run: python3 backtest/check_scoring_sync.py && node backtest/check_strength_line.js
      - name: 配信物を作れるか
        run: python3 cloudflare/build.py --site both
  deploy:
    needs: check
    uses: kajisho5/tower/.github/workflows/deploy-workers.yml@main
    with:
      working-directory: cloudflare
      build-command: python3 ../backtest/build_nar_index.py --cache ../.nar_cache ${{ github.event_name == 'push' && '--soft' || '' }} && (python3 ../backtest/scoreboard.py --cache ../.nar_cache || echo "::warning::成績表を作れませんでした（前の成績表のまま公開します）") && python3 build.py --site both
      cache-path: .nar_cache
      cache-key: nar-zip-v1
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
