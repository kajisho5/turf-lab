# X自動投稿（kajikeiba-autopost）を Cloudflare に公開する
# main に反映したとき（tools/x-autopost が変わったときだけ）と、手動で動く
name: deploy-autopost
on:
  push:
    branches: [main]
    paths:
      - "tools/x-autopost/**"
      - "tools/deploy_window.py"
      - ".github/workflows/deploy-autopost.yml"
  workflow_dispatch:
concurrency:
  group: deploy-autopost
  cancel-in-progress: false
jobs:
  # 投稿の回の前後は公開しない（その時間帯に入っていたら、過ぎるまで待ってから公開する）。tools/deploy_window.py
  #   2026-11-13 19:10 の事故（公開の直後に夜の答え合わせが誤って出た）の再発防止
  window:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v6
      - name: 投稿の回の前後なら、過ぎるまで待つ
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "schedule" ]; then echo "毎朝の回は待たない"; exit 0; fi
          w=$(python3 tools/deploy_window.py)
          if [ "$w" -gt 0 ]; then
            echo "::warning::投稿の回の前後なので、$((w/60))分待ってから公開します"
            sleep "$w"
          else
            echo "今すぐ公開してよい時間帯"
          fi
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - name: 書き間違い確認
        run: node --check tools/x-autopost/src/worker.js && node --check tools/x-autopost/src/hits.js && node --check tools/x-autopost/src/guard.js
      - name: 投稿の組み立ての試験
        run: node tools/x-autopost/test/posts.test.mjs && node tools/x-autopost/test/late.test.mjs && node tools/x-autopost/test/hits.test.mjs && node tools/x-autopost/test/grade.test.mjs && node tools/x-autopost/test/wake.test.mjs && node tools/x-autopost/test/guard.test.mjs && node tools/x-autopost/test/worker.test.mjs
  deploy:
    needs: [check, window]
    uses: kajisho5/tower/.github/workflows/deploy-workers.yml@main
    with:
      working-directory: tools/x-autopost
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  # 公開のあと、Xの鍵4つが登録されたままか確かめる（名前だけ見る。値は出ない）
  # 2026-11-13: 公開の経路を替えた翌朝に鍵が消えていて、朝の投稿が失敗した。次は公開した時点で気づけるようにする
  verify-keys:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - name: 鍵の名前を確認
        working-directory: tools/x-autopost
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci --silent
          npx wrangler secret list > /tmp/names.json
          miss=""
          for k in X_API_KEY X_API_SECRET X_ACCESS_TOKEN X_ACCESS_SECRET; do
            grep -q "\"$k\"" /tmp/names.json || miss="$miss $k"
          done
          if [ -n "$miss" ]; then
            echo "::error::Xの鍵が登録されていません:$miss（このままだと次の自動投稿は失敗します）"
            exit 1
          fi
          echo "Xの鍵は4つとも登録されています"
