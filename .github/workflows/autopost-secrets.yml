# X自動投稿（kajikeiba-autopost）に登録されている鍵の「名前だけ」を一覧する（値は出ない）
# 投稿が認証エラーになったときの切り分け用。手動でだけ動く
name: autopost-secrets
on:
  workflow_dispatch:
jobs:
  list:
    uses: kajisho5/tower/.github/workflows/deploy-workers.yml@main
    with:
      working-directory: tools/x-autopost
      command: secret list
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
