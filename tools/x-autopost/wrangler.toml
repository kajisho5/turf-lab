name = "kajikeiba-autopost"
main = "src/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# ★画面（Cloudflare）で足した変数を、公開のたびに消さない★
#   2026-11-13 朝: GitHub からの公開に替えた翌朝、Xの鍵4つが消えていて投稿が認証エラーになった
#   （secret list が空）。鍵は必ず「シークレット」の種類で登録する。これは念のための二重の守り。
keep_vars = true

# ★Browser Rendering（クラウドでヘッドレスChromeを動かし tweet.html の画像を生成）★
#   Workers 有料プラン + ダッシュボードで Browser Rendering 有効化が必要。
browser = { binding = "BROWSER" }

# ★cron（時刻はUTC）★ 8:30 JST=前日23:30 UTC / 22:30 JST=13:30 UTC（2026-11-13: 朝を8:30に、夜を22:30に）
[triggers]
crons = ["30 21,23 * * *", "30 13 * * *", "*/10 0-14 * * *", "0 0 1 * *", "40 19,20 * * *"]   # 1つ目＝朝の前の点検 6:30 と 朝の予想 8:30（JST）／2つ目＝夜 22:30／3つ目＝★勝負の的中速報＋失敗した回のやり直し（10分おき・9:00〜23:50 JST）／4つ目＝月間まとめ（毎月1日 9:00 JST）／5つ目＝毎朝のデータ更新を起こす（4:40・5:40 JST。src/wake.js）

[vars]
# 生成元（legacyのtweet.html）。?auto=morning|evening&mode=nar|jra を付けて開く。
TWEET_URL = "https://seventh-well.com/odds/tweet.html"
# "1"=ドライラン（Xへ投稿しない・内容の確認のみ）。本番投稿にするときだけ "0"。
DRYRUN = "0"
# "1"=★勝負の的中速報を出す。止める時は "0"（朝・夜の投稿には影響しない）
HITS = "1"
# "0"=高配当の的中（単勝1,000円以上）の単独の投稿を止める。それ以外は出す（HITS が "1" の時だけ動く）
BIGHIT = "1"
# "0"=重賞の日の1枚（発走2時間前）を止める。それ以外は出す
GRADE = "1"

# --- secrets（wrangler secret put で登録。ここには書かない・私は値を見ない）---
#   X_API_KEY / X_API_SECRET / X_ACCESS_TOKEN / X_ACCESS_SECRET  … Xの4鍵(OAuth1.0a)
#   GH_DISPATCH_TOKEN … 毎朝のデータ更新（deploy-site）を起こすための GitHub の鍵（turf-lab だけ・Actions の読み書きだけ）。無ければ起こさない
#   TRIGGER_KEY … 手動テスト用URLの合言葉（?key=... 一致時だけ実行）

# 結果（投稿の成否・Xの返答）をダッシュボードのログに残す
[observability]
enabled = true

# 結果メール（Cloudflare Email Service）。宛先はこの1件に固定
[[send_email]]
name = "MAIL"
destination_address = "kajiyama@seventh-well.com"

# 的中速報の記録（朝の投稿のID・速報済みのレース）。予想ページと同じデータベースに表 xpost_log を1つ使う
[[d1_databases]]
binding = "DB"
database_name = "kajikeiba"
database_id = "4a865324-8f24-42da-9ffa-e0f851453a62"
