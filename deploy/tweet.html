/* ★中央のオッズはHTMLではなくJSON API★（2026-07-31に実レース202604020201で実測）
   race.netkeiba.com/api/api_get_jra_odds.html?race_id=..&type=N
     type=1 → data.odds["1"]=単勝, ["2"]=複勝   type=4 馬連 / 5 ワイド / 6 馬単
   値は ["オッズ","上限or0.0","人気"]。複勝・ワイドは [下限,上限,人気] なので下限を使う
   （地方のHTML版と同じ保守的な扱い）。馬番は2桁ゼロ埋め、連系は連結("0102")。
   ★地方のodds_get_form.htmlを中央に投げても枠だけ返り、オッズは "---.-" になる★
   （＝正規表現は1件もヒットしない。実測済み。ここを分けないと静かに空振りする） */
async function fetchJraOdds(rid){
  /* ★actionパラメータのフォールバック★（2026-08-02 札幌7Rで発走前に
     {"status":"middle","reason":"result odds empty"} が返り配信不発。
     発走前のライブオッズは action 指定が要る可能性があるため、
     無印→init→update を順に試し、成功した形をログに残す（翌週の診断用）。 */
  const api=(ty,act)=>pxy(`https://race.netkeiba.com/api/api_get_jra_odds.html?race_id=${rid}&type=${ty}`+(act?`&action=${act}`:""));
  const grab=async(ty)=>{
    for(const act of ["", "init", "update"]){
      const g=await _grabOnce(ty, act);
      if(g && Object.keys(g).length){ if(act) console.warn(`中央オッズ: action=${act}で取得成功 type=${ty}`); return g; }
    }
    return {};
  };
  const _grabOnce=async(ty,act)=>{
    const t=await fetchDecoded(api(ty,act));
    /* ★HTMLラッパー耐性★ オッズ未確定時、netkeibaは JSON を <html><pre>{...}</pre> で
       包んで返すことがある（例: {"status":"middle","reason":"result odds empty"}）。
       素の JSON.parse だと "Unexpected token '<'" で throw → 配信が黙って落ちていた
       （2026-08-01の中央配信不発）。中の {...} を取り出してからパースする。 */
    let j=null;
    try{ j=JSON.parse(t); }
    catch(_){ const m=t.match(/\{[\s\S]*\}/); if(m){ try{ j=JSON.parse(m[0]); }catch(__){} } }
    const od=(j&&j.data&&j.data.odds)||{};
    /* 空応答はAPIの言い分をログに残す（翌開催日の診断がログだけで済むように） */
    if(!Object.keys(od).length)
      console.warn(`中央オッズ空応答 type=${ty} action=${act||"無"} status=${j&&j.status} reason=${(j&&j.reason)||""}`);
    return od;
  };
  const num=(s)=>String(parseInt(s,10));
  const val=(a)=>{ const v=parseFloat(String(a&&a[0]||"").replace(/,/g,"")); return isFinite(v)?v:null; };
  const out={ fuku:{}, umaren:{}, wide:{}, umatan:{} };
  const tf=await grab(1);
  for(const k in (tf["2"]||{})){ const v=val(tf["2"][k]); if(v) out.fuku[num(k)]=v; }
  for(const [ty,key,ordered] of [[4,"umaren",0],[5,"wide",0],[6,"umatan",1]]){
    const g=await grab(ty); const d=g[String(ty)]||{};
    for(const k in d){
      const a=num(k.slice(0,2)), b=num(k.slice(2,4)); const v=val(d[k]); if(!v) continue;
      out[key][ordered ? a+"-"+b : [a,b].sort((x,y)=>+x-+y).join("-")]=v;
    }
  }
  return Object.keys(out.fuku).length ? out : null;
}
async function fetchExoticOdds(rid){
  /* 複勝(下限)・馬連・ワイド(下限)・馬単 を取る。取れない券種はnull */
  if(MODE==="jra"){ try{ return await fetchJraOdds(rid); }
                    catch(e){ console.warn("中央オッズ取得失敗", e); return null; } }
  const out={ fuku:{}, umaren:{}, wide:{}, umatan:{} };
  /* ★2026-08-04に判明した2点★（LINE配信は停止中だが、再開時に静かに壊れるのを防ぐ）
     ① 現行のNARオッズページには投票チェックボックス(chk_b2_)が無く、
        マーク枠(mymarkb2_)だけのレイアウトになっている（盛岡1R・帯広12Rで実測）。
        chk_b2_ だけを見ていると**複勝オッズが常に0件**＝毎回null＝全レース見送りになる。
     ② 発売前でもページは返り、オッズ欄に "0.0 - 0.0" が入る。
        素直にparseFloatすると0.0倍の床を組むことになる（fetchWinOddsは既に対策済み）。 */
  const okOdds=v=>isFinite(v)&&v>=1.0;
  try{
    const b1=await fetchDecoded(oddsFormURL(rid,"b1"));
    for(const re of [/id="chk_b2_(\d+)"[\s\S]{0,400}?class="Odds\s*">([\d.]+)/g,
                     /id\s*=\s*"mymarkb2_(\d+)"[\s\S]{0,400}?class="Odds\s*">([\d.]+)/g]){
      for(const m of b1.matchAll(re)){
        const v=parseFloat(m[2]);                        // 複勝は下限
        if(okOdds(v)) out.fuku[String(+m[1])]=v;
      }
    }
    for(const [ty,key,ordered] of [["b4","umaren",0],["b5","wide",0],["b6","umatan",1]]){
      const t=await fetchDecoded(oddsFormURL(rid,ty));
      for(const m of t.matchAll(/id="chk_[^"]*_b\d_c0_(\d+)_(\d+)"[^>]*>\s*([\d.]+)/g)){
        const a=String(+m[1]), b=String(+m[2]);
        const k=ordered? a+"-"+b : [a,b].sort((x,y)=>+x-+y).join("-");
        const v=parseFloat(m[3]);                        // ワイドは正規表現上、最初の数値=下限
        if(okOdds(v)) out[key][k]=v;
      }
    }
  }catch(e){ console.warn("エキゾチックオッズ取得失敗", e); return null; }
  /* ★空成功を成功にしない★（2026-08-02 盛岡3/9/11R 無音不発の原因）
     正規表現が0件ヒット（レイアウト差・"---.-"未確定・WAFのHTML差替え）でも
     out は非null で返っていた → 呼び出し側の !ex を通過 → lineAllocate が
     複勝オッズ無しで null → 黙ってスキップ、の連鎖。空は失敗として null。 */
  if(!Object.keys(out.fuku).length){
    console.warn("エキゾチックオッズが空(複勝0件)＝失敗扱い", rid);
    return null;
  }
  return out;
}
/* 床保証型の配分: ◎複勝を土台に「◎3着内なら最悪でも±0以上」を守って上を狙う。
   検証: 複勝下限fl → 床条件 f*fl >= B。余り R=B-f を 単勝/馬単◎→○/馬連◎-○/馬連◎-▲ へ。 */
function lineAllocate(oNum,tNum,sNum,win,ex){
  const fl=ex.fuku[oNum];
  if(!fl || fl<=1.0) return null;                        // 複勝1.0倍=床が作れない
  const B=LINE_BUDGET;
  const need=Math.ceil(B/fl/100)*100;                    // 床に必要な複勝額
  if(need>=B) return {bets:[{k:"複勝",c:oNum,amt:B,od:fl}], floorOnly:true};
  let R=B-need;
  const parts=[];
  const wOdds=win&&win[oNum]?win[oNum].odds:null;
  const u1=ex.umatan[oNum+"-"+tNum], m1=ex.umaren[[oNum,tNum].sort((x,y)=>+x-+y).join("-")],
        m2=ex.umaren[[oNum,sNum].sort((x,y)=>+x-+y).join("-")];
  const weights=[["単勝",oNum,wOdds,0.45],["馬単",oNum+"→"+tNum,u1,0.25],
                 ["馬連",oNum+"-"+tNum,m1,0.15],["馬連",oNum+"-"+sNum,m2,0.15]];
  for(const [k,c,od,w] of weights){
    if(!od||od<=1) continue;
    const amt=Math.floor(R*w/100)*100;
    if(amt>=100) parts.push({k,c,amt,od});
  }
  const used=parts.reduce((s,p)=>s+p.amt,0);
  return {bets:[{k:"複勝",c:oNum,amt:B-used,od:fl}, ...parts], floorOnly:false};
}
function lineMessage(m, alloc, prob){
  const o=(m.marks||[]).find(x=>x.mk==="◎")||{};
  const t=(m.marks||[]).find(x=>x.mk==="○")||{};
  const a=(m.marks||[]).find(x=>x.mk==="▲")||{};
  const L=[`🏇 ${m.post||"--:--"} ${m.track||""}${m.no}R【勝負】`,
           `◎${o.num} ○${t.num} ▲${a.num}`,
           prob!=null?`◎3着内の実測見込み ${prob}%`:"",
           ``, `予算${LINE_BUDGET.toLocaleString()}円の配分（この時点のオッズ）`];
  let floor=Infinity;
  const fuku=alloc.bets.find(b=>b.k==="複勝");
  for(const b of alloc.bets) L.push(`・${b.k} ${b.c} … ${b.amt.toLocaleString()}円（${b.od}倍）`);
  if(fuku) floor=Math.round(fuku.amt*fuku.od-LINE_BUDGET);
  L.push(``,
    `◎3着内なら最低でも ${floor>=0?"+":""}${floor.toLocaleString()}円`,
    `◎圏外なら -${LINE_BUDGET.toLocaleString()}円${prob!=null?`（実測${100-prob}%）`:""}`,
    ``, `※オッズは締切まで動きます。数字は盛っていません。`);
  return L.filter(x=>x!==null).join("\n");
}
async function lineTick(){
  if(!LINE_MODE) return;
  try{
    const now=jstNowMin();
    const sentToday=Object.keys(_lineSentMem).length;
    if(sentToday>=LINE_MAX_PER_DAY) return;
    const plan=loadLinePlan()||[];
    if(!plan.length) return;
    // 計画に載せた3件だけを見る（早い者勝ちで枠が埋まる問題を排除）
    const byId={};
    for(const tc of Object.keys(allResults||{}))
      for(const m of (allResults[tc].races||[])) byId[m.race_id]=m;
    const cand=[];
    for(const p of plan){
      if(_lineSentMem[p.race_id]) continue;
      const m=byId[p.race_id];
      const pm=parsePostMin((m&&m.post)||p.post); if(pm==null) continue;
      const diff=pm-now;
      if(diff<3||diff>7) continue;

         朝の予想はオッズ無しで組むので、この時点でカードにオッズが乗っていないと
         isBattle() のオッズゲート(oddsGateOK)が落ちて全部「見送り」になる。
         オッズ自動更新が該当カードに間に合う保証が無いため、ここで単勝オッズを
         取って m に貼り、勝負判定を通す。取れたオッズは配信本体でも使い回す。 */

        win=await fetchWinOdds(m.race_id, m.post);
        if(win){
          m.hasOdds=true;
          for(const mk of (m.marks||[])){ const o=win[mk.num]; if(o){ mk.pop=o.pop; mk.odds=o.odds; } }
          if(m.ranked) for(const r of m.ranked){ const o=win[r.num]; if(o){ r.pop=o.pop; r.odds=o.odds; } }
        }
      }
      /* ★配信予定が崩れていたら、黙って消えずに「見送り」を配信する★ */
      if(!m || m.skip || (m.scratched&&m.scratched.length&&!isBattle(m)) || !isBattle(m)){
        _lineSentMem[p.race_id]=1;
        const reason = !m ? "レース情報を取得できず"
          : m.skip ? "対象外レースになったため"
          : (m.scratched&&m.scratched.length) ? `出走取消（${m.scratched.join(",")}番）で条件が崩れたため`
          : !win ? "発走までにオッズを取得できなかったため"
          : "オッズを見た結果、勝負条件を満たさなくなったため";
        const txt=`⚠ ${p.post||""} ${p.track}${p.no}R は${reason}、配信を見送ります。`;
        await fetch("line_push.php",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({race_id:p.race_id, text:txt, dry:LINE_DRY?1:0})}).catch(()=>{});
        const _dv=loadLineDeliv(); _dv.push({race_id:p.race_id,track:p.track,no:p.no,post:p.post,
          bets:[],done:true,ret:0,cancelled:true,reason}); saveLineDeliv(_dv);
        toast(`LINE見送り配信: ${p.track}${p.no}R`);
        continue;
      }
      cand.push({m, win});
    }
    for(const {m, win:preWin} of cand){
      _lineSentMem[m.race_id]=1;                        // 先にマーク（多重発火ガード）
      let win=preWin||await fetchWinOdds(m.race_id, m.post);
      let ex=await fetchExoticOdds(m.race_id);
      if(!win||!ex){
        // 発走直前のオッズは数秒で埋まることがあるので一度だけ間を置いて再取得
        await new Promise(r=>setTimeout(r,4000));
        if(!win) win=await fetchWinOdds(m.race_id, m.post);
        if(!ex)  ex=await fetchExoticOdds(m.race_id);
      }
      if(!win||!ex){
        /* ★黙って消えない★ オッズが取れなければ必ず「見送り」を配信する。
           以前は delete _lineSentMem して continue＝予告を出したのに何も届かず
           消える挙動だった（2026-08-01の配信不発）。透明性の原則（取消も見送りも通知）。 */
        const reason="発走直前にオッズを取得できなかったため";
        const txt=`⚠ ${m.post||""} ${m.track||""}${m.no}R は${reason}、配信を見送ります。`;

        const _dv=loadLineDeliv(); _dv.push({race_id:m.race_id,track:m.track||"",no:m.no,post:m.post||null,
          bets:[],done:true,ret:0,cancelled:true,reason}); saveLineDeliv(_dv);
        toast(`LINE見送り配信(オッズ取得失敗): ${m.track||""}${m.no}R`);
        continue;   // _lineSentMemは付けたまま＝二度と再送しない
      }
      /* 市場込みモデル(地方narM / 中央jraM)で並べ直し＝オッズを見た最終判断 */
      let marks=m.marks;
      try{
        const html=await fetchDecoded(shutubaURL(m.race_id));
        const ps=parseShutuba(html);
        const nums=Object.keys(ps.entries);
        const ctx={raceId:m.race_id, entries:ps.entries,
                   race:{surface:m.surface,dist:m.dist,name:m.name}, curClv:classLevelName(m.name||""),
                   raceDate:(($("#date")&&$("#date").value||"").trim()||jstTodayStr())};
        await loadLtrHorseIndex(); await loadLtrJockeyIndex();
        const scored=nums.map(num=>{
          const f=ltrFeatTweet(num,ctx,nums.length,m.track||"");
          if(f) f.pop=(win[num]&&win[num].pop)||null;
          const v=(f&&typeof ltrScore==="function")?ltrScore(f,_lineModelKey()):null;
          return {num, s:(v!=null&&isFinite(v))?v:-1e9};
        }).sort((a,b)=>b.s-a.s);
        const sym=["◎","○","▲","△","△"];
        marks=scored.slice(0,5).map((x,i)=>({mk:sym[i],num:x.num}));
      }catch(_){}
      const o=marks[0].num, t2=marks[1].num, s3=marks[2].num;
      const alloc=lineAllocate(o,t2,s3,win,ex);
      if(!alloc){
        /* ★最後の沈黙経路を塞ぐ★（2026-08-02）配分が組めない(◎の複勝オッズ欠落/1.0倍)も
           黙って消えず見送りを配信する。delete+continueだと窓が閉じるまで無音で再試行
           →結局何も届かない、が盛岡で実際に起きた。 */
        const reason="◎の複勝オッズが取得できず配分を組めなかったため";
        const txt=`⚠ ${m.post||""} ${m.track||""}${m.no}R は${reason}、配信を見送ります。`;
        await fetch("line_push.php",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({race_id:m.race_id, text:txt, dry:LINE_DRY?1:0})}).catch(()=>{});
        const _dv=loadLineDeliv(); _dv.push({race_id:m.race_id,track:m.track||"",no:m.no,post:m.post||null,
          bets:[],done:true,ret:0,cancelled:true,reason}); saveLineDeliv(_dv);
        toast(`LINE見送り配信(配分不能): ${m.track||""}${m.no}R`);
        continue;   // _lineSentMemは維持＝再送しない
      }
      const prob=(m.oProb!=null)?m.oProb:null;
      const text=lineMessage({...m,marks}, alloc, prob);
      const r=await fetch("line_push.php",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({race_id:m.race_id, text, dry:LINE_DRY?1:0})}).then(x=>x.json()).catch(()=>null);
      const st=r&&r.ok?"送信":(r&&r.reason==="no_token"?"ドライラン保存":"失敗");
      toast(`LINE配信(${st}): ${m.track||""}${m.no}R`);
      /* 総括配信用に配分を記録（結果確定後に回収率を出す） */
      const _dv=loadLineDeliv();
      _dv.push({race_id:m.race_id, track:m.track||"", no:m.no, post:m.post||null,
                bets:alloc.bets, done:false, ret:null});
      saveLineDeliv(_dv);
    }
  }catch(e){ console.warn("lineTick", e); }
  try{ await lineSummaryTick(); }catch(e){ console.warn("lineSummary", e); }
}
/* 配信済みレースの結果を拾い、全部確定したら総括を1通配信する。
   ★外れた日も必ず送る★（透明性が信頼の源。当たった日だけ送るのは盛り） */
function lineReturns(bets, pay){
  /* 配分1件ずつの払戻（円）。payはparsePayoutsの形 {tansho:[{nums,yen}],...} */
  const hitIn=(arr,c,ordered)=>{
    for(const e of (arr||[])){
      const ns=(e.nums||[]).map(x=>String(+x));
      const cs=String(c).split(/[→\-]/).map(x=>String(+x));
      if(ordered ? ns.join(",")===cs.join(",") : ns.slice().sort((a,b)=>+a-+b).join(",")===cs.slice().sort((a,b)=>+a-+b).join(","))
        return e.yen||0;
    }
    return 0;
  };
  let total=0; const rows=[];
  for(const b of bets){
    let y=0;
    if(b.k==="複勝") y=hitIn(pay.fukusho,b.c,false);
    else if(b.k==="単勝") y=hitIn(pay.tansho,b.c,false);
    else if(b.k==="馬連") y=hitIn(pay.umaren,b.c,false);
    else if(b.k==="馬単") y=hitIn(pay.umatan,b.c,true);
    else if(b.k==="ワイド") y=hitIn(pay.wide,b.c,false);
    const got=y? Math.round(b.amt*y/100) : 0;   // 払戻は100円あたり
    total+=got; rows.push({...b, got});
  }
  return {total, rows};
}
async function lineSummaryTick(){
  const dv=loadLineDeliv();
  /* ★二重送信ガードは別キーで持つ★ 配列にプロパティを生やしてもJSON化で消える */
  let sumSent=false; try{ sumSent=localStorage.getItem(_ldKey()+".sum")==="1"; }catch(_){}
  if(!dv.length || sumSent) return;
  const now=jstNowMin();
  let changed=false;
  for(const d of dv){
    if(d.done) continue;
    const pm=parsePostMin(d.post);
    if(pm!=null && now < pm+12) continue;         // 確定を待つ（発走+12分）
    try{
      const html=await fetchDecoded(resultURL(d.race_id));
      const pay=parsePayouts(html);
      if(!pay || !(pay.tansho&&pay.tansho.length)) continue;   // まだ未確定
      const r=lineReturns(d.bets, pay);
      d.done=true; d.ret=r.total; d.rows=r.rows; changed=true;
    }catch(_){}
  }
  if(changed) saveLineDeliv(dv);
  /* 全件確定 かつ 今日はもう新規配信が無い状態なら総括を送る */
  const allDone=dv.every(d=>d.done);
  const noMore=Object.keys(_lineSentMem).length>=LINE_MAX_PER_DAY || now>=21*60+30;
  if(!(allDone && (noMore || dv.length>=LINE_MAX_PER_DAY))) return;
  let inv=0, ret=0;
  const L=[`📊 本日のLINE配信 結果まとめ【${MODE==="jra"?"中央":"地方"}】`,""];
  for(const d of dv){
    if(d.cancelled){ L.push(`${d.track}${d.no}R: 見送り（${d.reason||"取消等"}）`); continue; }
    const dInv=d.bets.reduce((s,b)=>s+b.amt,0);
    inv+=dInv; ret+=(d.ret||0);
    const roi=dInv? Math.round(100*(d.ret||0)/dInv) : 0;
    L.push(`${d.track}${d.no}R: 投資${dInv.toLocaleString()}円 → 払戻${(d.ret||0).toLocaleString()}円（回収率${roi}%）`);
  }
  const troi=inv? Math.round(100*ret/inv) : 0;
  L.push("", `トータル: ${inv.toLocaleString()}円 → ${ret.toLocaleString()}円`,
         `本日の回収率 ${troi}%${troi>=100?" 🎉":""}`,
         "", "当たっても外れても毎日この形式で報告します。");
  const dateKey=((($("#date")&&$("#date").value)||"").trim()||jstTodayStr());
  const r=await fetch("line_push.php",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({race_id:dateKey+_lsummaryId(), text:L.join("\n"), dry:LINE_DRY?1:0})}).then(x=>x.json()).catch(()=>null);
  if(r&&(r.ok||r.reason==="no_token")){
    try{ localStorage.setItem(_ldKey()+".sum","1"); }catch(_){}
    toast("LINE総括配信"+(r.ok?"送信":"ドライラン保存")); }
}

/* 遅れて出す回（window.__LATE_NOW＝今の時刻・分）で、このレースはもう出さないか。発走時刻が分からないレースも出さない（終わっているかもしれないため） */
function lateStarted(post){
  if(window.__LATE_NOW==null) return false;
  const m=String(post||"").match(/^(\d{1,2}):(\d{2})$/); if(!m) return true;
  return (+m[1])*60+(+m[2]) <= window.__LATE_NOW+10;
}

/* ⏱ オッズ自動更新: 発走が近いレースがある場だけ自動で再予想（オッズ確定を反映）。
   判定・保存・ロックは既存run()そのまま＝狙い目固定(B)は崩れない。 */
let AUTO_ODDS=false, autoOddsTimer=null, autoOddsBusy=false, wakeLockObj=null;
function parsePostMin(p){ const m=/^(\d{1,2}):(\d{2})$/.exec(String(p||"").trim()); return m? (+m[1])*60+(+m[2]) : null; }
function jstNowMin(){ const d=new Date(Date.now()+9*3600e3); return d.getUTCHours()*60+d.getUTCMinutes(); }
async function autoOddsTick(){
  if(!AUTO_ODDS || autoOddsBusy) return;
  try{
    autoOddsBusy=true;
    const now=jstNowMin();
    if(!lastList || !lastList.length){ try{ await loadTracks(); }catch(_){}}
    const tcs=Object.keys(allResults||{});
    let target=null, targetPost=null;
    for(const tc of tcs){
      const races=(allResults[tc]&&allResults[tc].races)||[];
      for(const m of races){
        const pm=parsePostMin(m.post); if(pm==null||m.skip) continue;
        const diff=pm-now;
        // 発走2〜18分前でオッズ未確定（or 先行推奨のまま）のレース
        if(diff>=2 && diff<=18 && (m.hasOdds===false || (typeof isPreAim==="function"&&isPreAim(m)))){
          if(target==null || pm<targetPost){ target=tc; targetPost=pm; }
        }
      }
    }
    if(target){
      const map=MODE==="nar"?NAR_TRACK:JRA_TRACK;
      $("#status").innerHTML=`<span class="prog">⏱ 自動更新: ${map[target]||target} を再予想中（発走${String(Math.floor(targetPost/60)).padStart(2,"0")}:${String(targetPost%60).padStart(2,"0")}）…</span>`;
      const sel=$("#track"); if(sel) sel.value=target;
      await run();   // 既存フローそのまま（保存・ロック込み）
    }
  }catch(_){}
  finally{ autoOddsBusy=false; }
}
async function toggleAutoOdds(){
  AUTO_ODDS=!AUTO_ODDS;
  const b=$("#autoOddsBtn");
  if(AUTO_ODDS){
    if(b){ b.textContent="⏱ オッズ自動更新 ON"; b.style.borderColor="var(--rise)"; b.style.color="var(--rise)"; }
    autoOddsTimer=setInterval(autoOddsTick, 240e3);   // 4分ごと
    try{ if(navigator.wakeLock) wakeLockObj=await navigator.wakeLock.request("screen"); }catch(_){}
    $("#status").textContent="⏱ 自動更新ON: 発走2〜18分前のレースがある場を4分ごとに再予想（画面は点けたままで）";
    autoOddsTick();
  }else{
    if(b){ b.textContent="⏱ オッズ自動更新 OFF"; b.style.borderColor=""; b.style.color=""; }
    if(autoOddsTimer){ clearInterval(autoOddsTimer); autoOddsTimer=null; }
    try{ if(wakeLockObj){ wakeLockObj.release(); wakeLockObj=null; } }catch(_){}
    $("#status").textContent="⏱ 自動更新OFF";
  }
}

async function runWin5(){
  const MAXP=16;
  // WIN5はJRA。モードを強制的にjraへ
  const prevMode=MODE; MODE="jra";
  const date=($("#date").value||"").trim()||jstTodayStr();
  $("#out").innerHTML=""; $("#outActions").style.display="none";
  $("#status").innerHTML=`<span class="prog">WIN5対象レースを取得中…</span>`;
  let ids=[];
  try{
    const html=await fetchDecoded(win5URL());
    // win5ページから対象race_idを抽出（重複除去・出現順）
    const m=html.match(/race_id=(\d{12})/g)||[];
    ids=[...new Set(m.map(s=>s.replace("race_id=","")))];
    // JRAの5レースに限定（場コード01-10）。WIN5は必ず5レース
    ids=ids.filter(r=>{const p=+r.slice(4,6); return p>=1&&p<=10;}).slice(0,5);
  }catch(e){ $("#status").textContent="WIN5対象の取得失敗: "+e.message; MODE=prevMode; return; }
  if(ids.length<5){ $("#status").textContent="WIN5対象レースが5つ揃わない（開催日か発売状況を確認）"; MODE=prevMode; return; }
  // 各レース予想
  const races=[];
  for(let i=0;i<ids.length;i++){
    const rid=ids[i]; const no=parseInt(rid.slice(10,12),10); const tn=trackOf(rid);
    $("#status").innerHTML=`<span class="prog">予想取得中… ${tn}${no}R （${i+1}/5）</span>`;
    try{ const html=await fetchDecoded(shutubaURL(rid)); const p=await scoreRace(html,{no,race_id:rid,name:""},tn);
      races.push({rid,no,track:tn,name:p.name,firm:p.firmO,marks:p.marks,field:p.field}); }
    catch(e){ races.push({rid,no,track:trackOf(rid),name:"",firm:null,marks:[],field:0,err:true}); }
  }
  // 頭数決定 → 16点に収まるよう信頼度高い順に削る
  races.forEach(r=> r.heads = r.err? 1 : win5HeadsBase(r.firm));
  const pts=()=>races.reduce((a,r)=>a*(r.heads||1),1);
  let guard=0;
  while(pts()>MAXP && guard++<50){
    const cand=races.filter(r=>r.heads>1).sort((a,b)=>(b.firm??0)-(a.firm??0))[0];
    if(!cand) break; cand.heads--;
  }
  races.forEach(r=> r.picks = (r.marks||[]).slice(0,r.heads).map(m=>({num:m.num,name:m.name,mk:m.mk})));
  lastWin5={date, races, points:pts()};
  renderWin5(lastWin5);
  $("#status").textContent=`WIN5予想 完了（${pts()}点 = ${(pts()*100).toLocaleString()}円）`;
  MODE=prevMode;
}

/* Canvas→PNG保存。iOS Safariは<a download>が効かないので、
   Web Share API（共有シート→写真に保存/Xに投稿）→新規タブ表示の順でフォールバック */
/* 画像をクリップボードにコピー（X投稿画面で直接ペースト可能） */
async function copyCanvasToClipboard(cv){
  try{
    const blob=await new Promise(res=>cv.toBlob(res,"image/png"));
    if(!blob) throw new Error("blob失敗");
    if(navigator.clipboard && window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({"image/png":blob})]);
      toast("画像をコピーしました。X投稿画面でペーストできます");
      return true;
    }
    throw new Error("非対応");
  }catch(e){
    toast("この端末は画像コピー非対応。「画像で保存」を使ってください");
    return false;
  }
}
async function shareCanvasTweet(cv, filename, text){
  /* ★iOSのXアプリは共有シート経由だと text を捨てることがある★
     →共有前に本文をクリップボードへ。Xで本文が空なら長押し→ペーストで貼れる。
     （クリップボード書込みはユーザー操作直後でないと失敗するので最初にやる） */
  let txtCopied=false;
  try{ await navigator.clipboard.writeText(text); txtCopied=true; }catch(_){}
  const blob=await new Promise(res=>cv.toBlob(res,"image/png"));
  if(!blob){ swAlert("画像の生成に失敗しました"); return; }
  const file=new File([blob], filename, {type:"image/png"});
  // 1) 画像＋本文を共有（iOS: 共有シート→X で画像添付＋本文プリフィル）
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      if(txtCopied) toast("📋 本文コピー済み。Xで本文が空なら長押し→ペースト");
      await navigator.share({files:[file], text});
      return;
    }
  }catch(e){ if(e&&e.name==="AbortError") return; }
  // 2) フォールバック: 画像をクリップボードへ → X投稿画面(本文付き)
  let copied=false;
  try{ if(navigator.clipboard && window.ClipboardItem){ await navigator.clipboard.write([new ClipboardItem({"image/png":blob})]); copied=true; } }catch(_){}
  const xurl="https://twitter.com/intent/tweet?text="+encodeURIComponent(text);
  if(copied){ toast("画像コピー済→X画面でペーストして投稿"); window.open(xurl,"_blank"); return; }
  // 3) コピー不可端末: 画像保存＋本文だけXへ
  toast("画像を保存→Xで添付してください");
  try{ await saveCanvasPNG(cv, filename); }catch(_){}
  window.open(xurl,"_blank");
}
async function saveCanvasPNG(cv, filename){
  const blob=await new Promise(res=>cv.toBlob(res,"image/png"));
  if(!blob){ swAlert("画像の生成に失敗しました"); return; }
  // 1) Web Share API（ファイル共有対応なら最優先＝iOSで写真保存/X投稿できる）
  try{
    if(navigator.canShare){
      const file=new File([blob], filename, {type:"image/png"});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file]});
        return;
      }
    }
  }catch(e){ /* ユーザーキャンセル等は無視して次へ進まない */
    if(e && e.name==="AbortError") return;
  }
  const url=URL.createObjectURL(blob);
  // 2) <a download>（PC/Android）
  try{
    const a=document.createElement("a");
    if("download" in a){
      a.href=url; a.download=filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url),4000);
      return;
    }
  }catch(e){}
  // 3) 新規タブで開く（iOSでも長押しで写真に保存できる）
  window.open(url,"_blank");
  setTimeout(()=>URL.revokeObjectURL(url),8000);
}

function drawWin5Canvas(w5){
  /* WIN5予想画像 v2: 予想画像と同テイスト（信頼度バー・縦リスト） */

            txt:"#ffffff", muted:"#b3b3b3", sub:"#cccccc",
            mkO:"#ff7171", gold1:"#ffd43d", gold2:"#ffc700", head1:"#ffd43d", head2:"#ff7171",

  const H=headH + w5.races.length*(rowH+rowGap) + 96;

  const x=cv.getContext("2d");
  const bg=x.createLinearGradient(0,0,0,H); bg.addColorStop(0,C.bg1); bg.addColorStop(1,C.bg2);
  x.fillStyle=bg; x.fillRect(0,0,W,H);
  // ブランド演出: グロー＋斜めスピードライン
  try{ var _pd=(typeof pad!=="undefined"?pad:60);
    var _rgl=x.createRadialGradient(_pd+130,80,20,_pd+130,80,520);
    _rgl.addColorStop(0,"rgba(245,185,66,0.09)"); _rgl.addColorStop(1,"rgba(245,185,66,0)");
    x.fillStyle=_rgl; x.fillRect(0,0,W,Math.min(H,240));
    x.save(); x.globalAlpha=0.045; x.strokeStyle="#cccccc"; x.lineWidth=1;
    for(var _sx=-140;_sx<W+140;_sx+=44){ x.beginPath(); x.moveTo(_sx,0); x.lineTo(_sx+75,150); x.stroke(); }
    x.restore(); }catch(_e){}

  x.textBaseline="alphabetic";
  // ヘッダ
  const hg=x.createLinearGradient(pad,0,pad+260,0); hg.addColorStop(0,C.head1); hg.addColorStop(1,C.head2);
  roundRect(x,pad,52,10,72,5); x.fillStyle=hg; x.fill();
  x.fillStyle=C.txt; x.font="700 64px 'Saira Condensed','Noto Sans JP',sans-serif";
  x.fillText("WIN5予想", pad+30, 112);
  // 日付チップ + ブランド（右上）
  const d=w5.date.length===8?`${w5.date.slice(0,4)}.${w5.date.slice(4,6)}.${w5.date.slice(6,8)}`:w5.date;
  x.font="700 24px 'Space Mono',monospace";
  const dW=x.measureText(d).width+36;
  roundRect(x,W-pad-dW,58,dW,42,21); x.strokeStyle=C.line; x.lineWidth=1.5; x.stroke();
  x.fillStyle=C.sub; x.textAlign="center"; x.fillText(d, W-pad-dW/2, 87); x.textAlign="left";
  x.font="600 20px 'Saira Condensed',sans-serif"; x.fillStyle=C.muted; x.textAlign="right";
  x.fillText("", W-pad, 124); x.textAlign="left";
  // 点数チップ
  x.font="700 26px 'Space Mono','Noto Sans JP',monospace";
  const ptxt=`計${w5.points}点 / ${(w5.points*100).toLocaleString()}円`;
  const pW=x.measureText(ptxt).width+40;
  roundRect(x,pad+30,150,pW,46,23);
  const pg=x.createLinearGradient(pad+30,0,pad+30+pW,0); pg.addColorStop(0,C.gold1); pg.addColorStop(1,C.gold2);
  x.fillStyle=pg; x.fill();
  x.fillStyle="#221a06"; x.textAlign="center"; x.fillText(ptxt, pad+30+pW/2, 181); x.textAlign="left";
  function fbar(bx,by,w,h,val){
    roundRect(x,bx,by,w,h,h/2); x.fillStyle="#171c27"; x.fill();
    const v=Math.max(0,Math.min(100,val)), fw=Math.max(h, w*v/100);
    roundRect(x,bx,by,fw,h,h/2);

      x.fillStyle= k===0?"#fff":C.txt; x.textAlign="center";

  // ブランドバー
  try{ var _fgb=x.createLinearGradient(0,0,W,0); _fgb.addColorStop(0,"#ffd43d"); _fgb.addColorStop(1,"#ff7171");

}

function horseComment(r){
  if(!r||!r.brk||!r.brk.length) return "";
  const items=r.brk.filter(([l,v])=>l!=="基礎" && Math.abs(v)>=1.0);
  if(!items.length) return "目立った加点・減点材料は無く、平均的な内容";
  const sorted=items.slice().sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
  const phrases=[];
  for(const [l,v] of sorted){
    if(phrases.length>=2) break;
    const def=FACTOR_PHRASE[l]; if(!def) continue;
    const txt=v>=0?def.pos:def.neg;
    if(txt && !phrases.includes(txt)) phrases.push(txt);
  }
  return phrases.length?phrases.join("、")+"。":"";
}

function catSum(r, factors){
  if(!r||!r.brk) return 0;
  let s=0; for(const [l,v] of r.brk){ if(factors.includes(l)) s+=v; }
  return s;
}
/* all: そのレースのranked全馬。戻り値は num -> [{key,label,icon,stars,comment}×5カテゴリ] */
function statStarsForRace(all){
  const byCat=STAT_CATS.map(cat=>{
    const sums=all.map(r=>catSum(r,cat.factors));
    const n=sums.length||1;
    const mean=sums.reduce((a,b)=>a+b,0)/n;
    const sd=Math.sqrt(sums.reduce((a,b)=>a+(b-mean)*(b-mean),0)/n);
    return {cat, sums, mean, sd};
  });
  const out={};
  all.forEach((r,i)=>{
    out[r.num]=byCat.map(({cat,sums,mean,sd})=>{
      let stars=3;
      if(sd>=0.5){
        const z=(sums[i]-mean)/sd;
        stars = z>=1.0?5 : z>=0.35?4 : z>=-0.35?3 : z>=-1.0?2 : 1;
      }
      return {key:cat.key, label:cat.label, icon:cat.icon, stars, comment:pick(STAT_COMMENTS[cat.key][stars])};
    });
  });
  return out;
}
function statStarsHtml(stats){

async function restoreSavedPredictions(){

/* 📥 全場の予想画像を一括保存（2026-09-28）。

   PC等で共有できない場合: 1枚ずつ順番にダウンロード（ブラウザが複数DLの許可を1回聞く）。 */
async function saveAllTrackImages(){
  const date=($("#date").value||"").trim()||jstTodayStr();
  const tcs=Object.keys(allResults).filter(tc=>allResults[tc] && (allResults[tc].races||[]).length);
  if(!tcs.length){ swAlert("予想データがありません。先に全場一括で予想してください。"); return; }
  const files=[];
  for(const tc of tcs){
    const g=allResults[tc];
    const c=drawTrackCanvas(g.trackName, g.races, date, true);
    const b=c && await new Promise(rr=>c.toBlob(rr, "image/png"));
    if(b) files.push(new File([b], `${g.trackName}_推奨馬_${date}.png`, {type:"image/png"}));
  }
  if(!files.length){ swAlert("画像を作れませんでした"); return; }
  try{
    if(navigator.canShare && navigator.canShare({files})){ await navigator.share({files}); return; }
  }catch(e){ if(e && e.name==="AbortError") return; }
  for(const f of files){
    const a=document.createElement("a"); const u=URL.createObjectURL(f);
    a.href=u; a.download=f.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u), 5000);
    await new Promise(rr=>setTimeout(rr, 400));
  }
  toast(`${files.length}場の画像を保存しました`);
}

/* ===== 投稿画像の見た目（「枠の色」2026-11-13・docs/design/X_REDESIGN3_WAKU_DESIGN.md）=====
   色がつくのは2つだけ: 馬番の札＝枠の色／回収率と収支＝プラスは緑(pos)・マイナスは赤(neg)。
   ★勝負・狙い目・的中は色ではなく形で分ける（白い太枠・細い枠・点線・斜線）。地方も中央も同じ見た目。
   字と地の組み合わせは全部 4.5:1 以上。書体: 日本語＝Noto Sans JP／数字＝Barlow Condensed（/odds/fonts/ に自前で置いてある）。
   ※ 関数名の themeF・fHead などは前の案（F案）の名残り。呼ぶ側を変えないためにそのまま使っている */
function themeF(){
  return { bg:"#0e1014", card:"#181b22", row:"#232731", ink:"#f5f6f8", sub:"#9aa3b2", weak:"#3a3f4a", gold:"#f5f6f8",
           acc:"#f5f6f8", pos:"#4cc38a", neg:"#ff6b6b", accBand:"白い太枠", accFrame:"細い枠",
           JP:"'Noto Sans JP',sans-serif", SERIF:"'Noto Sans JP',sans-serif", NUM:"'Barlow Condensed','Noto Sans JP',sans-serif" };
}
/* 枠の色 [地の色, 字の色]（1白 2黒 3赤 4青 5黄 6緑 7橙 8桃） */
const F_WAKU={1:["#f4f4f4","#111111"],2:["#1a1a1a","#ffffff"],3:["#e23a2e","#ffffff"],4:["#2f73e0","#ffffff"],
              5:["#f4cf1f","#111111"],6:["#2fa35a","#ffffff"],7:["#f28c28","#111111"],8:["#f4a3c0","#111111"]};
/* 馬番と頭数から枠を計算する（データに枠が無い時だけ使う）。8頭以下＝馬番そのまま。9頭以上は外側の枠から2頭ずつ */
function fWakuCalc(num,n){
  num=+num; n=+n; if(!(num>=1) || !(n>=1) || num>n || n>16) return 0;
  if(n<=8) return num;
  const single=8-(n-8); return num<=single ? num : single+Math.floor((num-single+1)/2);
}
/* その印の馬の枠（1〜8。分からなければ 0）。印の waku → 同じレースの ranked → 頭数から計算、の順 */
function fWaku(mk, race){
  if(!mk) return 0;
  let w=+mk.waku||0;
  if(!w && race && race.ranked){ const h=race.ranked.find(function(q){ return String(q.num)===String(mk.num); }); if(h) w=+h.waku||0; }
  if(!w && race){ const n=+race.field || (race.ranked?race.ranked.length:0); if(n) w=fWakuCalc(mk.num,n); }
  return (w>=1&&w<=8)?w:0;
}
/* 書体を読み込む（失敗しても描ける。その時は代わりの書体になる） */
function ensureFFonts(){
  if(window.__fFontsP) return window.__fFontsP;
  const B="/odds/fonts/";
  const list=[ ["Barlow Condensed", B+"BarlowCondensed-500.woff2", {weight:"500"}],
               ["Barlow Condensed", B+"BarlowCondensed-700.woff2", {weight:"700"}] ];
  window.__fFontsP=Promise.allSettled(list.map(async function(a){
    const f=new FontFace(a[0],"url("+a[1]+")",Object.assign({display:"block"},a[2])); await f.load(); document.fonts.add(f); return a[0]+" "+a[2].weight; }))
    .then(function(res){ window.__fFonts=res.map(function(r){ return r.status==="fulfilled"?r.value:("NG "+String(r.reason&&r.reason.message||r.reason)); }); return window.__fFonts; });
  return window.__fFontsP;
}
/* 日付 YYYYMMDD → 「11月14日（土）」 */
function fDate(d){ d=String(d||""); if(!/^\d{8}$/.test(d)) return d;
  const w="日月火水木金土"[new Date(Date.UTC(+d.slice(0,4),+d.slice(4,6)-1,+d.slice(6,8))).getUTCDay()];
  return (+d.slice(4,6))+"月"+(+d.slice(6,8))+"日（"+w+"）"; }
/* 角の丸い四角を塗る／縁どる。fill・stroke は色（null なら描かない）。dash は点線の刻み */
function fRR(x,cx,cy,w,h,r,fill,stroke,lw,dash){
  roundRect(x,cx,cy,w,h,Math.min(r,h/2,w/2));
  if(fill){ x.fillStyle=fill; x.fill(); }
  if(stroke){ x.strokeStyle=stroke; x.lineWidth=lw||2; if(dash) x.setLineDash(dash); x.stroke(); x.setLineDash([]); }
}
/* 地を塗り、見出しを描く。見出しの右端のxを返す */
function fHead(x,T,W,pad,title,size){
  x.setLineDash([]); x.globalAlpha=1; x.shadowBlur=0; x.textBaseline="alphabetic"; x.textAlign="left";
  x.fillStyle=T.bg; x.fillRect(0,0,W,x.canvas.height);
  x.fillStyle=T.ink; x.font="900 "+size+"px "+T.JP; x.fillText(title,pad,146);
  return pad+x.measureText(title).width;
}
/* 見出しの右上の2行（右寄せ） */
function fHeadRight(x,T,W,pad,l1,l2){
  x.font="700 26px "+T.JP; x.fillStyle=T.ink; x.textAlign="right";
  if(l1) x.fillText(l1,W-pad,116); if(l2) x.fillText(l2,W-pad,152); x.textAlign="left";
  return W-pad-Math.max(l1?x.measureText(l1).width:0, l2?x.measureText(l2).width:0);
}
/* 下の注記。lines=[[文,色,太字か]] */
function fFoot(x,T,W,pad,y,lines){
  lines.forEach(function(l,i){ x.font=(l[2]?"700 24px ":"400 22px ")+T.JP; x.fillStyle=l[1]||T.sub; x.fillText(l[0],pad,y+36+i*36); });
}
/* 札（両端の丸い形）。kind: fill・ink・gold（白で塗る・黒字）／acc・goldline（白い線だけ）／dash（灰色の点線）。
   右端を xr に合わせて描き、左端のxを返す */
function fTag(x,T,xr,y,label,kind,h,fs){
  h=h||40; fs=fs||24; x.font="700 "+fs+"px "+T.JP;
  const w=Math.ceil(x.measureText(label).width)+34, x0=xr-w;
  if(kind==="fill"||kind==="ink"||kind==="gold"){ fRR(x,x0,y,w,h,h/2,T.ink,null); x.fillStyle=T.bg; }
  else if(kind==="dash"){ fRR(x,x0+1,y+1,w-2,h-2,h/2,null,T.sub,2,[7,6]); x.fillStyle=T.sub; }
  else { fRR(x,x0+1,y+1,w-2,h-2,h/2,null,T.ink,2); x.fillStyle=T.ink; }
  x.textAlign="center"; x.fillText(label,x0+w/2,y+h/2+fs*0.36); x.textAlign="left";
  return x0;
}
/* レースの箱。kind: battle・gold（白い太枠）／acc（細い枠）／dash（点線）／それ以外（枠なし） */
function fBox(x,T,cx,cy,w,h,kind){
  if(kind==="battle"||kind==="gold") fRR(x,cx,cy,w,h,18,T.card,T.ink,4);
  else if(kind==="acc") fRR(x,cx,cy,w,h,18,T.card,T.sub,2);
  else if(kind==="dash") fRR(x,cx,cy,w,h,18,T.card,T.sub,2.5,[10,8]);
  else fRR(x,cx,cy,w,h,18,T.card,null);
}
/* レース番号（字だけ） */
function fRno(x,T,cx,cy,no,kind){
  x.font="700 42px "+T.NUM; x.fillStyle=T.ink; x.textAlign="left"; x.fillText(no+"R",cx,cy+38);
}
/* 馬番の札（枠の色）。wk=枠（0＝分からない時は灰色） */
function fChip(x,T,cx,cy,s,num,wk){
  const c=F_WAKU[wk]||[T.row,T.ink];
  fRR(x,cx,cy,s,s,Math.max(6,Math.round(s/7)),c[0],(wk===2||!F_WAKU[wk])?T.weak:null,2);
  const fs=Math.round(s*0.68);
  x.font="700 "+fs+"px "+T.NUM; x.fillStyle=c[1]; x.textAlign="center"; x.fillText(String(num),cx+s/2,cy+s/2+fs*0.35); x.textAlign="left";
}
/* 枠の色の見本（8つ）。右端を xr に合わせて描き、左端のxを返す */
function fLegend(x,T,xr,y,label){
  let lx=xr;
  for(let i=8;i>=1;i--){ lx-=30; fRR(x,lx,y,30,30,5,F_WAKU[i][0],i===2?T.weak:null,2); lx-=6; }
  if(label){ x.font="400 22px "+T.JP; x.fillStyle=T.sub; x.textAlign="right"; x.fillText(label,lx-6,y+23); x.textAlign="left"; lx-=6+x.measureText(label).width; }
  return lx;
}
function drawTrackCanvas(trackName, races, date, noSave, tweetText){
  /* 場ごとの予想（F案）。載せる中身は前と同じ。変えたのは見た目だけ */
  const T=themeF();
  const W=1240, pad=48, headH=250, rowGap=28, cols=2, gutter=36;
  const cardW=(W-pad*2-gutter)/cols;
  const cardPad=22, lineH=45, cardHeadH=96;
  const cardH = cardPad*2 + cardHeadH + 78 + 4*46 - 4;   // ◎の行だけ背が高い（78）。ほかは46
  const rowsNeeded=Math.ceil(races.length/cols);
  const bodyEnd=headH + rowsNeeded*(cardH+rowGap) - rowGap;
  const H = bodyEnd + 34 + 76;
  const cv=document.createElement("canvas");
  cv.width=W; cv.height=H;
  const x=cv.getContext("2d");
  const tr=fHead(x,T,W,pad,trackName,96);
  // 見出しの横: カジ競馬／AI予想 日付 時刻
  const nowJ=new Date(Date.now()+9*3600e3);
  const z2=n=>String(n).padStart(2,"0");
  const tstr=z2(nowJ.getUTCHours())+":"+z2(nowJ.getUTCMinutes());
  x.font="700 30px "+T.JP; x.fillStyle=T.ink; const dl1="AI予想　"+fDate(date); x.fillText(dl1, tr+24, 108);
  x.font="400 22px "+T.JP; x.fillStyle=T.sub;
  let nP=0;
  // ★勝負・狙い目の数（右上の札）／見送りの数（日付の横）
  try{
    const nB=races.filter(m=>!m.skip&&isBattle(m)).length;
    const nA=races.filter(m=>!m.skip&&!isBattle(m)&&isAim(m)).length;
    nP=races.filter(m=>m.skip||isPass(m)).length;
    let tx=W-pad;
    if(nA) tx=fTag(x,T,tx,56,"狙い目 "+nA,"acc",52,28)-12;
    if(nB) fTag(x,T,tx,56,"★勝負 "+nB,"fill",52,28);
  }catch(_){}
  x.font="400 22px "+T.JP; x.fillStyle=T.sub;
  x.fillText(tstr+"時点"+(nP?("　見送り "+nP):""), tr+24, 146);
  fLegend(x,T,W-pad,124,"馬番の色は枠の色");
  // 凡例
  x.font="400 22px "+T.JP; let lx=pad;
  [["◎",T.acc,"本命"],["○",T.ink,"対抗"],["▲",T.ink,"単穴"],["△",T.sub,"押さえ"]].forEach(([sym,col,label])=>{
    x.fillStyle=col; x.fillText(sym, lx, 210); lx+=x.measureText(sym).width+2;
    x.fillStyle=T.sub; x.fillText(label, lx, 210); lx+=x.measureText(label).width+20;
  });
  x.fillStyle=T.sub; x.fillText("／　"+T.accBand+"＝★勝負　"+T.accFrame+"＝狙い目　点線＝先行推奨　斜線＝見送り", lx, 210);
  const sym2cls={ "◎":T.acc,"○":T.ink,"▲":T.ink,"△":T.sub };
  races.forEach((m,i)=>{
    const cx=pad+(i%cols)*(cardW+gutter);
    const cy=headH+Math.floor(i/cols)*(cardH+rowGap);
    const battle=isBattle(m), aim=isAim(m), preAim=isPreAim(m), pass=isPass(m);
    const hi=aim||preAim;  // 目立たせる対象（狙い目 or 先行推奨）
    if(pass) x.globalAlpha=.8;
    fBox(x,T,cx,cy,cardW,cardH, battle?"battle":aim?"acc":preAim?"dash":"plain");
    // 見送りは斜めの線を重ねて「買わない」を明示
    if(pass){

/* ===== ◎の「強み」1行（2026-11-13・docs/design/X_STRENGTH_AND_MONTHLY_DESIGN.md）=====
   その馬について事実として言えることだけを1つ出す。「AIがこの理由で選んだ」とは書かない。
   上から順に見て、最初に当てはまった1つ。どれにも当てはまらなければ null。

    if(v.length<5) return false;
    v.sort(function(a,b){ return b[1]-a[1]; });
    return v[0][0]===String(num) && v[0][1]>v[1][1];
  };
  if(top("sva")) return "近走の時計がメンバー1位";
  if(top("btf")) return "この距離の持ち時計が1位";
  if(top("afa")) return "近走の上がりがメンバー最速";
  if(local && local[1]>=5 && local[0]>=60) return "この場で3着内 "+local[1]+"走中"+Math.round(local[0]*local[1]/100)+"回";

      const rightEdge=cx+cardW-cardPad;
      if(mk.rank===1){ fTag(x,T,rightEdge,ly-(big?31:27),rankTxt(mk.rank),"ink",big?42:36,big?26:24); }   // 1着は白い札
      else { x.font=((mk.rank!=null&&mk.rank<=3)?"700 ":"400 ")+(big?28:26)+"px "+T.JP; x.fillStyle=rankColor(mk.rank);
        x.textAlign="right"; x.fillText(rankTxt(mk.rank), rightEdge, ly); x.textAlign="left"; }
      const nameX=cx+cardPad+(big?128:110);

      x.font=(big?"900 ":"500 ")+nfs+"px "+T.JP;
      x.fillStyle= pass? T.sub : T.ink;

    });
    // 的中の行
    const fy=cy+cardH-24;
    if(hit){
      const best=c.hits.reduce((a,b)=>b.yen>a.yen?b:a);
      x.font="700 24px "+T.JP; x.fillStyle=T.gold;
      x.fillText(clip(x, `${aimHit?"狙い的中":"的中"} ${best.type} ${best.combo} ${best.yen.toLocaleString()}円`, cardW-cardPad*2), cx+cardPad, fy);
    } else if(missHit){
      const best=c.hits.reduce((a,b)=>b.yen>a.yen?b:a);

    } else {
      x.font="500 22px "+T.JP; x.fillStyle=T.sub;
      x.fillText(pass?"見送り（買い目なし）":"推奨的中なし", cx+cardPad, fy);
    }
    x.globalAlpha=1;
  });
  fFoot(x,T,W,pad,bodyEnd+34,[["◎○▲△△ BOX想定の的中／配当はnetkeiba確定値",T.sub,false]]);
  if(noSave){ return cv; }
  { const dl=`${trackName}_結果_${date}.png`; if(tweetText){ shareCanvasTweet(cv, dl, tweetText); } else { saveCanvasPNG(cv, dl); } }
  return cv;
}

let checkResults=[];   // [{no,name,marks:[{mk,num,name,rank}], top3:[...]}]
let allCheck={};       // {trackCode:{trackName, races:[checkResult...]}} 全場答え合わせ
/* 推奨馬(◎○▲△)が各馬券で的中してるか判定。pay=parsePayouts結果 */
function computeHits(marks, pay){
  // 印ごとの馬番
  const byMk={}; marks.forEach(m=>{ (byMk[m.mk]=byMk[m.mk]||[]).push(String(m.num)); });
  const honmei=(byMk["◎"]||[])[0];           // ◎
  const taikou=(byMk["○"]||[])[0];           // ○
  const hits=[];
  // 1軸ぶんの的中を集める（axisMark: 表示用ラベル "◎"/"○", axis: 馬番, aite: 相手馬番配列）
  function collect(axisMark, axis, aite){
    if(!axis) return;
    const aiteSet=new Set(aite);
    const tag=(t)=>`${axisMark}${t}`;
    // 単勝・複勝は◎のみ（○の単複は買わない）
    if(axisMark==="◎"){
      (pay.tansho||[]).forEach(p=>{ if(p.nums[0]===axis) hits.push({type:"単勝", combo:p.nums.join("-"), yen:p.yen}); });
      (pay.fukusho||[]).forEach(p=>{ if(p.nums[0]===axis) hits.push({type:"複勝", combo:p.nums.join("-"), yen:p.yen}); });
    }
    const axisPair=(nums)=> nums.includes(axis) && nums.some(n=>aiteSet.has(n)&&n!==axis);
    (pay.umaren||[]).forEach(p=>{ if(axisPair(p.nums)) hits.push({type:tag("馬連"), combo:p.nums.join("-"), yen:p.yen}); });
    (pay.wide||[]).forEach(p=>{ if(axisPair(p.nums)) hits.push({type:tag("ワイド"), combo:p.nums.join("-"), yen:p.yen}); });
    (pay.umatan||[]).forEach(p=>{ if(p.nums[0]===axis && aiteSet.has(p.nums[1])) hits.push({type:tag("馬単"), combo:p.nums.join("→"), yen:p.yen}); });
    (pay.fuku3||[]).forEach(p=>{ if(p.nums.includes(axis) && p.nums.filter(n=>aiteSet.has(n)).length>=2) hits.push({type:tag("3連複"), combo:p.nums.join("-"), yen:p.yen}); });
    (pay.tan3||[]).forEach(p=>{ if(p.nums.includes(axis) && p.nums.filter(n=>aiteSet.has(n)).length>=2) hits.push({type:tag("3連単"), combo:p.nums.join("→"), yen:p.yen}); });
  }
  // ◎軸: 相手=○▲△△、 ○軸: 相手=▲△△（◎○除く）
  collect("◎", honmei, marks.filter(m=>m.mk!=="◎").map(m=>String(m.num)));
  collect("○", taikou, marks.filter(m=>m.mk!=="◎"&&m.mk!=="○").map(m=>String(m.num)));
  return hits;
}
/* 1レース分の答え合わせ: 予想pr + 結果取得 → 照合オブジェクト */
async function checkRace(pr, _tn){
  if(!pr.track && _tn) pr.track=_tn;   // 保存済み予想のレースにはtrackが無いので呼び元の場名を補完（即ツイートの【場名】用）
  /* 確定済みレースは結果が変わらないので、一度取得したらキャッシュを返して再fetchを省く（答え合わせ高速化）。
     結果待ち(未確定)はキャッシュしない＝毎回取り直して更新する。手動オーバーライドは下で毎回反映。 */
  window.CHECK_DONE=window.CHECK_DONE||{};
  if(pr.race_id && window.CHECK_DONE[pr.race_id]){
    const cached=window.CHECK_DONE[pr.race_id];
    let ovr2=pr.ovr||null;
    const _d2=(($("#date")&&$("#date").value||"").trim()||jstTodayStr()); const _t2=pr.race_id.slice(4,6);
    const lo2=getRaceOverride(_d2,_t2,pr.no); if(lo2) ovr2=lo2;
    return Object.assign({}, cached, {track:pr.track||cached.track, ovr:ovr2});
  }
  // 新馬戦など予想対象外はそのまま返す（賭けてないので答え合わせ不要）
  if(pr.skip){ return { no:pr.no, name:pr.name, track:pr.track, race_id:pr.race_id, marks:[], top3:[], pay:null, hits:null, decided:false, skip:true, skipReason:pr.skipReason }; }
  let resRows=[], pay=null, cancelReason=null;
  if(pr.race_id){
    for(let _rt=0;_rt<3;_rt++){
      try{
        let html=await fetchDecoded(resultURL(pr.race_id));
        cancelReason=raceCancelInfo(html);
        if(cancelReason) break;         // 取消確定＝一生結果が来ないのでリトライ無駄
        resRows=parseResult(html);
        pay=parsePayouts(html);
        /* ★着順だけでなく、単勝と複勝の払戻も読めた時に「取得成功」とする（2026-11-13）★
           同じ日の答え合わせを2回作ったら、複勝の的中が 28/46 と 29/46 に割れた。着順は読めたが払戻が欠けたページを
           1回で受け入れていたため（と見ている）。払戻が欠けていたら取り直す。3回やっても欠けていれば、今までどおりそのまま進む
           （発売の無い券種・確定直後で払戻がまだ出ていない場合）。 */
        if(resRows.length && pay && pay.tansho.length && pay.fukusho.length) break;      // 取得成功
      }catch(e){ resRows=[]; }
      if(_rt<2) await new Promise(r=>setTimeout(r, 1100*(_rt+1)));   // レート制限対策のバックオフ
    }
  }
  const byNum={}; resRows.forEach(r=>byNum[String(r.num)]=r);
  const marks=(pr.marks||[]).map(mk=>({ ...mk, rank:(byNum[String(mk.num)]?byNum[String(mk.num)].rank:null),
    waku:(mk.waku!=null?mk.waku:(byNum[String(mk.num)]&&byNum[String(mk.num)].waku!=null?byNum[String(mk.num)].waku:null)) }));
  const top3=resRows.filter(r=>r.rank<=3).sort((a,b)=>a.rank-b.rank).map(r=>({rank:r.rank,num:r.num,name:r.name}));
  const hits = (pay&&marks.length)? computeHits(marks, pay) : null;
  // ロックの手動オーバーライドを反映（保存後に手動変更した場合に備え再読込）
  let ovr = pr.ovr||null;
  if(pr.race_id){ const _d=(($("#date")&&$("#date").value||"").trim()||jstTodayStr()); const _t=pr.race_id.slice(4,6); const lo=getRaceOverride(_d,_t,pr.no); if(lo) ovr=lo; }
  const prj={ ...pr, ovr };
  let value=null;
  try{
    const rk2=pr.ranked||[];
    if(resRows.length && rk2.length>=5 && rk2.some(r=>r.odds!=null&&r.odds>0)){
      const mx=Math.max(...rk2.map(r=>r.s)); let Z=0; rk2.forEach(r=>Z+=Math.exp((r.s-mx)/45));
      let mkZ=0; rk2.forEach(r=>{ if(r.odds>0) mkZ+=1/r.odds; });
      const picks=[];
      rk2.forEach(r=>{ if(!(r.odds>0)||mkZ<=0) return; const pm=Math.min(0.25,Math.exp((r.s-mx)/45)/Z); const pk=(1/r.odds)/mkZ; if(pm>pk*1.3){ const rr=byNum[String(r.num)]; picks.push({num:String(r.num), pm:Math.round(pm*100), pk:Math.round(pk*100), rank:rr?rr.rank:null}); } });
      if(picks.length) value=picks;
    }
  }catch(_){}
  const _result={ no:pr.no, name:pr.name, track:pr.track||null, race_id:pr.race_id||null, marks, top3, pay, hits, decided:resRows.length>0, cancelled:!!cancelReason, cancelReason, firmO:pr.firmO, firm1:pr.firm1, ovr, pass:isPass(prj), aim:(function(){try{return isAim(prj);}catch(_){return false;}})(), battle:(function(){try{return isBattle(prj);}catch(_){return false;}})(), value };
  if(pr.race_id && (_result.decided||_result.cancelled)){ window.CHECK_DONE=window.CHECK_DONE||{}; window.CHECK_DONE[pr.race_id]=_result; }   // 確定済み・取消どちらも変わらないのでキャッシュ
  /* ★2026-07-30: 着順と払戻をサーバーにも残す★
     これまで結果を保存していたのは lab.html だけで、tweet.html の答え合わせは
     取得しても捨てていた。そのため **予想したレースの結果がサーバーに溜まらず**、
     公式の払戻確定（翌日）を待つしかなかった＝/ai/ が常に「最新確定=1日前」。
     保存する形は lab.html の savebatch と同一（{race_id, ranks, pays}）。
     ★netkeibaへの取得は増やさない★ ここで既に取得済みのものを保存するだけ。
     fire-and-forget（失敗しても答え合わせの表示には影響させない）。 */
  try{
    if(pr.race_id && _result.decided && pay && resRows.length){
      const _ranks={}; resRows.forEach(r=>{ if(r.rank!=null) _ranks[String(r.num)]=r.rank; });
      /* ★2026-08-01: 全馬の騎手・人気・馬名も保存する★
         これまで着順(ranks={馬番:着順})しか残しておらず、「戸崎が1番人気の時」
         のような騎手×人気の質問を自分のデータで答えられなかった（netkeiba依存だった）。
         resRowsは既に取得済み（netkeiba取得は増やさない）。finishersを足すだけ＝後方互換。 */
      const _finishers=resRows.filter(r=>r.num!=null).map(r=>({
        num:String(r.num), rank:(r.rank!=null?r.rank:null),
        name:(r.name||null), jockey:(r.jockey||null),
        pop:(r.pop!=null?r.pop:null), waku:(r.waku!=null?r.waku:null) }));
      if(Object.keys(_ranks).length){
        /* ★自動投稿の回では、保存が終わるのを待ってからページを閉じる（2026-11-13）★
           今までは投げっぱなし（keepalive）で、ページを閉じた後も送り続ける方式だった。この方式は同時に送れる量が合計64KBまでで、
           1日ぶん（40〜50レース）を続けて送ると後ろのレースが落ちる（と見ている）。11/12 は園田の9レースの結果がサーバーに残っていなかった。
           自動の回は keepalive を使わず、送信を window.__resSaves に積んで、夜の回の最後にまとめて待つ。 */
        const _sv=fetch("results.php?action=save",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({race_id:pr.race_id, ranks:_ranks, finishers:_finishers, pays:pay,
                               raceName:(pr.name||_result.name||null), surface:(_result.surface||pr.surface||null),
                               dist:(_result.dist||pr.dist||null),
                               date:(($("#date")&&$("#date").value||"").trim()||jstTodayStr()), mode:MODE}),
          keepalive:!LINE_AUTO}).catch(()=>{});
        if(LINE_AUTO){ (window.__resSaves=window.__resSaves||[]).push(_sv); }
      }
    }
  }catch(_){}
  return _result;
}

/* ===== 全場まとめて答え合わせ ===== */
async function checkAll(){
  const date=($("#date").value||"").trim()||jstTodayStr();
  const isTodayCheck = (date === jstTodayStr());   // 過去日なら後続の打ち切りをしない
  await preloadLocks(date, MODE);   // ロックをメモリへ
  const map=MODE==="nar"?NAR_TRACK:JRA_TRACK;
  // 全場の予想を集める。保存があればそれ、なければ runAll で取得してから
  // まず開催一覧を取得して場を確定
  $("#status").innerHTML=`<span class="prog">開催一覧を取得中…</span>`;
  let list=[];
  let _listErr="";
  try{ const html=await fetchDecoded(listURL(date)); list=parseRaceListHTML(html); }catch(e){ _listErr=String((e&&e.message)||e); }
  let tracks=[...new Set(list.map(r=>r.race_id.slice(4,6)))];
  /* ★開催一覧が取れない時は、保存してある予想から場を決める（2026-11-14）★
     中央は一覧のページが取れない回がある。ここで止まると答え合わせが丸ごと「レースなし」になる（11/14 の夜に中央の投稿が出なかった）。
     答え合わせに要るのは「予想を保存した場」だけなので、一覧が無くても進められる。 */
  if(!tracks.length){
    try{ const r=await fetch(`predictions.php?action=list&mode=${encodeURIComponent(MODE)}&date=${encodeURIComponent(date)}&_=${Date.now()}`,{headers:{Accept:"application/json"}});
      const j=r.ok?await r.json():null; tracks=[...new Set(((j&&j.records)||[]).filter(x=>x&&x.tc&&x.races&&x.races.length).map(x=>String(x.tc)))]; }catch(_){}
  }
  if(!tracks.length){ $("#status").textContent=_listErr?("一覧取得失敗: "+_listErr):"本日の開催が見つからない（日付を確認）"; return; }
  // 保存済み予想が1場でも欠けてたら、全場予想を先に作る
  // 保存済み予想だけで答え合わせ（予想の再取得・再予想はしない。予想が無い場はスキップ）
  allCheck={}; checkResults=[];
  $("#out").innerHTML=""; $("#outActions").style.display="none";
  const predByTc={}; let total=0;
  for(const tc of tracks){ let p=loadPredictions(date,tc); if(!p||!p.races||!p.races.length) p=await loadPredictionsServer(date,tc); if(p&&p.races&&p.races.length){ predByTc[tc]=p; total+=p.races.length; } }
  const haveTracks=Object.keys(predByTc);
  if(!haveTracks.length){ $("#status").textContent="保存済みの予想がありません。先に『全場まとめて予想』してください。"; return; }
  let totalDone=0;
  for(const tc of haveTracks){
    const trackName=map[tc]||("場"+tc);
    const pred=predByTc[tc];
    const races=pred.races;
    // 場の見出し
    const block=document.createElement("div"); block.className="track-block"; block.id="cb-"+tc;
    block.innerHTML=`<div class="track-block-h"><span class="tbn">${escapeHtml(trackName)}</span><span class="tbi">${races.length}R</span></div><div class="cb-cards"></div>`;
    $("#out").appendChild(block);
    const host=block.querySelector(".cb-cards");
    const trackChecks=[];
    const racesInOrder=races.slice().sort((a,b)=>a.no-b.no);   // 同一場はR番号=時系列
    let stopped=false;
    for(let i=0;i<racesInOrder.length;i++){
      totalDone++;
      const rc=racesInOrder[i];
      /* 同一場でまだ発走してない後続レースは結果が無い＝fetch無駄。最初の「結果待ち」以降は取得せず結果待ち表示のみ。
         （skip=予想対象外レースは飛ばして判定は継続する） */
      if(stopped && !rc.skip){
        const waiting={ no:rc.no, name:rc.name, track:trackName, race_id:rc.race_id||null, marks:(rc.marks||[]), top3:[], pay:null, hits:null, decided:false, firmO:rc.firmO, firm1:rc.firm1 };
        trackChecks.push(waiting); renderCheckInto(waiting, host); continue;
      }
      const _cachedHit=rc.race_id&&window.CHECK_DONE&&window.CHECK_DONE[rc.race_id];
      $("#status").innerHTML=`<span class="prog">結果照合中… ${trackName} ${rc.no}R （全体 ${totalDone}/${total}）${_cachedHit?" ⚡確定済":""}</span>`;
      const c=await checkRace(rc, trackName);
      trackChecks.push(c);
      renderCheckInto(c, host);
      /* ★打ち切るのは「当日」だけ★
         この打ち切りは「後続はまだ発走していないから取得しても無駄」という
         前提に立っている。過去日を後から答え合わせする時はその前提が崩れる
         （全レース終わっているのに、途中の1レースが読めないだけで
         以降が全部「結果待ち」になる）。実際 2026/7/28 金沢で、
         4Rの不成立を取消と判定できなかったせいで5R以降が空になった。
         過去日は素直に全レース取りに行く。 */
      if(!c.skip && !c.decided && !c.cancelled && isTodayCheck) stopped=true;
    }
    allCheck[tc]={trackName, races:trackChecks};
    // 見出しに画像ボタン

    tb.onclick=()=>saveCheckImage(tc, true);
    block.querySelector(".track-block-h").appendChild(tb);
  }
  $("#status").textContent = `全${haveTracks.length}場の答え合わせ完了。各場の「結果を画像で保存」でPNG出力。`;
  $("#outActions").style.display="flex";
  $("#imgBtn").style.display="none"; if($("#imgCopyBtn"))$("#imgCopyBtn").style.display="none"; if($("#imgTwBtn"))$("#imgTwBtn").style.display="none";
  $("#hashHint").textContent = MODE==="nar"?"#地方競馬 #答え合わせ":"#競馬 #答え合わせ";
  $("#copyAll").onclick=copyAllCheckGrouped;
  $("#copyAll").textContent="全場の結果まとめてコピー";
  { let fb=$("#fukuHitAllBtn");
    if(!fb){ fb=document.createElement("button"); fb.id="fukuHitAllBtn"; fb.className="btn-sub";
      const host=$("#outActions"); if(host) host.appendChild(fb); }
    if(fb){ fb.textContent="🎯 全場の複勝的中率を画像で"; fb.style.display="inline-block"; fb.onclick=saveFukuHitAllImage; } }
  renderRecovery();   // 回収率サマリーを先頭に挿入
  saveKaikoToServer(date);   // 実績をサーバーに蓄積（回顧用）
}

/* ===== 回顧：答え合わせ結果をサーバーに蓄積 ===== */
const KAIKO_API="kaiko.php";
async function saveKaikoToServer(date){
  if(!allCheck||!Object.keys(allCheck).length) return;
  let saved=0, failed=0;
  for(const tc in allCheck){
    const g=allCheck[tc];
    // 確定レースのみ対象（未確定・スキップは集計に影響させない）
    const races=(g.races||[]).map(c=>({
      no:c.no, name:c.name, decided:!!c.decided, skip:!!c.skip, pass:!!c.pass, firmO:(c.firmO!=null?c.firmO:null),
      marks:(c.marks||[]).map(m=>({mk:m.mk,num:m.num,name:m.name,rank:m.rank,...(m.brk?{brk:m.brk}:{})})),
      hits:(c.hits||[]).map(h=>({type:h.type,combo:h.combo,yen:h.yen}))
    }));
    // 当日サマリ（この場の回収率）
    const t=calcRecovery(tc);
    let inv=0,ret=0,hitCount=0,raceCount=0;
    for(const k in t){ inv+=t[k].inv; ret+=t[k].ret; }
    races.forEach(r=>{ if(r.decided&&!r.skip){ raceCount++; if(r.hits&&r.hits.length) hitCount++; } });
    const rec={
      key:`${date}_${tc}`, date, mode:MODE, track:g.trackName, trackCode:tc,
      ts:Date.now(), races,
      summary:{ inv, ret, hitCount, raceCount }
    };
    try{
      const r=await fetch(KAIKO_API+"?action=put",{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(rec)});
      const j=await r.json(); if(j&&j.ok) saved++; else failed++;
    }catch(e){ failed++; }
  }
  const cur=$("#status").textContent;
  $("#status").textContent = cur + (saved?`　／ 実績を保存（${saved}場）`:"") + (failed?`／保存失敗${failed}`:"");
}

/* ===== 回収率集計（◎軸流し・全場） ===== */
/* 買い方: ◎単/◎複/◎軸-相手(○▲△△4頭)の馬連馬単ワイド/3連複(◎+相手2)/3連単(◎→相手→相手) */
function calcRecovery(onlyTc, aimOnly, tier){
  const types={
    tanO:{label:"◎ 単勝", inv:0, ret:0, hit:0, races:0},
    fukuO:{label:"◎ 複勝", inv:0, ret:0, hit:0, races:0},
    umarenO:{label:"馬連 ◎-相手", inv:0, ret:0, hit:0, races:0},
    umatanO:{label:"馬単 ◎→相手", inv:0, ret:0, hit:0, races:0},
    wideO:{label:"ワイド ◎-相手", inv:0, ret:0, hit:0, races:0},
    fuku3O:{label:"3連複 ◎-相手2", inv:0, ret:0, hit:0, races:0},
    tan3O:{label:"3連単マルチ ◎", inv:0, ret:0, hit:0, races:0},
    umarenP:{label:"馬連 ○-相手", inv:0, ret:0, hit:0, races:0},
    umatanP:{label:"馬単 ○→相手", inv:0, ret:0, hit:0, races:0},
    wideP:{label:"ワイド ○-相手", inv:0, ret:0, hit:0, races:0},
    fuku3P:{label:"3連複 ○-相手2", inv:0, ret:0, hit:0, races:0},
    tan3P:{label:"3連単マルチ ○", inv:0, ret:0, hit:0, races:0},
  };
  const U=100; // 1点100円
  const findPay=(arr, pred)=>{ // 複数該当は合算（複勝/ワイド）
    let sum=0, hit=false;
    (arr||[]).forEach(p=>{ if(pred(p.nums)){ sum+=p.yen; hit=true; } });
    return {sum, hit};
  };
  // 軸1頭 + 相手group の各馬券を集計するヘルパ
  function tally(T, axis, aite, pay){
    if(!axis) return;
    // 馬連: 軸-相手（aite.length点）
    if(aite.length){
      T.umaren.races++; T.umaren.inv+=U*aite.length;
      const r=findPay(pay.umaren, ns=>ns.includes(axis)&&ns.some(n=>aite.includes(n)&&n!==axis));
      if(r.hit){ T.umaren.ret+=r.sum; T.umaren.hit++; }
    }
    // 馬単: 軸→相手（軸1着固定, aite.length点）
    if(aite.length){
      T.umatan.races++; T.umatan.inv+=U*aite.length;
      const r=findPay(pay.umatan, ns=>ns[0]===axis&&aite.includes(ns[1]));
      if(r.hit){ T.umatan.ret+=r.sum; T.umatan.hit++; }
    }
    // ワイド: 軸-相手（aite.length点）
    if(aite.length){
      T.wide.races++; T.wide.inv+=U*aite.length;
      const r=findPay(pay.wide, ns=>ns.includes(axis)&&ns.some(n=>aite.includes(n)&&n!==axis));
      if(r.hit){ T.wide.ret+=r.sum; T.wide.hit++; }
    }
    // 3連複: 軸-相手2頭（相手からC(n,2)点）
    if(aite.length>=2){
      const combos=comb(aite,2).length;
      T.fuku3.races++; T.fuku3.inv+=U*combos;
      const r=findPay(pay.fuku3, ns=>ns.includes(axis)&&aite.filter(n=>ns.includes(n)).length>=2);
      if(r.hit){ T.fuku3.ret+=r.sum; T.fuku3.hit++; }
    }
    // 3連単マルチ: 軸1頭マルチ × 相手2頭。
    //   = {軸,相手a,相手b} の3頭が着順不問で1-2-3着独占すれば的中。
    //   点数 = 相手の組合せC(n,2) × 6（3頭の順列）
    if(aite.length>=2){
      const pairs=comb(aite,2);
      const points=pairs.length*6;
      T.tan3.races++; T.tan3.inv+=U*points;
      // 的中: 確定3連単(1着2着3着)が {軸 + ある相手ペア} と一致するか
      const r=findPay(pay.tan3, ns=>{
        if(!ns.includes(axis)) return false;
        const others=ns.filter(n=>n!==axis);
        // 残り2頭がどれかの相手ペアに含まれるか（=軸+その2頭で買ってる）
        return others.length===2 && others.every(n=>aite.includes(n));
      });
      if(r.hit){ T.tan3.ret+=r.sum; T.tan3.hit++; }
    }
  }
  for(const tc in allCheck){
    if(onlyTc && tc!==onlyTc) continue;
    allCheck[tc].races.forEach(c=>{
      if(!c.decided || !c.marks || !c.marks.length) return;
      // tier指定があればそれで絞る（all=全部, rec=推奨, aim=狙い目, battle=勝負）
      if(tier){
        if(tier==="rec" && c.pass) return;
        else if(tier==="aim" && !(c.aim!=null?!!c.aim:isAim(c))) return;
        else if(tier==="battle" && !(c.battle!=null?!!c.battle:isBattle(c))) return;
        // tier==="all" は全レース（見送り含む）→ 何も除外しない
      } else {
        if(c.pass) return;   // 見送り（信頼度40未満）は買わない＝集計除外
        if(aimOnly && !(c.aim!=null?!!c.aim:isAim(c))) return;   // 狙い目だけ集計モード
      }
      const byMk={}; c.marks.forEach(m=>{ (byMk[m.mk]=byMk[m.mk]||[]).push(String(m.num)); });
      const honmei=(byMk["◎"]||[])[0];
      const taikou=(byMk["○"]||[])[0];
      const pay=c.pay||{};
      // ◎単複（◎軸のみ）
      if(honmei){
        types.tanO.races++; types.tanO.inv+=U;
        { const r=findPay(pay.tansho, ns=>ns[0]===honmei); if(r.hit){ types.tanO.ret+=r.sum; types.tanO.hit++; } }
        types.fukuO.races++; types.fukuO.inv+=U;
        { const r=findPay(pay.fukusho, ns=>ns[0]===honmei); if(r.hit){ types.fukuO.ret+=r.sum; types.fukuO.hit++; } }
      }
      // ◎軸: 相手＝○▲△△（◎以外、最大4頭）
      if(honmei){
        const aiteO=c.marks.filter(m=>m.mk!=="◎").map(m=>String(m.num));
        tally({umaren:types.umarenO,umatan:types.umatanO,wide:types.wideO,fuku3:types.fuku3O,tan3:types.tan3O}, honmei, aiteO, pay);
      }
      // ○軸: 相手＝▲△△（◎と○を除く、最大3頭）
      if(taikou){
        const aiteP=c.marks.filter(m=>m.mk!=="◎"&&m.mk!=="○").map(m=>String(m.num));
        tally({umaren:types.umarenP,umatan:types.umatanP,wide:types.wideP,fuku3:types.fuku3P,tan3:types.tan3P}, taikou, aiteP, pay);
      }
    });
  }
  return types;
}
function comb(arr,k){ const res=[]; const rec=(start,cur)=>{ if(cur.length===k){res.push(cur.slice());return;} for(let i=start;i<arr.length;i++){cur.push(arr[i]);rec(i+1,cur);cur.pop();} }; rec(0,[]); return res; }

/* calcRecovery結果を1つの合計に集約（全券種合算） */
function tierTotals(t){
  let inv=0, ret=0;
  for(const k in t){ if(t[k]&&typeof t[k]==="object"&&"inv"in t[k]){ inv+=t[k].inv; ret+=t[k].ret; } }
  return {inv, ret, rate: inv>0?Math.round(ret/inv*100):0, prof:ret-inv};
}
/* 各tierのレース数・的中レース数・◎複勝を数える */
function tierStats(tier){
  let races=0, hitRaces=0, oRun=0, oP3=0;
  for(const tc in allCheck){
    allCheck[tc].races.forEach(c=>{
      if(c.skip||!c.decided||!c.marks||!c.marks.length) return;
      if(tier==="rec" && c.pass) return;
      if(tier==="aim" && !(c.aim!=null?!!c.aim:isAim(c))) return;
      if(tier==="battle" && !(c.battle!=null?!!c.battle:isBattle(c))) return;
      // all は全部
      races++;
      if(c.hits&&c.hits.length) hitRaces++;
      const O=c.marks.find(m=>m.mk==="◎");
      if(O&&O.rank!=null){ oRun++; if(O.rank<=3)oP3++; }
    });
  }
  return {races, hitRaces, oRun, oP3, hitPct:races?Math.round(hitRaces/races*100):0, o3Pct:oRun?Math.round(oP3/oRun*100):0};
}
/* 段階別比較データをまとめて返す */
function buildBetTypeAgg(incPass){
  const BET=["単勝","複勝","ワイド","馬連","馬単","3連複","3連単"];
  const base=(t)=>{ const m=t.match(/単勝|複勝|ワイド|馬連|馬単|3連複|3連単/); return m?m[0]:t; };
  // 券種別: その券種で「買ったレース数」と「的中レース数」
  const byType={}; BET.forEach(b=>byType[b]={races:0, hit:0, ret:0});
  // 場×券種: track→bet→{n,hit}
  const trackBet={};
  for(const tc in allCheck){
    const tn=allCheck[tc].trackName;
    allCheck[tc].races.forEach(c=>{
      if(c.skip||!c.decided||!c.marks||!c.marks.length||(!incPass&&c.pass)) return;
      const hon=c.marks.find(m=>m.mk==="◎"); if(!hon) return;
      const aite=c.marks.filter(m=>m.mk!=="◎");
      // その券種を「買ったか」（◎軸で相手がいれば馬連等は成立）
      const bought={ 単勝:true, 複勝:true, ワイド:aite.length>=1, 馬連:aite.length>=1, 馬単:aite.length>=1, "3連複":aite.length>=2, "3連単":aite.length>=2 };
      // 的中した券種を集計
      const hitTypes={};
      (c.hits||[]).forEach(h=>{ const b=base(h.type); hitTypes[b]=(hitTypes[b]||0)+h.yen; });
      BET.forEach(b=>{
        if(!bought[b]) return;
        byType[b].races++;
        if(hitTypes[b]){ byType[b].hit++; byType[b].ret+=hitTypes[b]; }
        trackBet[tn]=trackBet[tn]||{};
        trackBet[tn][b]=trackBet[tn][b]||{n:0,hit:0};
        trackBet[tn][b].n++;
        if(hitTypes[b]) trackBet[tn][b].hit++;
      });
    });
  }
  return {BET, byType, trackBet};
}
function buildBetTypeBox(){
  // 券種別 的中率 ＋ 場×券種
  const bt=buildBetTypeAgg(INC_PASS);
  const hasBet=bt.BET.some(b=>bt.byType[b].races>0);
  if(!hasBet) return null;
    const tbox2=document.createElement("div"); tbox2.className="tier-box"; tbox2.id="btAggBox";
    // 券種別
    const btRows=bt.BET.map(b=>{
      const d=bt.byType[b]; if(!d.races) return "";
      const hr=Math.round(d.hit/d.races*100);
      const hcol=hr>=40?"rec-plus":hr>=15?"rec-mid":"rec-minus";
      return `<tr><td><b>${b}</b></td><td>${d.hit}/${d.races}</td><td class="${hcol}"><b>${hr}%</b></td></tr>`;
    }).join("");
    // 場×券種（的中率マトリクス）
    const tracks=Object.keys(bt.trackBet);
    let matHtml="";
    if(tracks.length){
      const head=`<tr><th>場</th>${bt.BET.map(b=>`<th>${b}</th>`).join("")}</tr>`;
      const body=tracks.map(tn=>{
        const cells=bt.BET.map(b=>{
          const d=bt.trackBet[tn][b];
          if(!d||!d.n) return `<td class="mat-na">-</td>`;
          const hr=Math.round(d.hit/d.n*100);
          const cls=hr>=40?"mat-hi":hr>=15?"mat-mid":"mat-lo";
          return `<td class="${cls}">${hr}%</td>`;
        }).join("");
        return `<tr><td class="mat-track">${escapeHtml(tn)}</td>${cells}</tr>`;
      }).join("");
      matHtml=`<div class="tier-h" style="margin-top:14px">場 × 券種 的中率</div>
        <div class="mat-scroll"><table class="mat-tbl">${head}${body}</table></div>`;
    }
    tbox2.innerHTML=`<div class="tier-h">券種別 的中率<span class="pass-chip ${INC_PASS?'on':''}" id="btPassChip">${INC_PASS?'見送り込み':'推奨のみ'}</span></div>
      <table class="tier-tbl"><tr><th>券種</th><th>的中</th><th>的中率</th></tr>${btRows}</table>
      ${matHtml}
      <div class="tier-note">その日の券種・競馬場ごとの傾向。緑=40%以上／黄=15%以上／赤=15%未満。${INC_PASS?'見送りも含む全レース集計':'推奨レースのみ集計'}。</div>`;
    const chip=tbox2.querySelector("#btPassChip");
    if(chip) chip.onclick=()=>{ INC_PASS=!INC_PASS; const _cb=$("#incPassChk"); if(_cb) _cb.checked=INC_PASS; const neo=buildBetTypeBox(); if(neo){ tbox2.replaceWith(neo); } if($("#twGenOut")&&$("#twGenOut").style.display!=="none") generateResultTweet(); };
    return tbox2;
}

/* 段階別比較データをまとめて返す */
function buildTierCompare(){
  const tiers=[["all","全レース"],["rec","推奨"],["aim","狙い目"],["battle","★勝負"]];
  return tiers.map(([key,label])=>{
    const st=tierStats(key);
    if(!st.races) return null;
    const tot=tierTotals(calcRecovery(null,false,key));
    return {key, label, ...st, rate:tot.rate, prof:tot.prof, inv:tot.inv, ret:tot.ret};
  }).filter(Boolean);
}
function recTotalROI(t){ let inv=0,ret=0; for(const k in t){ const r=t[k]; if(r&&typeof r.inv==="number"){ inv+=r.inv; ret+=r.ret; } } return inv>0?Math.round(ret/inv*100):null; }
function roiCls(v){ return v==null?"":v>=100?"roi-plus":v<80?"roi-minus":"roi-mid"; }
function buildTrackTable(map){
  const tcs=Object.keys(allCheck);
  const box=document.createElement("div"); box.className="rtt-box";
  const cell=(v)=>`<span class="rtt-c ${roiCls(v)}">${v==null?"-":v+"%"}</span>`;
  let html=`<div class="rtt-h">場別 総合回収率<span class="rtt-sub">推奨／見送込／狙い目</span></div>
  <div class="rtt-row rtt-head"><span class="rtt-tc">場</span><span class="rtt-c">R</span><span class="rtt-c">推奨</span><span class="rtt-c">見送込</span><span class="rtt-c">狙い</span></div>`;
  const vRows=[];   // 画像/ツイート用に行データを収集
  const rowFor=(name,tc)=>{ const rec=calcRecovery(tc), all=calcRecovery(tc,false,"all"), aim=calcRecovery(tc,true);
    if(!all.tanO.races) return "";
    vRows.push({name, races:rec.tanO.races, rec:recTotalROI(rec), all:recTotalROI(all), aim:recTotalROI(aim)});
    return `<div class="rtt-row"><span class="rtt-tc">${escapeHtml(name)}</span><span class="rtt-c rtt-r">${rec.tanO.races}</span>${cell(recTotalROI(rec))}${cell(recTotalROI(all))}${cell(recTotalROI(aim))}</div>`; };
  tcs.forEach(tc=>{ const name=(allCheck[tc].trackName)||map[tc]||("場"+tc); html+=rowFor(name,tc); });
  let vTotal=null;
  if(tcs.length>1){ const rec=calcRecovery(), all=calcRecovery(null,false,"all"), aim=calcRecovery(null,true);
    vTotal={name:"全場", races:rec.tanO.races, rec:recTotalROI(rec), all:recTotalROI(all), aim:recTotalROI(aim)};
    html+=`<div class="rtt-row rtt-total"><span class="rtt-tc">全場</span><span class="rtt-c rtt-r">${rec.tanO.races}</span>${cell(recTotalROI(rec))}${cell(recTotalROI(all))}${cell(recTotalROI(aim))}</div>`; }
  html+=`<div class="rtt-note">見送込＝見送りも買った場合の全レース総合。推奨が見送込より高ければ、見送り判定が負けレースを除けてる。</div>`;
  box.innerHTML=html;
  // 画像で保存＋画像付きツイート
  if(vRows.length){
    const dlabel=($("#date")&&$("#date").value)?($("#date").value):"";
    const dstr=dlabel.length===8?`${dlabel.slice(0,4)}/${dlabel.slice(4,6)}/${dlabel.slice(6,8)}`:"";
    const ib=document.createElement("button");
    ib.className="rec-copy"; ib.textContent="場別を画像で保存"; ib.style.background="var(--div)";
    ib.onclick=()=>drawVenueRecoveryCanvas(vRows, vTotal, dstr);
    box.appendChild(ib);
    const tb=document.createElement("button");
    tb.className="rec-copy"; tb.textContent="📤 画像付きでツイート";
    tb.style.cssText="margin-left:8px;margin-top:8px;background:#1d9bf0;color:#fff;border-color:#1d9bf0;font-weight:700";
    tb.onclick=()=>drawVenueRecoveryCanvas(vRows, vTotal, dstr, venueRecoveryText(vRows, vTotal));
    box.appendChild(tb);
  }
  return box;
}
/* 場別回収率のX投稿文 */
function venueRecoveryText(rows, total){
  const date=($("#date").value||"").trim()||jstTodayStr();
  const md=date.length===8?`${+date.slice(4,6)}/${+date.slice(6,8)}`:date;
  const modeLbl=MODE==="nar"?"地方":"中央";
  const pc=(v)=>v==null?"-":v+"%";
  let s=`【${md} 場別回収率】${modeLbl}\n`;
  s+=rows.map(r=>`${r.name} 推奨${pc(r.rec)}／狙い${pc(r.aim)}`).join("\n");
  if(total) s+=`\n──\n全場${total.races}R 推奨${pc(total.rec)}／見送込${pc(total.all)}／狙い${pc(total.aim)}`;
  s+=`\n${pick(["回収率は推奨全レースを分母に（外れ込み）。盛りません。","分母は買った全レース。外れを隠した回収率は嘘。","勝ったぶんだけ載せません。全部を分母に、正直に。"])}\n#競馬 ${MODE==="nar"?"#地方競馬":"#中央競馬"}`;
  return s;
}
/* 場別回収率を画像化（寒色ブランド） */
function drawVenueRecoveryCanvas(rows, total, dateStr, tweetText, noSave){
  /* 場別 回収率。100%以上＝緑、未満＝赤（本人指示 2026-11-13「プラスなら緑 マイナスは赤」） */
  const T=themeF();
  const W=1080, pad=48, headH=250, hdrRow=52, rowH=66;

/* ===== 買い方別の回収率（2026-11-14・docs/design/X_BUYWAYS_DESIGN.md）=====
   本人の依頼: 3連複の◎○2軸／3連単の◎1着固定／3連単の1着が◎か○／○から流す／○◎の2軸 も見たい。
   calcRecovery() とは別に数える（あちらの項目・総合計・投稿の文の数字は1円も変えない）。
   対象のレースは calcRecovery() と同じ（確定・印あり・見送りを除く）。1点100円。相手＝印のついた残りの馬。
   返り値: [{title, rows:[{label, pts（印5頭の時の点数）, inv, ret, hit, races}]}] */
function calcBuyways(){
  const U=100, R=(label,pts)=>({label, pts, inv:0, ret:0, hit:0, races:0});
  const B={ o1:R("3連単 ◎1着固定",12), oM:R("3連単 ◎マルチ",36), oF:R("3連複 ◎ー相手2頭",6),
            dF:R("3連複 ◎ー○ー相手",3), dOP:R("3連単 ◎→○→相手",3), dPO:R("3連単 ○→◎→相手",3), dH:R("3連単 1着が◎か○",24),
            pU:R("馬連 ○ー相手",4), pT:R("馬単 ○→相手",4), pW:R("ワイド ○ー相手",4), pF:R("3連複 ○ー相手2頭",6), p1:R("3連単 ○1着固定",12), pM:R("3連単 ○マルチ",36) };
  // 買う（点数ぶん投資）→ 当たっていれば払戻を足す。同着で複数の払戻が当てはまれば合算
  const bet=(row, points, list, pred)=>{
    if(!(points>0)) return;
    row.races++; row.inv+=U*points;
    let sum=0, hit=false; (list||[]).forEach(p=>{ const ns=(p.nums||[]).map(String); if(pred(ns)){ sum+=p.yen; hit=true; } });
    if(hit){ row.ret+=sum; row.hit++; }
  };
  for(const tc in allCheck){
    (allCheck[tc].races||[]).forEach(c=>{
      if(!c || !c.decided || !c.marks || !c.marks.length || c.pass) return;
      const all=c.marks.map(m=>String(m.num));
      const o=(c.marks.find(m=>m.mk==="◎")||{}).num, p=(c.marks.find(m=>m.mk==="○")||{}).num;
      const O=o!=null?String(o):null, P=p!=null?String(p):null, pay=c.pay||{};
      const c2=(n)=> n*(n-1)/2;
      if(O){
        const a=all.filter(n=>n!==O), n=a.length;
        bet(B.o1, n*(n-1), pay.tan3, ns=>ns[0]===O && a.includes(ns[1]) && a.includes(ns[2]));
        bet(B.oM, c2(n)*6, pay.tan3, ns=>ns.includes(O) && ns.filter(x=>x!==O).length===2 && ns.filter(x=>x!==O).every(x=>a.includes(x)));
        bet(B.oF, c2(n), pay.fuku3, ns=>ns.includes(O) && ns.filter(x=>a.includes(x)).length>=2);
      }
      if(O && P){
        const a=all.filter(n=>n!==O&&n!==P), n=a.length;
        bet(B.dF, n, pay.fuku3, ns=>ns.includes(O) && ns.includes(P) && ns.some(x=>a.includes(x)));
        bet(B.dOP, n, pay.tan3, ns=>ns[0]===O && ns[1]===P && a.includes(ns[2]));
        bet(B.dPO, n, pay.tan3, ns=>ns[0]===P && ns[1]===O && a.includes(ns[2]));
        const m=all.length-1;   // 1着を決めた時の、残りの印の頭数
        bet(B.dH, 2*m*(m-1), pay.tan3, ns=>(ns[0]===O||ns[0]===P) && ns[1]!==ns[0] && all.includes(ns[1]) && all.includes(ns[2]));
      }
      if(P){
        const a=all.filter(n=>n!==P), n=a.length;
        bet(B.pU, n, pay.umaren, ns=>ns.includes(P) && ns.some(x=>x!==P&&a.includes(x)));
        bet(B.pT, n, pay.umatan, ns=>ns[0]===P && a.includes(ns[1]));
        bet(B.pW, n, pay.wide, ns=>ns.includes(P) && ns.some(x=>x!==P&&a.includes(x)));
        bet(B.pF, c2(n), pay.fuku3, ns=>ns.includes(P) && ns.filter(x=>a.includes(x)).length>=2);
        bet(B.p1, n*(n-1), pay.tan3, ns=>ns[0]===P && a.includes(ns[1]) && a.includes(ns[2]));
        bet(B.pM, c2(n)*6, pay.tan3, ns=>ns.includes(P) && ns.filter(x=>x!==P).length===2 && ns.filter(x=>x!==P).every(x=>a.includes(x)));
      }
    });
  }
  return [ {title:"◎を軸にした買い方", rows:[B.o1,B.oM,B.oF]},
           {title:"◎と○の2頭を軸にした買い方", rows:[B.dF,B.dOP,B.dPO,B.dH]},
           {title:"○を軸にした買い方（相手は◎▲△△）", rows:[B.pU,B.pT,B.pW,B.pF,B.p1,B.pM]} ];
}

function valueStats(){
  let n=0,tanBet=0,tanHit=0,tanRet=0,fukBet=0,fukHit=0,fukRet=0,races=0,hitRaces=0;
  Object.values(allCheck||{}).forEach(c=>{
    if(!c||!c.decided||!c.value||!c.value.length) return; const pay=c.pay||{}; races++; let rHit=false;
    c.value.forEach(v=>{ n++; tanBet+=100; fukBet+=100;
      const t=(pay.tansho||[]).find(p=>(p.nums||[]).map(String).includes(String(v.num))); if(t){tanHit++;tanRet+=t.yen;rHit=true;}
      const f=(pay.fukusho||[]).find(p=>(p.nums||[]).map(String).includes(String(v.num))); if(f){fukHit++;fukRet+=f.yen;rHit=true;}
    });
    if(rHit) hitRaces++;
  });
  return {n,races,hitRaces,tanBet,tanHit,tanRet,fukBet,fukHit,fukRet};
}

  } else {

/* nar/race の結果ページから 通過順・枠・人気・馬場 を取る（parseDbRaceと同じ形で返す） */
function parseResultRace(html){
  const clean=s=>(s||"").replace(/&nbsp;/g," ").trim();
  const weather=clean((html.match(/天候\s*:\s*([^<&\/]+)/)||[])[1]);
  const baba=clean((html.match(/馬場\s*:\s*([^<&\/]+)/)||[])[1]);
  const dm=html.match(/(ダ|芝)\s*(\d{3,4})m/)||[];
  // コーナー通過順位（最終コーナーの並び）から各馬の1角位置を作る
  // 例: "1コーナー (5,7),10-6-(4,9),8"
  const corner={};
  const cm=html.match(/コーナー通過順位([\s\S]{0,1200}?)<\/table>/);
  if(cm){
    const first=(cm[1].match(/1コーナー[\s\S]{0,200}?<td[^>]*>([\s\S]*?)<\/td>/)||[])[1]
             || (cm[1].match(/<td[^>]*>([\s\S]*?)<\/td>/)||[])[1] || "";
    const txt=first.replace(/<[^>]+>/g,"").replace(/[()（）\s]/g,"");
    const order=txt.split(/[,\-=]/).map(x=>parseInt(x,10)).filter(n=>n>0);
    order.forEach((num,i)=>{ if(corner[num]==null) corner[num]=i+1; });
  }
  const rows=[];
  html.split("<tr").forEach(c=>{
    if(!/class="Rank"/.test(c)) return;
    const r=parseInt((c.match(/class="Rank">\s*(\d{1,2})\s*</)||[])[1],10);
    const waku=parseInt((c.match(/class="Num Waku(\d+)"/)||[])[1],10)||null;
    const nums=[]; c.replace(/class="Num[^"]*"[^>]*>\s*<div[^>]*>\s*(\d{1,2})\s*</g,(_,n)=>{nums.push(+n);return"";});
    const num = nums.length>=2 ? nums[1] : nums[0];
    const pop = parseInt((c.match(/class="OddsPeople[^"]*"[^>]*>\s*(\d{1,2})\s*</)||[])[1],10)||null;
    if(!r||!num) return;
    rows.push({ r, waku, num, pop, pass: corner[num]!=null ? String(corner[num]) : "" });
  });
  return { weather, baba, surface:dm[1]||null, dist:dm[2]?+dm[2]:null, rows };
}

function biasWakuOf(num,F){ if(!num||!F) return null; const rw=num/F; return rw<=0.34?"内":rw<=0.67?"中":"外"; }
function parseDbRace(html){
  const clean=s=>(s||"").replace(/&nbsp;/g," ").trim();
  const weather=clean((html.match(/天候\s*:\s*([^<&\/]+)/)||[])[1]);
  const baba=clean((html.match(/(?:ダート|芝)\s*:\s*([^<&\/]+)/)||[])[1]);
  const dm=html.match(/(ダ|芝)(左|右|直)?\s*(\d{3,4})m/)||[];
  const trs=(html.match(/<tr[\s\S]*?<\/tr>/g)||[]).filter(t=>/\/horse\//.test(t));
  const rows=trs.map(t=>{ const td=[...t.matchAll(/<td[^>]*>([\s\S]*?)<\/td>/g)].map(m=>m[1].replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim());
    return { r:parseInt(td[0],10), waku:parseInt(td[1],10)||null, num:parseInt(td[2],10), pop:parseInt(td[17],10)||null, pass:td[14]||"" }; }).filter(x=>x.r&&x.num);
  return { weather, baba, surface:dm[1]||null, dist:dm[3]?+dm[3]:null, rows };
}
function aggBias(races, filter){
  const S={逃:[0,0],先:[0,0],差:[0,0],追:[0,0]};
  const W={}; for(let i=1;i<=8;i++) W[i]=[0,0];
  /* 脚質×枠のクロス集計。
     脚質と枠を別々のグラフで出すと「外枠が強い」ように見えても、実際は
     外枠に逃げ・先行馬が偏っていただけ、というケースが頻発する。
     クロスで見れば「枠に関係なく前に行った馬が残る馬場」なのかが分かる。 */
  const zoneOf=w=>(w<=3?"内":w<=5?"中":"外");
  const X={}; ["逃","先","差","追"].forEach(st=>{ X[st]={内:[0,0],中:[0,0],外:[0,0]}; });
  let n=0;
  for(const rc of races){ if(filter && !filter(rc)) continue; n++;
    for(const row of (rc.rows||[])){
      const hit = row.r<=3 ? 1 : 0;
      if(row.style){ S[row.style][0]++; S[row.style][1]+=hit; }
      const w=row.waku;
      if(w>=1&&w<=8){ W[w][0]++; W[w][1]+=hit;
        if(row.style && X[row.style]){ const z=zoneOf(w); X[row.style][z][0]++; X[row.style][z][1]+=hit; } }
    } }
  const p=a=>a[0]?Math.round(100*a[1]/a[0]):null;
  const cross={};
  for(const st in X){ cross[st]={};
    for(const z in X[st]){ cross[st][z]={pct:p(X[st][z]), n:X[st][z][0]}; } }
  return { n, style:Object.fromEntries(Object.entries(S).map(([k,v])=>[k,{pct:p(v),n:v[0]}])),
           waku:Object.fromEntries(Object.entries(W).map(([k,v])=>[k,{pct:p(v),n:v[0]}])),
           cross };
}
