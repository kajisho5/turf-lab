let BIAS_DAY=null;
function biasTweetText(races,date,trackName){
  const md=date.length===8?`${+date.slice(4,6)}/${+date.slice(6,8)}`:date;
  const use = trackName ? races.filter(r=>r.track===trackName) : races;
  const all=aggBias(use);
  const S=all.style, W=all.waku;
  const lead=(S.逃.pct>=55||S.先.pct>=50)?"→ 前が止まらない":(S.差.pct>=40||S.追.pct>=30)?"→ 差しが決まる":"→ 脚質はフラット";
  let s=`【${md} ${trackName||(MODE==="nar"?"地方":"中央")}の傾向】${all.n}R集計\n`;
  s+=`🐎脚質別 馬券内率\n逃げ${S.逃.pct}% 先行${S.先.pct}% 差し${S.差.pct}% 追込${S.追.pct}%\n${lead}\n\n`;
  const ws=[]; for(let i=1;i<=8;i++){ if(W[i].pct!=null) ws.push(`${i}枠${W[i].pct}%`); }
  s+=`🎯枠番別 馬券内率\n${ws.join(" ")}\n`;
  const babas=[...new Set(use.map(r=>r.baba).filter(Boolean))];
  if(babas.length===1) s+=`馬場:${babas[0]}\n`;
  s+=`\n盛らない、データだけ。\n#競馬 ${MODE==="nar"?"#地方競馬":"#中央競馬"}`;
  return s;
}
function drawBiasCanvas(races,date,tweetText,trackName){
  const C={txt:"#ffffff",sub:"#cccccc",muted:"#b3b3b3",line:"#333333",cyan:"#57b8ff",grn:"#51b883"};
  const use = trackName ? races.filter(r=>r.track===trackName) : races;
  const all=aggBias(use);
  const babas=[...new Set(use.map(r=>r.baba).filter(Boolean))];
  const W=1080, pad=56;
  const H=196 + 46+4*48 + 30 + 46+8*44 + 292 + (babas.length?(50+babas.length*36):0) + 96;   // +292 = 脚質×枠クロス表(余白18+見出し38+ヘッダ28+4行×44+下余白32)
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const x=cv.getContext("2d");
  const bg=x.createLinearGradient(0,0,0,H); bg.addColorStop(0,"#0a0e16"); bg.addColorStop(1,"#121826");
  x.fillStyle=bg; x.fillRect(0,0,W,H);
  const rgl=x.createRadialGradient(pad+130,80,20,pad+130,80,520);
  rgl.addColorStop(0,"rgba(87,184,255,0.09)"); rgl.addColorStop(1,"rgba(87,184,255,0)");
  x.fillStyle=rgl; x.fillRect(0,0,W,230);
  x.save(); x.globalAlpha=0.045; x.strokeStyle="#cccccc"; x.lineWidth=1;
  for(let sx=-140;sx<W+140;sx+=44){ x.beginPath(); x.moveTo(sx,0); x.lineTo(sx+70,140); x.stroke(); }
  x.restore();
  const abg=x.createLinearGradient(0,46,0,112); abg.addColorStop(0,C.cyan); abg.addColorStop(1,C.grn);
  x.fillStyle=abg; x.fillRect(pad,46,8,66);
  x.font="700 52px 'Saira Condensed','Noto Sans JP',sans-serif";
  const tg=x.createLinearGradient(0,52,0,100); tg.addColorStop(0,"#fff"); tg.addColorStop(1,"#cccccc");
  x.save(); x.shadowColor="rgba(87,184,255,0.35)"; x.shadowBlur=16;
  x.fillStyle=tg; x.fillText(trackName ? trackName+" の傾向" : "本日の傾向", pad+24, 96); x.restore();
  x.font="600 24px 'Noto Sans JP',sans-serif"; x.fillStyle=C.muted;
  const babaLbl = babas.length===1 ? `　馬場:${babas[0]}` : "";
  x.fillText(`脚質・枠　${all.n}R集計${babaLbl}`, pad+24, 132);
  const md=date.length===8?`${date.slice(0,4)}.${date.slice(4,6)}.${date.slice(6,8)}`:date;
  x.textAlign="right"; x.fillText(md, W-pad, 96); x.textAlign="left";
  const hl=x.createLinearGradient(pad,0,W-pad,0);
  hl.addColorStop(0,C.cyan); hl.addColorStop(.45,"rgba(87,184,255,0.12)"); hl.addColorStop(1,"rgba(87,184,255,0)");
  x.fillStyle=hl; x.fillRect(pad,146,W-pad*2,2);
  const bar=(label,pct,n,y,maxW,col,h)=>{
    x.font="700 24px 'Noto Sans JP',sans-serif"; x.fillStyle=C.txt; x.fillText(label, pad+8, y+(h||26)+2);
    const bx=pad+110, bw=maxW, bh=h||24;
    roundRect(x,bx,y+6,bw,bh,bh/2); x.fillStyle="#171c27"; x.fill();
    const fw=Math.max(bh, bw*(pct||0)/100);
    roundRect(x,bx,y+6,fw,bh,bh/2);
    const g=x.createLinearGradient(bx,0,bx+fw,0); g.addColorStop(0,col); g.addColorStop(1,"#ffffff33");
    x.fillStyle=g; x.fill();
    x.font="800 26px 'Space Mono',monospace"; x.fillStyle=col;
    x.fillText((pct==null?"-":pct+"%"), bx+bw+16, y+bh+2);
    x.font="600 17px 'Space Mono',monospace"; x.fillStyle=C.muted;
    x.fillText("n"+n, bx+bw+108, y+bh+1);
  };
  let y=176;
  x.font="700 28px 'Noto Sans JP',sans-serif"; x.fillStyle=C.cyan; x.fillText("🐎 脚質別 馬券内率", pad+8, y+24); y+=44;
  const sCols={逃:"#ff7171",先:"#ffc700",差:"#57b8ff",追:"#999999"};
  ["逃","先","差","追"].forEach(k=>{ const v=all.style[k];
    bar({逃:"逃げ",先:"先行",差:"差し",追:"追込"}[k], v.pct, v.n, y, 500, sCols[k], 26); y+=48; });
  y+=26;
  x.font="700 28px 'Noto Sans JP',sans-serif"; x.fillStyle=C.cyan; x.fillText("🎯 枠番別 馬券内率", pad+8, y+24); y+=44;
  const wCols=["#51b883","#71c598","#71c598","#ffc700","#ffc700","#ff8d44","#ff9696","#ff7171"];
  for(let w=1;w<=8;w++){ const v=all.waku[w];
    bar(w+"枠", v.pct, v.n, y, 500, wCols[w-1], 22); y+=44; }

  /* ===== 脚質 × 枠 クロス表 =====
     脚質・枠を単体のグラフで見ると「外枠が強い」ように見えても、実際は外枠に
     逃げ・先行馬が偏っていただけ、というケースが多い。クロスで見ることで
     「枠に関係なく前が残る馬場」なのか「内の差しが刺さる馬場」なのかが分かる。
     ※1日分だとセルの頭数が小さいので、必ずnを併記し、n<5は枠線を付けて過信させない。 */
  y+=18;
  x.font="700 24px 'Noto Sans JP',sans-serif"; x.fillStyle=C.cyan;
  x.fillText("脚質 × 枠（3着内率）", pad+8, y+20);
  x.font="500 16px 'Noto Sans JP',sans-serif"; x.fillStyle=C.muted;
  x.fillText("カッコ内は頭数。少ないセルは参考程度に", pad+270, y+20);
  y+=38;
  const zones=["内","中","外"], zLab=["内 1-3枠","中 4-5枠","外 6-8枠"];
  const cellW=170, cellH=44, tx=pad+100;
  x.font="700 20px 'Noto Sans JP',sans-serif"; x.fillStyle=C.sub;
  x.textAlign="center";
  zones.forEach((z,i)=>{ x.fillText(zLab[i], tx+cellW*i+cellW/2, y+18); });
  x.textAlign="left";
  y+=28;
  ["逃","先","差","追"].forEach(st=>{
    x.font="700 22px 'Noto Sans JP',sans-serif"; x.fillStyle=C.txt;
    x.fillText(st, pad+14, y+29);
    zones.forEach((z,i)=>{
      const c=(all.cross && all.cross[st] && all.cross[st][z]) ? all.cross[st][z] : {pct:null,n:0};
      const cx2=tx+cellW*i+6, cw=cellW-12;
      roundRect(x, cx2, y+4, cw, cellH-8, 8);
      if(c.pct==null || !c.n){
        x.fillStyle="rgba(255,255,255,0.04)"; x.fill();
        x.font="600 18px 'Noto Sans JP',sans-serif"; x.fillStyle=C.muted;
        x.textAlign="center"; x.fillText("-", cx2+cw/2, y+30); x.textAlign="left"; return;
      }
      const t=Math.max(0, Math.min(1, c.pct/60));           // 60%で最大濃度
      x.fillStyle="rgba(58,190,214,"+(0.10+0.55*t).toFixed(3)+")"; x.fill();
      if(c.n<5){ x.strokeStyle="rgba(255,255,255,0.16)"; x.lineWidth=1; x.stroke(); }
      x.textAlign="center";
      x.font="800 22px 'Space Mono',monospace"; x.fillStyle=(c.pct>=50?"#ffffff":C.txt);
      x.fillText(c.pct+"%", cx2+cw/2-16, y+30);
      x.font="500 16px 'Noto Sans JP',sans-serif"; x.fillStyle=C.muted;
      x.fillText("("+c.n+")", cx2+cw/2+32, y+30);
      x.textAlign="left";
    });
    y+=cellH;
  });
  y+=14;

  if(babas.length){
    y+=12;
    x.font="700 24px 'Noto Sans JP',sans-serif"; x.fillStyle=C.grn; x.fillText("馬場別", pad+8, y+20); y+=38;
    const fmt=o=>["逃","先","差","追"].map(k=>o.style[k].pct!=null?`${k}${o.style[k].pct}%`:"").filter(Boolean).join(" ");
    babas.forEach(b=>{ const a=aggBias(use,r=>r.baba===b);
      x.font="600 20px 'Noto Sans JP',sans-serif"; x.fillStyle=C.txt; x.fillText(`［${b}］${a.n}R`, pad+8, y+18);
      x.fillStyle=C.sub; x.fillText(fmt(a), pad+190, y+18); y+=36; });
  }
  x.font="500 20px 'Noto Sans JP',sans-serif"; x.fillStyle=C.muted;
  x.fillText("通過順から脚質を判定（1角先頭=逃げ）／馬券内=3着以内", pad, H-34);
  x.font="700 20px 'Space Mono',monospace"; x.fillStyle=C.txt; x.textAlign="right";
  x.fillText("", W-pad, H-32); x.textAlign="left";
  const fg=x.createLinearGradient(0,0,W,0); fg.addColorStop(0,C.cyan); fg.addColorStop(1,C.grn);
  x.fillStyle=fg; x.fillRect(0,H-6,W,6);
  const dl=`傾向_${trackName||"全場"}_${date}.png`;
  if(tweetText){ shareCanvasTweet(cv, dl, tweetText); } else { saveCanvasPNG(cv, dl); }
}

/* ★文字列を返す純粋版（自動投稿フックから使う）★ */
function tierTweetText(tiers){
  const date=($("#date").value||"").trim()||jstTodayStr();
  const md=date.length===8?`${+date.slice(4,6)}/${+date.slice(6,8)}`:date;
  let lines=[`【${md} 段階別成績】${MODE==="nar"?"地方":"中央"}`];
  tiers.forEach(t=>{
    lines.push(`${t.label}：${t.races}R 的中${t.hitPct}% 回収${t.rate}%`);
  });
  /* その日の形で締め文を選ぶ。
     ★区分の並び全体を見る（2026-10-29）★ 以前は「最後の区分 − 全レース」だけで判定していたため、
     勝負行が出るようになった日に「狙い目40%なのに勝負196%」でも「自信度と成績が素直に相関」と書いてしまう。
     上がり続けた時だけ up、下がり続けた時だけ down、凸凹は mixed（盛らない）。差±2ptは同じとみなす。 */
  {
    const r=tiers.map(t=>+t.rate||0);
    const first=r[0]||0, last=r[r.length-1]||0, d=last-first;
    let nonDec=true, nonInc=true;
    for(let i=1;i<r.length;i++){ if(r[i]<r[i-1]-2) nonDec=false; if(r[i]>r[i-1]+2) nonInc=false; }
    const kind = (Math.abs(d)<=2 && nonDec && nonInc) ? "flat"
               : (d>2 && nonDec) ? "up" : (d<-2 && nonInc) ? "down" : "mixed";
    lines.push(pick(TIER_LINES[kind]));
  }
  lines.push("#競馬予想 #"+(MODE==="nar"?"地方競馬":"競馬"));
  let txt=lines.join("\n");
  while(txt.length>140 && lines.length>3){ lines.splice(1,1); txt=lines.join("\n"); }
  return txt;
}

function resultComment(rate, hitPct, hitRows, bought){
  if(!bought) return "";
  const big = hitRows.some(h=>h.yen>=5000);   // 高配当的中あり
  const huge = hitRows.some(h=>h.yen>=10000);  // 万馬券級
  if(rate!=null && rate>=200) return pick(huge?RESULT_LINES.huge:RESULT_LINES.big200);
  if(rate!=null && rate>=120) return pick(big?RESULT_LINES.big120:RESULT_LINES.plus);
  if(hitPct>=0.5) return pick(RESULT_LINES.hitting);
  if(rate!=null && rate>=80) return pick(RESULT_LINES.near);
  if(hitPct>0) return pick(RESULT_LINES.tough);
  return pick(RESULT_LINES.miss);
}
/* ★文字列を返す純粋版（自動投稿フックから使う。DOMに依存しない）★ */
function resultTweetText(){
  const date=($("#date").value||"").trim()||jstTodayStr();
  const md=date.length===8?`${+date.slice(4,6)}/${+date.slice(6,8)}`:date;
  // 的中レースを集める（推奨のみ＝見送り除外）
  const hitRows=[];
  let decided=0, bought=0, hitCount=0;
  for(const tc in allCheck){
    const tn=allCheck[tc].trackName;
    allCheck[tc].races.forEach(c=>{
      if(c.skip || !c.decided || !c.marks || !c.marks.length) return;
      decided++;
      const isP=!!c.pass;
      if(isP && !INC_PASS) return;   // 見送りは通常除外（トグルで含める）
      if(!isP) bought++;
      if(c.hits && c.hits.length){
        hitCount++;
        const O=c.marks.find(m=>m.mk==="◎");
        const best=c.hits.reduce((a,b)=>b.yen>a.yen?b:a);
        let _val=false; try{ const _bp=betPlan(c); _val=!!(_bp&&_bp.valueSpot); }catch(_){}
        hitRows.push({ tn, no:c.no, oNum:O?O.num:"", type:best.type, combo:best.combo, yen:best.yen, aim:(c.aim!=null?!!c.aim:isAim(c)), pass:isP, val:_val });
      }
    });
  }
  // 回収率
  const tAll=calcRecovery();
  const rate = tAll.tanO.inv>0 ? Math.round(tAll.tanO.ret/tAll.tanO.inv*100) : null;
  // 文章組み立て（馬名なし・数字のみ）
  let lines=[];
  lines.push(`▼朝の予想の答え合わせ`);   // 朝の予想ツイートにリプでぶら下げる前提（スレッド運用）
  lines.push(`【${md} 結果】${MODE==="nar"?"地方":"中央"}`);
  if(hitRows.length){
    // 配当の高い順、最大5件まで（文字数制限）
    hitRows.sort((a,b)=>b.yen-a.yen);
    const show=hitRows.slice(0,5);
    show.forEach(h=>{
      const star=h.pass?"▽":(h.val?"💰":(h.aim?"★":""));
      lines.push(`${star}${h.tn}${h.no}R ◎${h.oNum} ${h.type} ${h.yen.toLocaleString()}円`);
    });
    if(hitRows.length>5) lines.push(`他${hitRows.length-5}的中`);
  } else {
    lines.push("的中なし。明日へ。");
  }
  lines.push(`${INC_PASS?`全${decided}R中${hitCount}的中（見送込）`:`推奨${bought}R中${hitCount}的中`}${rate!=null?`／回収${rate}%`:""}`);
  // 妙味的中（◎人気薄×先行）が出たら強調
  const valHits=hitRows.filter(h=>h.val);
  if(valHits.length){ lines.push(`💰妙味的中${valHits.length}件（人気薄◎の先行馬）`); }
  // 成績連動の一言コメント
  const hitPct = bought>0 ? hitCount/bought : 0;
  const cmt = resultComment(rate, hitPct, hitRows, bought);
  if(cmt) lines.push(cmt);
  lines.push("#競馬予想 #"+(MODE==="nar"?"地方競馬":"競馬"));
  let txt=lines.join("\n");
  // 140字超えたら的中表示を削る
  while(txt.length>140 && lines.length>4){
    lines.splice(lines.length-3, 1);  // 末尾の的中行から削る（サマリー・タグは残す）
    txt=lines.join("\n");
    if(!lines.some(l=>l.includes("R ◎"))) break;
  }
  return txt;
}

  // 段階別（◎○合算・累積）

  s+="\n──どこまで買うか──\n"+stages.map(stLn).filter(Boolean).join("\n");

/* 的中直後の即ツイート: 【場+R+レース名】🎯券種 何倍！ を1タップでXへ */
function hitTweetText(c){
  const tn=c.track || (c.race_id?trackNameOfRid(c.race_id):"") || "";
  const head=`【${tn}${c.no}R ${(c.name||"").trim()}】`;

  const ordOf=t=>{const i=ORD.findIndex(k=>String(t||"").indexOf(k)>=0);return i<0?ORD.length:i;};
  const hits=(c.hits||[]).slice().sort((a,b)=>ordOf(a.type)-ordOf(b.type)||a.yen-b.yen);
  const mk=(c.marks||[]).filter(m=>m.rank!=null&&m.rank<=3).slice(0,3).map(m=>`${m.mk}${m.num} ${m.name} →${m.rank}着`);
  const _cd=String(c.race_id||"").slice(4,6);
  const isJra=(typeof JRA_TRACK!=="undefined"&&JRA_TRACK[_cd])?true:((typeof NAR_TRACK!=="undefined"&&NAR_TRACK[_cd])?false:(typeof MODE!=="undefined"&&MODE==="jra"));
  const tags=`#SWTURFLAB ${isJra?"#中央競馬":"#地方競馬"}`;
  let body;

    /* 的中が多い日は全部列挙するとウザいので、印の結果＋トップ配当のダイジェストに圧縮 */
    const top=hits.slice().sort((a,b)=>b.yen-a.yen).slice(0,3);
    body=(mk.length?mk.join("\n")+"\n":"")+`🎯 ${top.map(h=>`${h.type} ${(h.yen/100).toFixed(1)}倍`).join("・")} など全${hits.length}券種的中`;
  }else{
    const lines=hits.map(h=>`🎯 ${h.type} ${(h.yen/100).toFixed(1)}倍${h.yen>=1500?"！！":h.yen>=800?"！":""} 的中`);
    body=lines.join("\n")+(mk.length?"\n"+mk.join("\n"):"");
  }
  return head+"\n"+body+"\n"+tags;
}
/* ツイート文のバリエーション用（配列からランダム1つ） */
const pick=a=>a[Math.floor(Math.random()*a.length)]||"";
/* 予想画像のツイート本文（その日・その場の◎まとめ）。オッズ非依存・データ主義を明記。 */
function trackTweetText(g, date){

/* 答え合わせ画像のツイート本文（その日・その場のまとめ）。◎複勝率・推奨的中・最高配当を正直に。 */
function checkTweetText(g, date){
  const md=(date&&date.length===8)?`${+date.slice(4,6)}/${+date.slice(6,8)}`:date;
  const races=(g.races||[]).filter(c=>c.decided && !c.skip);
  let axTop3=0, axWin=0, n=0, hitR=0, bestYen=0, bestCombo="";
  const bigHits=[];
  for(const c of races){
    const ax=(c.marks||[]).find(m=>m.mk==="◎");
    if(ax && ax.rank!=null){ n++; if(ax.rank<=3)axTop3++; if(ax.rank===1)axWin++; }
    if(c.hits&&c.hits.length){ hitR++;
      for(const h of c.hits){ if(h.yen>bestYen){bestYen=h.yen;bestCombo=`${h.type} ${h.combo}`;} if(h.yen>=1500) bigHits.push({no:c.no,h}); } }
  }
  const pc=(a,b)=>b?Math.round(100*a/b):0;
  let s=`【${md} 答え合わせ】${g.trackName} ${MODE==="nar"?"地方":"中央"}\n`;
  s+=`◎の複勝(3着内) ${axTop3}/${n}（${pc(axTop3,n)}%）`;
  if(axWin) s+=` ／ ◎1着 ${axWin}本`;
  s+=`\n推奨的中 ${hitR}R`;
  if(bestYen) s+=` ／ 最高 ${bestCombo} ${yen(bestYen)}`;
  const shown=bigHits.sort((a,b)=>b.h.yen-a.h.yen).slice(0,4);
  if(shown.length) s+="\n\n"+shown.map(x=>`${x.no}R ${x.h.type} ${yen(x.h.yen)}`).join("\n");
  s+=`\n\n${pick(["数字は盛らず、結果はそのまま。","当たりも外れも正直に載せます。","盛らない、データだけ。","勝ちも負けも記録します。"])}\n#競馬 ${MODE==="nar"?"#地方競馬":"#中央競馬"}`;
  return s;
}
function checkText(c){
  const _tn2=c.track || (c.race_id?trackNameOfRid(c.race_id):"") || "";
  const head=`${_tn2}${c.no}R ${c.name||""}`.trim();
  if(c.skip) return `${head}\n（${c.skipReason||"予想対象外"}・予想対象外）`;
  if(c.cancelled) return `${head}\n（レース取消・${c.cancelReason||"開催中止"}）`;
  if(!c.decided) return `${head}\n（結果待ち）`;
  const lines=(c.marks||[]).map(m=>`${m.mk}${m.num} ${m.name} → ${rankLabel(m.rank)}`);
  let txt=`${head}\n`+lines.join("\n");
  // 推奨の的中
  if(c.hits&&c.hits.length){
    txt+="\n\n【推奨的中】\n"+c.hits.map(h=>`${h.type} ${h.combo} ${yen(h.yen)}`).join("\n");
  } else if(c.hits){ txt+="\n\n推奨的中なし"; }
  // 全配当
  const pl=payLines(c.pay);
  if(pl.length){ txt+="\n\n【全配当】\n"+pl.join("\n"); }

}

  const card=document.createElement("div"); card.className="tweet-card"+(aim?" tc-aim":"")+(aimHit?" tc-aimhit":"")+(missHit?" tc-misshit":"")+(pass?" pass":"");   // ★見送りは予想画面と同じ斜線（2026-10-29）

  if(c.skip){ body=`<span class="empty skip">${c.skipReason||"予想対象外"}・予想対象外</span>`; }
  else if(c.cancelled){ body=`<span class="empty">レース取消（${escapeHtml(c.cancelReason||"開催中止")}）</span>`; }
  else if(!c.decided){ body=`<span class="empty">結果待ち</span>`; }
  else {
    body=(c.marks||[]).map(m=>{
      const cls = mkCls(m.mk);
      const md = medal(m.rank);
      const hit = m.rank===1?'res-win':m.rank!=null&&m.rank<=3?'res-in':'res-out';
      const rtxt = md? `${md} ${m.rank}着` : (m.rank!=null? `${m.rank}着` : "着外");
      return `<span class="${cls}">${m.mk}${m.num}</span> ${escapeHtml(m.name)} <span class="res ${hit}">→ ${rtxt}</span>`;
    }).join("\n");
  }
  // 推奨の的中ブロック
  let hitsHtml="";
  if(c.decided && c.hits){
    if(c.hits.length){
      const boxCls = missHit?" hit-box-miss" : (aim?" hit-box-aim":"");
      const head = missHit?"見送り的中（取りこぼし）" : (aim?"★ 狙い的中":"推奨的中");
      hitsHtml=`<div class="hit-box${boxCls}"><div class="hit-h">${head}</div>`+
        c.hits.map(h=>`<div class="hit-row"><span class="hit-type">${h.type}</span><span class="hit-combo">${escapeHtml(h.combo)}</span><span class="hit-yen">${yen(h.yen)}</span></div>`).join("")+`</div>`;
    } else {
      hitsHtml=`<div class="hit-box miss">${aim?"狙い目だが的中なし":pass?"見送り（的中なし）":"推奨的中なし"}</div>`;
    }
  }
  // 全配当ブロック
  let payHtml="";
  const pl=c.decided?payLines(c.pay):[];
  if(pl.length){
    payHtml=`<details class="pay-fold"><summary>全配当を見る</summary><div class="pay-body">`+
      pl.map(l=>`<div class="pay-row">${escapeHtml(l)}</div>`).join("")+`</div></details>`;
  }
  const aimBadge = missHit? `<span class="misshit-tag">見送り的中</span>`
                 : aim? `<span class="aim-tag">狙い目</span>`
                 : (c.pass? `<span class="pass-tag-s">見送り</span>`:"");
  card.innerHTML=`
    <div class="tc-head">
      <div class="tc-title"><span class="rno">${c.no}R</span>${escapeHtml(c.name||"")}${aimBadge}</div>
      <button class="tc-copy">コピー</button><button class="tc-twx">🐦 X</button>${hasHit?'<button class="tc-hit">🎯即X</button>':''}
    </div>
    <div class="tc-body">${body}</div>
    ${c.decided&&c.top3&&c.top3.length?`<div class="tc-meta" style="margin-top:6px">着順 ${c.top3.map(t=>(medal(t.rank)||t.rank+'着')+" "+t.num+escapeHtml(t.name)).join(" ")}</div>`:''}
    ${hitsHtml}${payHtml}`;
  const btn=card.querySelector(".tc-copy");
  btn.onclick=()=>{ copy(checkText(c)); btn.textContent="コピー済"; btn.classList.add("done"); setTimeout(()=>{btn.textContent="コピー";btn.classList.remove("done");},1500); };
  const xbtn=card.querySelector(".tc-twx"); if(xbtn) xbtn.onclick=()=>postToX(checkText(c));
  const hbtn=card.querySelector(".tc-hit"); if(hbtn) hbtn.onclick=()=>postToX(hitTweetText(c));
  return card;
}

/* ◎複勝的中率サマリー画像（拡散用・DADS準拠）。
   その日の答え合わせから ◎の複勝(3着内)的中率を大きく見せる。単勝/複勝の的中も併記。 */
function drawFukuHitCanvas(trackName, races, date){
  const valid=(races||[]).filter(r=>!r.skip && r.marks && r.marks.length && r.decided!==false);
  if(!valid.length){ swAlert("答え合わせ結果がありません。"); return; }
  const axOf=r=>(r.marks||[]).find(m=>m.mk==="◎")||r.marks[0];
  let fukuHit=0, tanHit=0, n=0;
  const rows=[];
  valid.forEach(r=>{
    const ax=axOf(r); if(!ax||ax.rank==null) return;
    n++;
    const f=ax.rank<=3, t=ax.rank===1;
    if(f) fukuHit++; if(t) tanHit++;
    rows.push({no:r.no, num:ax.num, name:ax.name, rank:ax.rank, f, t});
  });
  if(!n){ swAlert("◎の着順が確定していません。"); return; }
  const fukuPct=Math.round(fukuHit/n*100), tanPct=Math.round(tanHit/n*100);
  // DADS準拠パレット
  const C={bg1:"#0a0e16",bg2:"#121826",panel:"#171c27",line:"#333333",txt:"#ffffff",
           muted:"#b3b3b3",sub:"#cccccc",green:"#51b883",gold:"#ffd43d",blue:"#57b8ff",red:"#ff7171"};
  const W=1080, pad=46;
  const headH=160, bigH=210, listHd=54, rowH=Math.min(52, Math.max(34, Math.floor((1180-headH-bigH-listHd-90)/Math.max(1,rows.length))));
  const H=headH+bigH+listHd+rows.length*rowH+90;
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const x=cv.getContext("2d");
  const bgg=x.createLinearGradient(0,0,0,H); bgg.addColorStop(0,C.bg1); bgg.addColorStop(1,C.bg2);
  x.fillStyle=bgg; x.fillRect(0,0,W,H);
  const rg=x.createRadialGradient(W/2,120,20,W/2,120,560);
  rg.addColorStop(0,"rgba(81,184,131,0.10)"); rg.addColorStop(1,"rgba(81,184,131,0)");
  x.fillStyle=rg; x.fillRect(0,0,W,260);
  const rr=(px,py,pw,ph,r)=>{x.beginPath();x.moveTo(px+r,py);x.arcTo(px+pw,py,px+pw,py+ph,r);x.arcTo(px+pw,py+ph,px,py+ph,r);x.arcTo(px,py+ph,px,py,r);x.arcTo(px,py,px+pw,py,r);x.closePath();};
  // アクセントバー＋タイトル
  const abg=x.createLinearGradient(0,46,0,112); abg.addColorStop(0,C.green); abg.addColorStop(1,C.blue);
  x.fillStyle=abg; x.fillRect(pad,46,8,66);
  x.font="700 52px 'Noto Sans JP',sans-serif"; x.fillStyle=C.txt;
  x.fillText("◎複勝 的中率", pad+24, 96);
  x.font="600 24px 'Noto Sans JP',sans-serif"; x.fillStyle=C.muted;
  x.fillText(`${trackName}　対象 ${n} レース`, pad+24, 132);
  if(date){ x.textAlign="right"; x.fillText(date, W-pad, 96); x.textAlign="left"; }
  // ヘアライン
  const hlg=x.createLinearGradient(pad,0,W-pad,0);
  hlg.addColorStop(0,C.green); hlg.addColorStop(1,"rgba(81,184,131,0)");
  x.fillStyle=hlg; x.fillRect(pad,148,W-pad*2,2);
  // 大きい数字（複勝率）
  let y=headH;
  rr(pad,y,W-pad*2,bigH-24,16); x.fillStyle=C.panel; x.fill(); x.strokeStyle=C.line; x.stroke();
  x.textAlign="center";
  x.textAlign="left";
  x.font="700 28px 'Noto Sans JP',sans-serif"; x.fillStyle=C.muted; x.fillText("複勝(3着内)", pad+40, y+64);
  x.font="800 64px 'Noto Sans JP',sans-serif"; x.fillStyle=(fukuPct>=100?C.gold:fukuPct>=50?C.green:C.red);
  x.fillText(fukuPct+"%", pad+40, y+134);
  x.font="600 26px 'Noto Sans JP',sans-serif"; x.fillStyle=C.sub; x.fillText(`${fukuHit} / ${n} 的中`, pad+40, y+172);
  // 右に単勝率
  x.font="700 28px 'Noto Sans JP',sans-serif"; x.fillStyle=C.muted; x.fillText("単勝(1着)", W-pad-280, y+64);
  x.font="800 64px 'Noto Sans JP',sans-serif"; x.fillStyle=C.blue; x.fillText(tanPct+"%", W-pad-280, y+134);
  x.font="600 26px 'Noto Sans JP',sans-serif"; x.fillStyle=C.sub; x.fillText(`${tanHit} / ${n} 的中`, W-pad-280, y+172);
  x.textAlign="left";
  y+=bigH;
  // レース別リスト
  x.font="700 24px 'Noto Sans JP',sans-serif"; x.fillStyle=C.muted;
  x.fillText("レース別 ◎の着順", pad, y+30); y+=listHd;
  rows.forEach(r=>{
    x.font="600 24px 'Noto Sans JP',sans-serif"; x.fillStyle=C.sub; x.fillText(r.no+"R", pad+4, y+rowH*0.62);
    x.fillStyle=C.txt; x.font="700 24px 'Noto Sans JP',sans-serif";
    x.fillText(`◎${r.num} ${String(r.name||"").slice(0,10)}`, pad+90, y+rowH*0.62);
    const medal=r.rank===1?"🥇":r.rank===2?"🥈":r.rank===3?"🥉":r.rank+"着";
    x.textAlign="right";
    x.fillStyle=r.f?C.green:C.red; x.font="700 24px 'Noto Sans JP',sans-serif";
    x.fillText(r.f?`複勝的中 ${medal}`:`圏外 ${medal}`, W-pad, y+rowH*0.62);
    x.textAlign="left";
    x.strokeStyle=C.line; x.lineWidth=1; x.beginPath(); x.moveTo(pad,y+rowH-6); x.lineTo(W-pad,y+rowH-6); x.stroke();
    y+=rowH;
  });
  // フッター
  x.font="500 20px 'Noto Sans JP',sans-serif"; x.fillStyle=C.muted;
  x.fillText("◎の複勝的中率", pad, H-34);
  x.textAlign="right"; x.font="700 20px 'Noto Sans JP',sans-serif"; x.fillStyle=C.txt;
  x.fillText("#"+trackName+"競馬 #答え合わせ", W-pad, H-32); x.textAlign="left";
  const fgb=x.createLinearGradient(0,0,W,0); fgb.addColorStop(0,C.green); fgb.addColorStop(1,C.blue);
  x.fillStyle=fgb; x.fillRect(0,H-6,W,6);
  saveCanvasPNG(cv, `複勝的中率_${trackName}_${(date||"").replace(/\D/g,"")}.png`);
}

/* 答え合わせを時系列（R番号順）で1レース1行にまとめたツイート文。

function timelineCheckText(tn){

  const medal=r=>r===1?"🥇":r===2?"🥈":r===3?"🥉":(r!=null?r+"着":"—");
  let hitCount=0;
  const lines=list.map(c=>{
    const ax=(c.marks||[]).find(m=>m.mk==="◎")||c.marks[0];
    const axr=ax&&ax.rank!=null?medal(ax.rank):"—";
    // 的中の最高配当

    return `${c.no}R ◎${axr}${hitStr}`;
  });
  const head=`【${tn||""} 結果まとめ】的中${hitCount}/${list.length}R`;
  return [head, lines.join("\n"), "#"+(tn||"")+"競馬 #答え合わせ #SWTURFLAB"].join("\n");
}

const REASON_LABEL={

function reasonLine(m, maxItems){

/* ◎の「抜け出し度」で買い方を推奨する。

   1,884Rの実測（GBMスコアで層別）:

/* ★勝負の境目（時計つきモデル用）と、抜け具合 c の計算。c は全頭の点数から出す（点数の単位に依らない） */
const BATTLE_C = 0.4922;
function battleC(m){
  const rk=(m&&m.ranked)||[];
  const ss=rk.map(function(x){ return x&&x.s; }).filter(function(v){ return typeof v==="number" && isFinite(v); });
  if(ss.length<5 || ss.length!==rk.length) return null;
  const srt=ss.slice().sort(function(a,b){ return b-a; });
  const spread=(srt[0]-srt[srt.length-1])||1;
  const mean=ss.reduce(function(a,b){ return a+b; },0)/ss.length;
  return 0.6*(srt[0]-mean)/spread + 0.4*(srt[0]-srt[1])/spread;
}
function betGap(m){

/* ===== モデルの得手不得手マップ =====

   値は全体複勝率(NAR62.1% / JRA58.7%)からの差分(pt)。
   例: 大井は-13.8pt（うちのモデルが特に苦手）、浦和は+11.2pt（得意）。
   頭数は別途: 少頭数(~9)が得意、多頭数(14~)が苦手（NAR -23pt）。 */
const MODEL_STRENGTH={
  nar:{ overall:62.1,
    track:{"浦和":11.2,"園田":7.1,"金沢":5.4,"笠松":5.1,"名古屋":4.3,"門別":1.1,"高知":-2.7,"佐賀":-2.7,"川崎":-3.2,"盛岡":-6.2,"船橋":-10.3,"大井":-13.8} },
  jra:{ overall:58.7,
    track:{"小倉":12.7,"新潟":11.1,"東京":1.3,"福島":1.1,"京都":0.3,"阪神":-1,"中山":-11.5,"函館":-12.7} }
};
/* 競馬場＋頭数から、その日のモデル得意度を返す（−3以下=苦手, +3以上=得意）。 */
function modelStrength(trackName, field){
  const t=(MODE==="nar")?MODEL_STRENGTH.nar:MODEL_STRENGTH.jra;
  let d = (t.track[trackName]!=null) ? t.track[trackName] : 0;
  // 頭数補正（多頭数は苦手）
  if(field>=14) d -= 8;
  else if(field<=9) d += 4;

  else if(d>=3){ lv="やや得意"; col="#71c598"; }

/* 危険な1番人気の検出。

     通常の1番人気     複勝率 NAR74% / JRA66%
     うちで◎(1位)評価   NAR83% / JRA73%（むしろ鉄板）
     うちで4位以下      NAR60% / JRA57%（-9〜14pt、危険）
   この危険信号が出るレースで、人気馬を嫌ってうちの◎から入ると
   複ROIは NAR98% / JRA112%（人気馬が飛ぶと配当が跳ねるため）。
   ※これは「当てる」ためではなく「負けを避ける／妙味を拾う」ための逆張り情報。
     ◎で消し切るのではなく、あくまで注意喚起として出す。 */
function dangerFav(m){
  if(!m || m.skip) return null;
  const rk=m.ranked||[];
  if(rk.length<4) return null;
  // 1番人気の馬を探す（pop===1）
  let favIdx=-1;
  for(let i=0;i<rk.length;i++){ if(rk[i].pop===1){ favIdx=i; break; } }
  if(favIdx<0) return null;                 // オッズ未取得なら判定不能
  if(favIdx>=3){                            // スコア順で4番手以下（index3以上）
    return { num:rk[favIdx].num, name:rk[favIdx].name, srank:favIdx+1,

}
/* 展開予想の文章化: 各馬の実測コーナー位置(cornerProf/実測先行力)とAI予測順から
   「テン→4角→結末」のストーリーを組み立てる。全て観測データ＋AI予測ベース（盛らない）。 */
function raceFlowText(m){
  const rk=m.ranked||[]; if(rk.length<6) return "";
  const H=rk.map((hh,i)=>{ const ff=(hh.brk||[]).find(z=>z[0]==="実測先行力");
    const fa=ff?(0.5-ff[1]/10):null; const cp=hh.cornerProf||{};
    const st=(cp.st!=null?cp.st:fa), c4=(cp.c4!=null?cp.c4:(cp.c3!=null?cp.c3:fa));
    return {nm:String(hh.name||"").slice(0,9), mk:hh.mk||"", ky:hh.kyaku||"", st:st, c4:c4, goal:i};
  }).filter(hh=>hh.st!=null||hh.c4!=null);
  if(H.length<Math.max(5,Math.floor(rk.length*0.6))) return "";
  const byS=H.slice().sort((a,b)=>((a.st!=null?a.st:0.5)-(b.st!=null?b.st:0.5)));
  const by4=H.slice().sort((a,b)=>((a.c4!=null?a.c4:0.5)-(b.c4!=null?b.c4:0.5)));
  const byG=H.slice().sort((a,b)=>a.goal-b.goal);
  const ax=H.find(hh=>hh.mk==="◎");
  const pos=(arr,hh)=>arr.indexOf(hh)+1;
  const nige=rk.filter(hh=>hh.kyaku==="逃げ").length, sen=rk.filter(hh=>hh.kyaku==="先行").length;
  /* 前圧=逃げ×2+先行 でペース感を推定（逃げ不在でも先行多数なら流れる） */
  const press=nige*2+sen;
  const pace=press>=7?"ハイペース想定":press>=5?"やや速いペース":press>=3?"平均ペース":"スロー想定";
  const parts=[];
  if(ax && byS[0]===ax) parts.push(`テン: ◎${ax.nm}が先手を主張（先行勢${nige+sen}頭・${pace}）`);
  else parts.push(`テン: ${byS[0].mk?byS[0].mk:""}${byS[0].nm}が先手${ax?`、◎${ax.nm}は${pos(byS,ax)}番手`:""}（先行勢${nige+sen}頭・${pace}）`);
  if(ax){
    const p4=pos(by4,ax);
    const move=(ax.c4!=null&&ax.st!=null)?(ax.c4-ax.st):0;
    parts.push(`4角: ◎は${p4}番手${move<=-0.08?"へ押し上げ":move>=0.08?"と位置を下げつつ":"をキープし"}直線へ`);
  }

               .sort((a,b)=>(b.st-b.c4)-(a.st-a.c4))[0];
  if(surge) parts.push(`外から${surge.mk||""}${surge.nm}が進出`);
  const g1=byG[0], g2=byG[1], g3=byG[2];

  const verb=w<=0.3?"そのまま押し切り":w<=0.55?"抜け出して":"差し切って";
  if(g1) parts.push(`結末(AI予測): ${g1.mk||""}${g1.nm}が${verb}1着、2着${g2?(g2.mk||"")+g2.nm:"-"}・3着${g3?(g3.mk||"")+g3.nm:"-"}`);
  return parts.join(" → ");
}
/* レースの見どころを1行で言語化する。
   スコア・脚質構成・展開・危険人気馬など、データから読み取れる事実だけを組み立てる。
   ※「盛らない」ため、断定や煽りはせず、観測できることだけを述べる。 */
function raceFocus(m, maxN){
  if(!m || m.skip) return "";
  const rk=m.ranked||[]; if(rk.length<3) return "";
  const gap=betGap(m);
  const o=rk[0], p=rk[1], t=rk[2];
  const field=m.field||rk.length;
  const dist=m.dist||0, surf=m.surface||"";
  /* ★2026-07-26追加: ばんえい(帯広=65)は脚質・距離帯・芝ダ適性・道悪前有利が
     根本的に無意味（200m固定・そりを曳く・障害2つ・脚質概念なし）。にもかかわらず
     raceFocus()は全レース共通の候補文を使っていたため「スロー濃厚」等、
     ばんえいでは意味を成さない文言が出ていた（ユーザー報告で発覚）。
     banei向けは専用の候補セット（馬体重・体重増減・斤量・近走の安定感等、
     baneiScoreが実際に使っている生値に基づく）に差し替える。 */
  const isBanei = !!(m.race_id && String(m.race_id).slice(4,6)==="65");
  /* 候補を {pri, txt} で貯め、優先度順に上位3つを採用。全て観測できる事実ベース（盛らない）。 */
  const cand=[]; const add=(pri,txt)=>{ if(txt) cand.push({pri,txt}); };
  const nm=(h)=>String(h&&h.name||"").slice(0,10);
  const jk=(h)=>String(h&&h.jockey||"").replace(/[\s\u3000]/g,"").slice(0,4);

  /* 交流戦の検出（JRA×地方の交流競走）。レース名で判定する（所属アイコンは地方主催では
     地元馬に付かないことがあり、アイコン有無での判定は誤検出するため使わない）。
     交流戦は近走着順の比較が難しく、地方の着順基準だとJRA馬を過小評価しやすい。
     補正は検証データが無いため入れず、「評価が不安定になりやすい」ことを正直に開示する。 */
  const _rname = String(m.name||"");
  const isKoryu = /交流|ＪＲＡ交|JRA交|Ｊ交|Ｊ指|ダートグレード|重賞交流/.test(_rname);
  if(isKoryu) add(99, `JRA・地方の交流戦（近走着順の比較が難しく評価は不安定）`);

  // 脚質構成
  let nige=0,sen=0,sashi=0,oi=0,jizai=0;
  rk.forEach(h=>{ const k=h.kyaku;
    if(k==="逃げ")nige++; else if(k==="先行")sen++; else if(k==="差し")sashi++;
    else if(k==="追い込み")oi++; else if(k==="自在")jizai++; });
  const front=nige+sen, back=sashi+oi;
  const distBin = dist<=1200?"短":dist<=1600?"マイル":dist<=1900?"中":"長";

  /* ① ◎の力関係（gap・7段階） */
  if(gap!=null){
    if(gap>=14) add(96, `◎${nm(o)}が実力別格`);
    else if(gap>=10) add(93, `◎${nm(o)}が能力最上位`);
    else if(gap>=7) add(87, `◎${nm(o)}が一枚上`);
    else if(gap>=5) add(72, `◎${nm(o)}がやや抜けた存在`);
    else if(gap>=3.5) add(60, `◎${nm(o)}中心も詰めどころ`);
    else if(gap<=1) add(82, "上位ほぼ横一線、大混戦");
    else if(gap<=2) add(72, "上位拮抗の接戦");
    else if(gap<=3) add(64, "上位実力伯仲");
  }
  /* ② ◎○▲の三つ巴 */
  if(gap!=null && gap<=2.5 && (rk[1].s-rk[2].s)<=2.5)
    add(70, `◎${nm(o)}○${nm(p)}▲${nm(t)}の三つ巴`);
  /* ③④⑤ 脚質対比・展開（ばんえいは脚質概念そのものが無い＝除外。ここが「スロー濃厚」
     等の意味不明な文言の発生源だった。nige/sen/sashi/oiが常に0になり、
     nige===0＆sen<=1の分岐が毎レース機械的にヒットしていた） */
  if(!isBanei){
    /* ③ ◎と○の脚質対比 */
    if(o.kyaku && p.kyaku && o.kyaku!==p.kyaku){
      const fA=(o.kyaku==="逃げ"||o.kyaku==="先行"), fB=(p.kyaku==="逃げ"||p.kyaku==="先行");
      if(fA && !fB) add(58, `先行の◎に差し脚の○${nm(p)}が迫る`);
      else if(!fA && fB) add(58, `末脚の◎を先行の○${nm(p)}がリード`);
    }
    /* ④ ◎と○が同型 */
    if(o.kyaku && o.kyaku===p.kyaku){
      if(o.kyaku==="逃げ") add(66, `◎${nm(o)}と○${nm(p)}の先手争いが焦点`);
      else if(o.kyaku==="追い込み") add(58, "上位2頭とも追い込み、展開待ち");
    }
    /* ⑤ 展開（脚質構成を細かく） */
    if(nige>=5) add(80, "逃げ馬多数、激流のハイペース必至");
    else if(nige>=4) add(76, "逃げ4頭、先行争い激化でペース速く");
    else if(nige>=3) add(68, "逃げ複数でペース速化も");
    else if(nige===2) add(56, "逃げ2頭、主導権争いに注目");
    else if(nige===1){
      const ni=rk.find(h=>h.kyaku==="逃げ");
      if(ni===o) add(76, "◎の単騎逃げが濃厚、粘り込み狙い");
      else if(ni) add(62, `${nm(ni)}の単騎逃げに警戒`);
    } else if(nige===0){
      if(sen>=3) add(66, "逃げ不在、先行勢の押し出し");
      else if(sen<=1) add(64, "前に行く馬が手薄、スロー濃厚");
      else add(54, "逃げ不在で先行馬有利の展開");
    }
    if(back >= field*0.6 && nige<=1) add(66, "差し追い込み優勢、展開ひとつで波乱も");
    else if(front >= field*0.6) add(58, "先行馬中心、前残りの傾向");
    if(jizai>=3) add(48, "自在型が多く隊列が読みにくい");
  }

  /* ⑥ 頭数（脚質に依存しないのでばんえいもそのまま使う） */
  if(field<=6) add(54, "少頭数で紛れ少なく実力どおりか");
  else if(field<=8) add(46, "手頃な頭数で堅めの決着も");
  else if(field>=16) add(68, "フルゲート、揉まれ弱い馬に注意");
  else if(field>=14) add(62, "多頭数で紛れ含み、波乱含み");

  /* ⑦ 距離帯（ばんえいは200m固定で無意味） */
  if(!isBanei){
    if(distBin==="短") add(42, "スピード優先の短距離戦");
    else if(distBin==="長") add(46, "長距離、折り合いとスタミナ勝負");
  }

  /* ⑧ 地方の逃げ妙味 */
  if(MODE==="nar" && o.kyaku==="逃げ" && front<=3 && gap!=null && gap>=4)
    add(85, "◎が楽に運べる絶好の展開");

  /* ⑨ ◎の近走（past5から詳細に） */
  if(o.past5 && o.past5.length>=2){
    const rs=o.past5.map(x=>x.rank).filter(v=>v!=null&&isFinite(v));
    const ps=o.past5.map(x=>x.pop).filter(v=>v!=null&&isFinite(v));
    if(rs.length>=3){
      const in3=rs.filter(v=>v<=3).length;
      if(in3===rs.length) add(74, `◎は直近${rs.length}走すべて3着内の堅実さ`);
      else if(in3>=rs.length-1) add(62, "◎は近走ほぼ崩れず安定");
      else if(in3===0) add(58, "◎は近走苦戦もモデルは高評価");
      if(rs[0]<rs[1] && rs[1]<rs[2]) add(60, "◎は着順を上げてきた上昇度");
      else if(rs[0]>rs[1] && rs[1]>rs[2]) add(50, "◎は近走やや下降、巻き返し狙い");
    }
    if(rs[0]===1) add(58, "◎は前走快勝、勢いに乗る");
    else if(rs[0]===2) add(50, "◎は前走惜敗、雪辱期す");
    // 人気を裏切ってきたか
    if(rs.length&&ps.length&&rs[0]>=6&&ps[0]<=3) add(52, "◎は前走人気を裏切ったが立て直し");
    else if(rs.length&&ps.length&&rs[0]<=3&&ps[0]>=7) add(56, "◎は前走人気薄で好走、上昇度");
    // 前走の頭数比較
    const pf=o.past5[0]&&o.past5[0].fieldN;
    if(pf && field>=pf+4) add(44, "前走より頭数増、揉まれ経験が鍵");
  }
  /* ⑩ ◎の前走コース替わり（ばんえいは常に帯広200mで替わりようがないので除外） */
  if(!isBanei && o.prev){
    if(o.prev.surf && surf && o.prev.surf!==surf) add(50, `◎は${o.prev.surf}→${surf}の路線替わり`);
    if(o.prev.dist && dist){
      if(dist>=o.prev.dist+400) add(48, "◎は前走から距離延長");
      else if(dist<=o.prev.dist-400) add(48, "◎は前走から距離短縮");
    }
    if(o.prev.track && m.track && o.prev.track!==m.track) add(40, `◎は${o.prev.track}から${m.track}へ転戦`);
  }
  /* ⑪ ◎のスコア根拠（brk・調教師騎手は優先度低め） */
  if(o.brk && o.brk.length){
    const pos=o.brk.filter(b=>b[0]!=="基礎" && +b[1]>=2).sort((a,b)=>b[1]-a[1]);
    const M={"同コース":"当コース実績","距離適性":"距離が得意","調教師":"厩舎が強力","騎手成績":"騎手が好調","芝ダ適性":"馬場が合う","スピード指数":"時計が上位","枠バイアス":"枠の利","前バイアス":"展開が向く","近走実績":"近走の内容","脚質":"脚質が展開向き"};
    if(pos.length){
      const top=pos[0][0];
      const pri=(top==="調教師"||top==="騎手成績")?38:56;
      if(M[top]) add(pri, `◎は${M[top]}で上位評価`);
      // 2つ目の根拠も（複合的な強み）
      if(pos.length>=2 && pos[1][0]!=="調教師" && pos[1][0]!=="騎手成績" && M[pos[1][0]])
        add(46, `◎は${M[pos[0][0]]}に加え${M[pos[1][0]]}も`);
    }
  }
  /* ⑫ ◎の乗り替わり */
  if(o.prevJockey && o.jockey){
    const same=String(o.jockey).startsWith(String(o.prevJockey).slice(0,3));
    if(!same) add(48, `◎は${jk(o)}騎手へ乗り替わり`);
    else add(30, `◎は${jk(o)}騎手が継続騎乗`);
  }
  /* ⑬ 斤量（ばんえいは400-700kg台の「負担重量」で平地の48-63kg台とは桁違い。
     専用の閾値をbaneiScore()の重量ハンデ判定(kg>=680/kg<=600)と揃える） */
  if(isBanei){
    if(o.kin!=null){
      if(o.kin>=680) add(44, `◎は${o.kin}kgの重量ハンデを力で克服できるか`);
      else if(o.kin<=600) add(46, `◎は${o.kin}kgと軽めのハンデが魅力`);
      if(p.kin!=null && o.kin-p.kin>=30) add(42, "◎は○より重い負担重量で分が悪いか");
      else if(p.kin!=null && p.kin-o.kin>=30) add(48, "◎は○より負担重量が軽く有利");
    }
  } else if(o.kin!=null){
    if(o.kin>=58) add(44, `◎は${o.kin}kgの酷量を克服できるか`);
    else if(o.kin<=52) add(46, `◎は${o.kin}kgの軽ハンデが魅力`);
    // ◎と○の斤量差
    if(p.kin!=null && o.kin-p.kin>=3) add(42, "◎は○より斤量重く分が悪いか");
    else if(p.kin!=null && p.kin-o.kin>=3) add(48, "◎は○より斤量軽く有利");
  }
  /* ⑬-2 ばんえい専用: 馬体重（パワー）・体重増減
     baneiScore()の閾値（weight>=1050/1000/950・wdiff>=15/6・<=-6/-15）と揃える。
     体重増減は当日発表後のみ値が入る（未発表はwdiff=null→自動的に候補から外れる）。 */
  if(isBanei){
    if(o.weight!=null){
      if(o.weight>=1050) add(50, `◎は${o.weight}kg超の馬格でパワー十分`);
      else if(o.weight>=1000) add(42, `◎は${o.weight}kgと恵まれた馬格`);
      else if(o.weight<900) add(46, `◎は${o.weight}kgとやや小柄、パワー勝負では割引材料`);
      if(p.weight!=null && o.weight-p.weight>=60) add(40, "◎は○より馬体が大きくパワーで優位か");
    }
    if(o.wdiff!=null){
      if(o.wdiff>=15) add(56, `◎は前走から${o.wdiff}kg増、そりを曳く馬力の上積みに期待`);
      else if(o.wdiff>=6) add(44, `◎は前走から${o.wdiff}kg増でやや上向き`);
      else if(o.wdiff<=-15) add(54, `◎は前走から${o.wdiff}kg減、馬力の低下が心配`);
      else if(o.wdiff<=-6) add(42, `◎は前走から${o.wdiff}kg減でやや軽量化`);
    }
    /* 経験度（近走データの蓄積数から。少ない=若手・経験浅め） */
    const _exp=(o.past5||[]).length;
    if(_exp>=5) add(38, `◎は帯広${_exp}走以上のベテラン、勝負どころを知る一頭`);
    else if(_exp<=1) add(48, "◎はキャリア浅め、ばんえい適性は未知数の面も");
    /* 連闘・間隔（近走の日付が拾えないため、近走data無しの新規出走を簡易的に検出） */
    if(!o.past5 || !o.past5.length) add(50, "◎は近走データ無し、初出走かデータ空白期間");
  }
  /* ⑭ ブリンカー */
  if(o.bl) add(46, "◎はブリンカー着用で集中力強化");
  /* ⑮ 枠（ばんえいは枠の有利不利がほぼ無い＝実測確認済み。除外） */
  if(!isBanei && o.waku){
    if(o.waku<=2 && (o.kyaku==="逃げ"||o.kyaku==="先行")) add(50, "◎は内枠先行でロスなく運べる");
    else if(o.waku>=7 && o.kyaku==="逃げ") add(44, "◎は外枠、逃げ切りに工夫要る");
    else if(o.waku>=7 && (o.kyaku==="差し"||o.kyaku==="追い込み")) add(42, "◎は外枠、末脚を活かしやすい");
  }
  /* ⑯ 危険人気馬 */
  const df=dangerFav(m);
  if(df) add(78, `人気の${nm(df)}は評価を下げる一戦`);
  /* ⑰ ◎自身の人気 */
  if(o.pop!=null){
    if(o.pop>=6) add(74, `◎${nm(o)}は${o.pop}番人気。市場と大きく乖離＝的中率は落ちる（人気薄◎の実測複勝率は2割前後）。買うなら点数を絞るか見送りも`);
    else if(o.pop>=4) add(70, `◎${nm(o)}は${o.pop}番人気。市場評価より上に見てるが、この帯の実測複勝率は4割前後。過信は禁物`);
    else if(o.pop===1 && gap!=null && gap>=6) add(56, "◎は人気でも中身が伴う本命");
    else if(o.pop===1 && gap!=null && gap<=2) add(60, "1番人気だが混戦、盲信は禁物");
  }
  /* ⑱ 得意度 */
  const ms=(typeof modelStrength==="function" && m.track) ? modelStrength(m.track, m.field||0) : null;
  if(ms){
    if(ms.lv==="得意") add(52, "当場・条件はモデルの得意領域");
    else if(ms.lv==="苦手") add(52, "当場は自信控えめ、慎重に");
    else if(ms.lv==="やや得意") add(40, "当場はやや得意な条件");
    else if(ms.lv==="やや苦手") add(40, "当場はやや苦手、割り引きも");
  }

  /* ⑲ 馬場状態
     平地: 公式28年12万走検証で「前有利は良+28.1/稍重+28.1/重不良+29.8ptでほぼ不変」。
     ばんえい: 検証済みの統計は無いため断定はしないが、砂に水分を含むと橇の抵抗が
     増えパワー・スタミナ要求が上がるのは物理的に自然（未検証・観測情報として提示）。 */
  if(isBanei){
    if(m.going==="重"||m.going==="不良") add(45, `馬場は${m.going}。砂が湿ると橇の抵抗が増え、パワー・スタミナがより問われやすい（未検証・参考情報）`);
  } else {
    if(m.going==="重"||m.going==="不良") add(69, `馬場は${m.going}。地方は道悪でも前有利が変わらない（良+28pt/道悪+30pt・12万走実測）ので「道悪だから差し」は不要`);
    else if(m.going==="稍重") add(33, "馬場は稍重（傾向は良馬場とほぼ同じ）");
  }
  /* ⑳ ◎の当地実績（数字つき。当地複勝50%超の馬は次走複勝44%の実測） */
  if(o.local && o.local.n>=3){
    const lp=Math.round(100*(o.local.p3||0)/o.local.n);
    if(lp>=50) add(72, `◎は当地${o.local.n}戦・複勝率${lp}%の当地巧者（この帯は次走も複勝44%の実測）`);
    else if(lp>=34) add(46, `◎は当地${o.local.n}戦・複勝率${lp}%とまずまず`);
    else if(o.local.n>=6 && lp<=15) add(57, `◎は当地${o.local.n}戦・複勝率${lp}%と当地で結果が出ていない点は懸念`);
  }
  /* ㉑ ◎の実測先行力（隊列のどこで運ぶ馬か） */
  {
    const ffz=(o.brk||[]).find(z=>z[0]==="実測先行力");
    if(ffz){
      const fa=0.5-ffz[1]/10;
      if(fa<=0.25) add(63, `◎は近走を隊列の前${Math.max(5,Math.round(fa*100))}%地点で運ぶ生粋の先行型（地方の先行型は次走複勝42% vs 後方型15%）`);
      else if(fa>=0.7) add(61, `◎は後方${Math.round(fa*100)}%位置からの差しタイプ。地方の後方型は複勝15%と分が悪く、能力上位でも過信は禁物`);
    }
  }
  /* ㉒ ○▲のフォロー（◎以外にも触れて情報量を出す） */
  if(p && p.local && p.local.n>=3){
    const lp2=Math.round(100*(p.local.p3||0)/p.local.n);
    if(lp2>=55) add(53, `○${nm(p)}も当地複勝率${lp2}%と地の利あり`);
  }
  if(t && t.kyaku==="追い込み") add(36, `▲${nm(t)}は追い込み一手で展開頼み`);

  cand.sort((a,b)=>b.pri-a.pri);
  const out=[]; const seen=new Set();
  const N=maxN||3;
  for(const c of cand){ if(seen.has(c.txt))continue; seen.add(c.txt); out.push(c.txt); if(out.length>=N)break; }
  return out.join("／");
}
/* その場・その日の「特に注目したいところ」だけを拾って1本のツイート文にする。
   1レースずつではなく場単位＝「どのレースを見ればいいか」の道しるべ。
   ★盛らない★ 候補が無いカテゴリは黙って飛ばす（無理に埋めない）。
   優先度: 重賞 > 危険な1番人気 > 波乱指数 > 鉄板（gap最大）。カテゴリ重複は避け最大4件。 */
function trackFocusText(trackName, races){
  const list=(races||[]).filter(m=>m && !m.skip && m.marks && m.marks.length);
  if(!list.length) return "";
  const cand=[];   // {pri, line}

    } }

function decodeHtmlEntities(s){

      <button class="kochiImgBtn" style="flex:1;min-width:120px;font-size:14px;font-weight:700;padding:8px;border-radius:8px;border:1px solid #ffd43d;background:none;color:#ffd43d">🏇 フォメ画像</button>
      <button class="kochiCurveBtn" style="flex:1;min-width:120px;font-size:14px;font-weight:700;padding:8px;border-radius:8px;border:1px solid #51b883;background:none;color:#51b883">📈 過去成績</button>
    </div>`;
  }catch(_){}
  const cardEl=(function(){ card.innerHTML=html; return card; })();
  { const cb=cardEl.querySelector(".kochiCopyBtn"); if(cb) cb.onclick=()=>{ try{ navigator.clipboard.writeText(cb.dataset.tw); cb.textContent="✓ コピーした"; setTimeout(()=>cb.textContent="📋 ツイート文",1500);}catch(_){} };
    const ib=cardEl.querySelector(".kochiImgBtn"); if(ib) ib.onclick=()=>{ try{ const cv=drawKochiFormaImage(c,cond,scored); if(!cv){swAlert("⭐妙味馬がいないため画像は作れません（オッズ確定後に再取得を）");return;} cv.toBlob(b=>{ const f=new File([b],"kochi_forma.png",{type:"image/png"}); if(navigator.canShare&&navigator.canShare({files:[f]})){ navigator.share({files:[f]}); } else { const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="kochi_forma.png"; a.click(); } }); }catch(e){ swAlert("画像生成エラー: "+e.message); } }; }
    { const cb2=cardEl.querySelector(".kochiCurveBtn"); if(cb2) cb2.onclick=()=>{ try{ const cv=drawKochiCurveImage(); cv.toBlob(b=>{ const f=new File([b],"kochi_curve.png",{type:"image/png"}); if(navigator.canShare&&navigator.canShare({files:[f]})){ navigator.share({files:[f]}); } else { const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="kochi_curve.png"; a.click(); } }); }catch(e){ swAlert("グラフ生成エラー: "+e.message); } }; }
  return cardEl;
}
function g1Candidates(){
  const out=[], seen=new Set();
  const push=(r,tn)=>{ if(!r)return; const nm=r.name||r.e; const rid=r.race_id; if(!rid||seen.has(rid))return; if(isG1Race(nm)){ seen.add(rid); out.push({race_id:rid,name:decodeHtmlEntities(nm||""),trackName:r.trackName||r.track||tn||"",firmO:(r.firmO!=null?r.firmO:null)}); } };
  try{ (results||[]).forEach(r=>push(r)); }catch(_){}
  try{ Object.values(allResults||{}).forEach(g=>{ (g.races||[]).forEach(r=>push(r,g.trackName)); }); }catch(_){}
  return out;
}
function g1Reasons(x, ctx, spTop, jt){
  const e=x.e||{}, past=e.past||[]; const tags=[];
  const curTurn=ctx.raceId?turnOfRid(ctx.raceId):null, curSurf=ctx.race.surface, curDist=ctx.race.dist;
  if(past[0]&&past[0].rank===1) tags.push("前走勝ち");
  else if(past[0]&&past[0].rank&&past[0].rank<=3) tags.push("前走好走");
  if(past.some(pp=>curTurn&&pp.turn===curTurn&&pp.rank&&pp.rank<=3)) tags.push("同回り実績");
  if(curDist&&past.some(pp=>curSurf&&pp.surf===curSurf&&pp.dist===curDist&&pp.rank&&pp.rank<=3)) tags.push("同距離好走");
  let l3=99; past.forEach(pp=>{ if(pp.last3f&&pp.last3f<l3) l3=pp.last3f; });
  if(l3<=34.5) tags.push("上がり最速級"); else if(l3<=34.9) tags.push("決め手");
  if(spTop.has(x.num)) tags.push("時計上位");
  if(past.some(pp=>pp.fieldN>=14&&pp.rank&&pp.rank<=5)) tags.push("大箱○");
  const st=styleType(e); if(st==="front") tags.push("先行力"); else if(st==="closer") tags.push("末脚");
  if(jt){ if(e.waku!=null && jt.goodWaku.has(e.waku)) tags.push("好枠");
    const grp=(jt.bestStyle==="逃げ"||jt.bestStyle==="先行")?"front":(jt.bestStyle==="差し"||jt.bestStyle==="追込")?"closer":null;
    if(grp && st===grp) tags.push("脚質◎"); }
  return tags.slice(0,5);
}
function buildG1Text(c, cond, top, pace, jt){
  const sym=["◎","○","▲","△","△"];
  const surf=cond.surface||"", dist=cond.dist?cond.dist+"m":"";
  let t=`🏆${c.name}（G1）${c.trackName||""} ${surf}${dist}\n`;
  top.forEach((x,i)=>{ t+=`${sym[i]}${x.num} ${x.name}\n`; });
  t+=`\n【展開】${pace}`;
  if(jt) t+=`\n【過去傾向】${jt.wakuLean}・${jt.bestStyle}有利・${jt.hard}`;
  t+=`\n【買い目】単複◎ / 三連複◎軸流し\n\n#競馬予想 #G1 #SWTURFLAB`;
  return t;
}
function renderG1Block(c, cond, scored, spTop, ctx){
  const sym=["◎","○","▲","△","△"]; const top=scored.slice(0,5);
  const jk=jushoKeyOf(c.name); const jt=jk?jushoTrend(jk):null;
  const card=document.createElement("div"); card.className="g1-card";
  const _gmx=Math.max(...scored.map(z=>z.s)); let _gZ=0; scored.forEach(z=>_gZ+=Math.exp((z.s-_gmx)/45));
  const surf=cond.surface||"", dist=cond.dist?cond.dist+"m":"", going=cond.going?"／"+cond.going:"";
  let html=`<div class="g1-hd"><span class="g1-badge">G1</span><span class="g1-name">${g1esc(c.name)}</span></div>`;
  html+=`<div class="g1-sub">${g1esc(c.trackName||"")}　${surf}${dist}${going}</div><div class="g1-marks">`;
  top.forEach((x,i)=>{ const tags=i<3?g1Reasons(x,ctx,spTop,jt):[];
    const _brk=fullBreakdown(x.num,ctx);
    const _gpm=Math.min(0.25,Math.exp((x.s-_gmx)/45)/_gZ);
    const _gprob=`<div class="ix-prob">予測勝率 <b>${(_gpm*100).toFixed(0)}%</b> ／ 市場—</div>`;
    const _bk=`<div class="g1-brk">`+_gprob+((_brk&&_brk.length)?_brk.slice().sort((a,b)=>(a[0]==="基礎"?-1:b[0]==="基礎"?1:Math.abs(b[1])-Math.abs(a[1]))).map(([l,v])=>`<span class="ix-bk ${v<0?'neg':''}"><b>${l}</b>${v>=0?'+':''}${(+v).toFixed(1)}</span>`).join(""):"")+`</div>`;
    html+=`<div class="g1-item"><div class="g1-row"><span class="g1-mk mk${i}">${sym[i]}</span><span class="g1-no">${x.num}</span><span class="g1-hn">${g1esc(x.name)}</span><span class="g1-idx">${(Math.round(x.s*10)/10).toFixed(1)}</span><span class="g1-tap">▾</span></div>`;
    if(tags.length) html+=`<div class="g1-tags">`+tags.map(t=>`<span class="g1-chip">${t}</span>`).join("")+`</div>`;
    html+=_bk+`</div>`;
  });
  html+=`</div>`;
  let f=0,cl=0,tot=0; scored.forEach(x=>{const t=styleType(x.e); if(t==="front")f++; else if(t==="closer")cl++; tot++;});
  const pace = f<=2 ? "前少→スロー〜平均、差し届きやすい" : (f>=Math.max(5,Math.ceil(tot*0.33)) ? "前多→ハイペース、差し追込有利" : "平均ペース、先行有利");
  html+=`<div class="g1-line"><b>展開</b> 逃先${f}・差追${cl} → ${pace}</div>`;
  if(jt){ const sr=jt.styleRank.map(z=>`${z.s}${z.p.toFixed(0)}%`).join(" ");
    html+=`<div class="g1-trend"><div class="g1-trend-h">📊 過去傾向（${jt.years}年・約${jt.field}頭立て）</div>`;
    html+=`<div class="g1-line2"><b>枠</b> ${jt.wakuLean}　複勝率上位枠 ${[...jt.goodWaku].join("・")||"-"}</div>`;
    html+=`<div class="g1-line2"><b>脚質</b> ${jt.bestStyle}有利　<span style="color:#8b94a6">${sr}</span></div>`;
    html+=`<div class="g1-line2"><b>傾向</b> ${jt.hard}（勝ち馬平均${jt.winNinkiAvg}人気）・上がり最速勝率${jt.agari}%</div></div>`;
  }
  let fO=(c.firmO!=null?c.firmO:null); if(fO==null){ try{ fO=firmness(scored,{},0); }catch(_){} }
  const conf = fO==null?"—":(fO>=75?("勝負級 (信頼度"+Math.round(fO)+")"):fO>=60?("狙い目 (信頼度"+Math.round(fO)+")"):fO<40?("波乱含み (信頼度"+Math.round(fO)+")"):("標準 (信頼度"+Math.round(fO)+")"));
  html+=`<div class="g1-line"><b>信頼度</b> ${conf}</div>`;
  const hon=top[0]?top[0].num:"", aite=top.slice(1).map(t=>t.num);
  html+=`<div class="g1-line"><b>買い目</b> 単勝・複勝 ◎${hon} ／ 三連複 ◎${hon}軸-${aite.join("・")}（6点）<span class="g1-note">※50円/点</span></div>`;
  const txt=buildG1Text(c,cond,top,pace,jt);
  html+=`<textarea class="g1-ta" readonly>${g1esc(txt)}</textarea>`;
  html+=`<div class="g1-btns"><button class="g1-copy">テキストをコピー</button><button class="g1-img">📷 画像保存</button><button class="g1-imgcopy">画像コピー</button></div>`;
  card.innerHTML=html;
  const m={ no:(parseInt((c.race_id||"").slice(10),10)||""), track:c.trackName||"", name:c.name, ranked:scored.map((x,i)=>({num:x.num,name:x.name,s:Math.round(x.s*10)/10,mk:(i<5?sym[i]:""),pop:null,odds:null})) };
  const date=(($("#date")&&$("#date").value||"").trim()||"");
  const cc=card.querySelector(".g1-copy"); if(cc) cc.addEventListener("click",()=>{ try{navigator.clipboard.writeText(txt).then(()=>swAlert("コピーした"),()=>swAlert("コピー失敗"));}catch(_){ swAlert("コピー失敗"); } });
  const ci=card.querySelector(".g1-img"); if(ci) ci.addEventListener("click",()=>drawRaceIndexCanvas(m,date,false));
  const cp=card.querySelector(".g1-imgcopy"); if(cp) cp.addEventListener("click",()=>drawRaceIndexCanvas(m,date,true));
  return card;
}
async function runG1Special(){
  const host=document.getElementById("g1Out"); if(!host)return;
  const cands=g1Candidates();
  if(!cands.length){ swAlert("本日のG1が見つからない。先にJRAで「予想を取得」か「全場まとめて予想」してから押してね。"); return; }
  host.innerHTML='<div class="g1-loading">🏆 G1を解析中…</div>';
  const blocks=[];
  for(const c of cands){
    try{
      const html=await fetchDecoded(shutubaURL(c.race_id));
      const ps=parseShutuba(html); const cond=ps.cond||{}; const entries=ps.entries||{};
      const nums=Object.keys(entries); if(nums.length<5) continue;
      const ctx={raceId:c.race_id, entries, race:{surface:cond.surface,dist:cond.dist,going:cond.going,name:cond.raceName||c.name,grade:"G1"}, curClv:classLevelName(cond.raceName||c.name), raceDate:(($("#date")&&$("#date").value||"").trim()||jstTodayStr())};
      const scored=nums.map(n=>({num:String(n),name:(entries[n]&&entries[n].name)||"",s:fundamentalScore(n,ctx),e:entries[n]})).sort((a,b)=>b.s-a.s);
      const sps=scored.map(x=>({num:x.num,sp:(speedIndex(x.e)==null?-999:speedIndex(x.e))})).sort((a,b)=>b.sp-a.sp);
      const spTop=new Set(sps.slice(0,3).filter(x=>x.sp>-900).map(x=>x.num));
      blocks.push(renderG1Block(c,cond,scored,spTop,ctx));
    }catch(e){}
  }
  host.innerHTML="";
  if(!blocks.length){ host.innerHTML='<div class="g1-loading">取得できなかった。通信か日付を確認してね。</div>'; return; }
  blocks.forEach(b=>host.appendChild(b));
  try{ host.scrollIntoView({behavior:"smooth",block:"start"}); }catch(_){}
}
(function(){ const b=document.getElementById("g1Btn"); if(b) b.addEventListener("click", runG1Special); })();
(function(){ const b=document.getElementById("kochiBtn"); if(b) b.addEventListener("click", runKochiSpecial); })();
function buildBuySlip(){
  try{
    const host=document.getElementById("buySlip"); if(!host) return;
    const rows=[];
    Object.keys(allResults||{}).forEach(tc=>{ const blk=allResults[tc]||{}; (blk.races||[]).forEach(m=>{
      if(!m||m.skip||m.firmO==null||m.firmO<60) return;
      const nums=(m.marks||[]).map(x=>String(x.num)).filter(Boolean); if(nums.length<3) return;
      const hon=nums[0], aite=nums.slice(1);
      const wbox=nums.length*(nums.length-1)/2;
      const f3=aite.length>=2?aite.length*(aite.length-1)/2:0;
      rows.push({tc, tag:`${blk.trackName||""}${m.no}R`, f:Math.round(m.firmO), battle:m.firmO>=75, hon, nums, aite, wbox, f3, hp:(m.marks&&m.marks[0]?m.marks[0].pop:null)});
    }); });
    if(!rows.length){ host.style.display="none"; host.innerHTML=""; return; }
    rows.sort((a,b)=>b.f-a.f);
    const body=rows.map(r=>`<div class="bs-race"><div class="bs-rh"><span class="bs-tag">${escapeHtml(r.tag)}</span><span class="bs-mk">◎${r.hon}</span><span class="bs-f ${r.battle?'bs-b':'bs-a'}">${r.battle?'勝負':'狙い'} ${r.f}</span></div><div class="bs-line">単勝・複勝 <b>${r.hon}</b>${MODE==="jra" ? (r.hp!=null&&r.hp>=4?'　<span class="bs-mi val">妙味◎(単勝勝負)</span>':(r.hp!=null&&r.hp<=2?'　<span class="bs-mi over">人気先行注意</span>':"")) : (r.f3?`　三連複 <b>${r.hon}</b>軸-${r.aite.join(",")}（${r.f3}点）`:"")}</div></div>`).join("");
    host.innerHTML=`<details class="bs-fold"><summary>買い目まとめ（${rows.length}R・50円/点）</summary><div class="bs-head"><button class="bs-copy" id="bsCopy">全部コピー</button></div><div class="bs-body">${MODE==="jra"?'<div class="bs-note">JRA：相手絡め(馬連/ワイド/三連複)は検証で回収悪化→単複中心。<b>妙味◎</b>=人気薄を本命視＝単勝の勝負どころ／<b>人気先行</b>=過剰人気で妙味薄。</div>':''}${body}</div></details>`;
    host.style.display="block";
    const cp=document.getElementById("bsCopy"); if(cp) cp.onclick=(e)=>{ e.preventDefault(); const txt=rows.map(r=>`${r.tag} ◎${r.hon}\n 単勝・複勝 ${r.hon}${MODE==="jra"?(r.hp!=null&&r.hp>=4?" [妙味=単勝勝負]":(r.hp!=null&&r.hp<=2?" [人気先行]":"")):(r.f3?`\n 三連複 ${r.hon}軸-${r.aite.join(",")}（${r.f3}点）`:"")}`).join("\n\n"); try{copy(txt);}catch(_){} cp.textContent="コピー済"; setTimeout(()=>{cp.textContent="全部コピー";},1500); };
  }catch(_){}
}
function buildAimSummary(){
  try{
    const host=document.getElementById("aimSummary"); if(!host) return;
    const battles=[], aims=[];
    Object.keys(allResults||{}).forEach(tc=>{ const blk=allResults[tc]||{}; (blk.races||[]).forEach(m=>{ if(!m||m.skip||m.firmO==null) return; const o=(m.marks&&m.marks[0])?m.marks[0]:null; const lab=`${blk.trackName||""}${m.no}R ◎${o?o.num:"?"}`; const rec={lab,f:Math.round(m.firmO),tc}; if(m.firmO>=75) battles.push(rec); else if(m.firmO>=60) aims.push(rec); }); });
    if(!battles.length && !aims.length){ host.style.display="none"; host.innerHTML=""; return; }

    if(aims.length) html+=`<div class="as-row"><span class="as-k as-k-a">狙い目</span><div class="as-chips">${aims.map(x=>chip(x,"as-a")).join("")}</div></div>`;
    host.innerHTML=html; host.style.display="block";
  }catch(_){}
}
function refreshVenueNav(){

function applyAimFilter(){
