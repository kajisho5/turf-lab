<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e16">
<title>推奨馬まとめ — Twitter用</title>
<style>
  :root,html[data-theme="dark"]{--bg:#0a0e16;--panel:#141619;--panel2:#1a1d22;--line:#262a31;--txt:#ffffff;--muted:#b3b3b3;--dim:#565c68;--red:#ff7171;--vel:#ffc700;--rise:#57b8ff;--div:#51b883;}
  html[data-theme="light"]{--bg:#f4f5f7;--panel:#fff;--panel2:#f0f1f4;--line:#d9dce1;--txt:#1a1d22;--muted:#5c6470;--dim:#9aa0ab;--red:#c5362e;--vel:#b9791a;--rise:#1d7fad;--div:#3f8f28;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt)}
  body{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",system-ui,sans-serif;font-size:14px;line-height:1.6;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:16px 14px 60px}
  .mono{font-family:"Space Mono",ui-monospace,monospace}
  header{padding:18px 0 14px;border-bottom:1px solid var(--line);margin-bottom:14px}
  h1{font-family:"Saira Condensed","Noto Sans JP",sans-serif;font-weight:700;letter-spacing:.04em;font-size:22px;margin:0 0 2px}
  .sub{color:var(--muted);font-size:12px}
  /* gate */
  #gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;flex-direction:column;gap:14px;padding:20px}
  #gate h2{font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:20px;margin:0;color:var(--txt)}
  #gate p{color:var(--muted);font-size:13px;margin:0;text-align:center}
  #gate input{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--txt);font-size:16px;padding:11px 14px;width:min(280px,80vw);text-align:center;font-family:"Space Mono",monospace}
  #gate input:focus{outline:none;border-color:var(--vel)}
  #gate button{background:var(--vel);color:#1a1a1a;border:none;border-radius:8px;font-weight:700;font-size:15px;padding:11px 28px;cursor:pointer;font-family:"Saira Condensed",sans-serif;letter-spacing:.05em}
  #gateErr{color:var(--red);font-size:12px;min-height:16px}
  /* controls */
  .ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  select,.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--txt);font-size:14px;padding:9px 12px;font-family:inherit;cursor:pointer}
  select{min-width:130px}
  .btn.go{border-color:var(--vel);color:var(--vel);font-weight:700}
  .btn:hover{border-color:var(--dim)}
  .date-in{width:120px;font-family:"Space Mono",monospace;text-align:center}
  .hint{color:var(--muted);font-size:12px;margin:8px 0}
  .prog{color:var(--vel);font-size:13px;font-family:"Space Mono",monospace}
  /* output block */
  .out-actions{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
  .po-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9998;align-items:center;justify-content:center;padding:20px}
  .po-box{background:var(--panel,#141619);border:1px solid var(--line,#262a31);border-radius:14px;max-width:520px;width:100%;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
  .po-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line,#262a31);font-weight:800;font-size:15px;color:var(--txt,#ffffff)}
  .po-close{background:none;border:none;color:var(--muted,#b3b3b3);font-size:18px;cursor:pointer}
  .po-note{font-size:11px;color:var(--muted,#b3b3b3);padding:8px 18px 4px}
  .po-list{overflow-y:auto;padding:6px 12px 14px}
  .po-row{display:flex;align-items:center;gap:9px;padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.04);font-size:13.5px}
  .po-row.po-soon{background:rgba(115,201,90,.08);border-radius:8px}
  .po-row.po-past{opacity:.4}
  .po-time{font-family:"Space Mono",monospace;font-weight:700;color:#57b8ff;min-width:48px}
  .po-soon .po-time{color:#51b883}
  .po-track{font-weight:700;color:var(--txt,#ffffff);min-width:42px}
  .po-no{color:var(--muted,#b3b3b3);font-weight:700;min-width:34px}
  .po-t{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:7px}
  .po-battle{background:linear-gradient(90deg,#ffd43d,#ff7171);color:#1a1206}
  .po-aim{background:#ff7171;color:#fff} .po-pre{background:#bb87ff;color:#fff} .po-pass{background:#4a4f58;color:#cfd4dc}
  .po-marks{color:#ff7171;font-weight:600;margin-left:auto;font-size:12.5px}
  .po-skip{color:var(--muted,#b3b3b3)}
  .copyall{background:var(--rise);color:#fff;border:none;border-radius:8px;font-weight:700;padding:10px 18px;cursor:pointer;font-size:14px}
  .tweet-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;position:relative}
  .tweet-card.tc-aim{border-color:#ff7171;box-shadow:0 0 0 1px rgba(240,101,74,.25)}
  .tweet-card.tc-aimhit{border-color:#ff7171;box-shadow:0 0 14px rgba(240,101,74,.3)}
  .aim-tag{display:inline-block;margin-left:8px;background:linear-gradient(90deg,#ffd43d,#ff7171);color:#fff;font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px;vertical-align:middle;font-family:"Noto Sans JP",sans-serif}
  .pass-tag-s{display:inline-block;margin-left:8px;background:#4a4f58;color:#c9ced6;font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px;vertical-align:middle;font-family:"Noto Sans JP",sans-serif}
  .hit-box-aim{background:rgba(240,101,74,.12)!important;border-color:#ff7171!important}
  .hit-box-aim .hit-h{color:#ff7171!important}
  .hit-box-miss{background:rgba(62,198,255,.10)!important;border-color:#57b8ff!important;border-style:dashed!important}
  .hit-box-miss .hit-h{color:#57b8ff!important}
  .tweet-card.tc-misshit{border-color:#57b8ff;border-style:dashed}
  .misshit-tag{display:inline-block;margin-left:8px;background:#57b8ff;color:#06212e;font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px;vertical-align:middle;font-family:"Noto Sans JP",sans-serif}
  .tweet-card.aim{border:2px solid #ff7171;box-shadow:0 0 0 1px rgba(216,66,58,.25),0 0 14px rgba(216,66,58,.18)}
  .aim-badge{display:inline-block;margin-left:8px;background:#ff7171;color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;vertical-align:middle;font-family:"Noto Sans JP",sans-serif}
  .value-badge{font-size:11px;font-weight:800;color:#b48ef0;border:1px solid #b48ef0;border-radius:5px;padding:1px 7px;margin-left:8px;background:rgba(180,142,240,0.08)}
  .iron-badge{display:inline-block;margin-left:6px;background:linear-gradient(135deg,#ffd43d,#ff7171);color:#1a1408;font-size:11px;font-weight:800;padding:2px 9px;border-radius:10px;vertical-align:middle;font-family:"Noto Sans JP",sans-serif;box-shadow:0 0 10px rgba(245,185,66,.35)}
  .fuku-badge{display:inline-block;margin-left:6px;background:#2c7a4b;color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;vertical-align:middle;font-family:"Noto Sans JP",sans-serif}
  .tweet-card.battle{border:2.5px solid #ff7171;background:linear-gradient(160deg,rgba(245,185,66,.10),rgba(240,101,74,.06),var(--panel));box-shadow:0 0 0 1px rgba(245,185,66,.35),0 0 22px rgba(240,101,74,.32)}
  .battle-badge{display:inline-block;margin-left:8px;background:linear-gradient(90deg,#ffd43d,#ff7171);color:#fff;font-size:12px;font-weight:800;padding:2px 11px;border-radius:10px;vertical-align:middle;font-family:"Noto Sans JP",sans-serif;box-shadow:0 0 10px rgba(240,101,74,.5)}
  .tweet-card.preaim{border:2px solid #8c6cf0;box-shadow:0 0 0 1px rgba(140,108,240,.25),0 0 14px rgba(140,108,240,.16)}
  .preaim-badge{display:inline-block;margin-left:8px;background:linear-gradient(90deg,#bb87ff,#97d3ff);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;vertical-align:middle;font-family:"Noto Sans JP",sans-serif}
  .tweet-card.pass{opacity:.5;border-left:4px solid #4a4f58;background:repeating-linear-gradient(135deg,var(--panel),var(--panel) 12px,rgba(74,79,88,.06) 12px,rgba(74,79,88,.06) 24px)}
  .tweet-card.pass .tc-title{color:var(--muted)}
  .tweet-card.pass.tc-misshit{opacity:1}   /* 見送り的中（取りこぼし）は斜線のまま薄くしない＝読める */
  .frz-state{font-size:11px;color:var(--muted);font-weight:700}
  .pass-badge{display:inline-block;margin-left:8px;background:#4a4f58;color:#e2e6ec;font-size:11px;font-weight:700;padding:2px 10px;border-radius:10px;vertical-align:middle;font-family:"Noto Sans JP",sans-serif}
  .rec-banner{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .pred-diff{background:rgba(240,168,56,.08);border:1px solid var(--vel,#ffc700);border-radius:12px;padding:13px 16px;margin-bottom:14px}
  .tweet-card.changed{box-shadow:inset 4px 0 0 var(--vel,#ffc700)}
  .changed-badge{display:inline-block;margin-left:8px;background:var(--vel,#ffc700);color:#1a1206;font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px;vertical-align:middle;font-family:"Noto Sans JP",sans-serif}
  .pred-diff .pd-h{font-weight:700;font-size:14px;color:var(--vel,#ffc700);margin-bottom:8px}
  .pred-diff .pd-track{display:inline-block;background:var(--vel,#ffc700);color:#1a1206;padding:1px 9px;border-radius:8px;font-weight:800;margin:0 2px}
  .pred-diff .pd-row{display:flex;align-items:center;gap:10px;padding:3px 0;font-size:14px}
  .pred-diff .pd-r{font-family:"Saira Condensed",sans-serif;font-weight:700;color:var(--txt);min-width:44px}
  .pred-diff .pd-state{font-size:12px;font-weight:700;padding:2px 9px;border-radius:9px}
  .pred-diff .pd-aim{background:#ff7171;color:#fff} .pred-diff .pd-preaim{background:#8c6cf0;color:#fff}
  .pred-diff .pd-pass{background:#999999;color:#fff} .pred-diff .pd-normal{background:#3a4151;color:#cfd5df}
  .pred-diff .pd-o{font-family:"Space Mono",monospace;font-size:13px;color:var(--rise,#57b8ff)}
  .pred-diff .pd-note{margin-top:8px;font-size:11px;color:var(--muted);line-height:1.5}
  .rec-banner .rb-row{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0}
  .rec-banner .rb-k{color:var(--muted);font-size:14px}
  .rec-banner .rb-v{font-family:"Space Mono",monospace;font-weight:700;font-size:18px;color:var(--txt)}
  .rec-banner .rb-main .rb-k{color:var(--txt);font-weight:700}
  .rec-banner .rb-main .rb-v{color:#57b8ff;font-size:22px}
  .rec-banner .rb-sub .rb-v{color:var(--muted);font-size:15px}
  .rec-banner .rb-aim .rb-k{color:#f0a040;font-weight:700}
  .rec-banner .rb-aim .rb-v{color:#ff7171;font-size:18px}
  .rec-banner .rb-note{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.5}
  .tc-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .tc-title{font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:16px}
  .tc-title .rno{color:var(--vel);margin-right:6px}
  .tc-post{color:var(--muted);font-size:12.5px;font-weight:600;margin-left:8px;letter-spacing:.02em}
  .tc-meta{font-size:11px;color:var(--muted);font-family:"Space Mono",monospace}
  .tc-twx{background:#15202b;border:1px solid #2f3e4d;color:#7fc4ff;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600;margin-left:6px;cursor:pointer}
.tc-twx:active{background:#1d2c38}
.tc-copy{background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--muted);font-size:11px;padding:4px 10px;cursor:pointer;white-space:nowrap}
  .tc-copy:hover{color:var(--txt);border-color:var(--dim)}
  .tc-copy.done{color:var(--div);border-color:var(--div)}
  .tc-body{font-family:"Space Mono",ui-monospace,monospace;font-size:13.5px;line-height:1.8;white-space:pre-wrap;color:var(--txt)}
  .mk-o{color:var(--red);font-weight:700}
  .mk-1{color:var(--vel);font-weight:700}
  .mk-2{color:var(--rise);font-weight:700}
  .mk-3{color:var(--div);font-weight:700}
  .empty{color:var(--dim);font-style:italic}
  .res{font-weight:700}
  .res-win{color:var(--div)}
  .res-in{color:var(--vel)}
  .res-out{color:var(--muted)}
  .btn#check{border-color:var(--rise);color:var(--rise);font-weight:700}
  .ctrl-actions{margin-top:-6px;margin-bottom:12px}
  .ctrl-actions .btn{flex:1;text-align:center;padding:12px;font-size:15px;font-weight:700}
  /* 🧹 コントロールパネルのグループ整理（tweet2から移植） */
  .secgrp{margin:0 0 10px}
  .sec-label{font-size:11.5px;font-weight:700;color:var(--muted,#9aa3b0);letter-spacing:.03em;margin:0 2px 5px;display:block}
  details.tools-det>summary{cursor:pointer;list-style:none;padding:2px 0}
  details.tools-det>summary::-webkit-details-marker{display:none}
  details.tools-det>summary::before{content:"▸ ";color:var(--muted,#9aa3b0)}
  details.tools-det[open]>summary::before{content:"▾ "}
  .secgrp .btn-row{margin:0}
  .btn.go{border-color:var(--vel);color:var(--vel)}
  .btn.chk{border-color:var(--rise);color:var(--rise)}
  .btn.allbtn{flex:1;border-color:var(--div);color:var(--div);font-weight:700}
  .btn.win5btn{flex:1;border-color:#ffc700;color:#ffc700;font-weight:700}
  .btn.pickbtn{flex:1;border-color:#ff7171;color:#ff7171;font-weight:700}
  .picks-head{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;position:relative}
  .picks-h{font-size:18px;font-weight:800;color:#ff7171}
  .picks-sub{font-size:12px;color:var(--muted);margin-top:5px}
  .picks-copy{margin-top:10px;font-size:12px;font-weight:700;background:#57b8ff;color:#06212e;border:none;border-radius:8px;padding:7px 14px}
  .picks-btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .picks-btns .picks-copy{margin-top:0}
  .picks-tw{font-size:12px;font-weight:700;background:#1da1f2;color:#fff;border:none;border-radius:8px;padding:7px 14px}
  .pick-card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 14px;margin-bottom:9px;border-left-width:4px}
  .pick-card.pick-battle{border-left-color:#ff7171;background:linear-gradient(100deg,rgba(245,185,66,.07),var(--panel))}
  .pick-card.pick-aim{border-left-color:#ff7171}
  .pick-card.pick-preaim{border-left-color:#8c6cf0}
  .pick-top{display:flex;align-items:center;gap:9px;margin-bottom:4px}
  .pick-tier{font-size:11px;font-weight:800;padding:2px 9px;border-radius:9px;color:#fff}
  .pt-battle{background:linear-gradient(90deg,#ffd43d,#ff7171)} .pt-aim{background:#ff7171} .pt-preaim{background:linear-gradient(90deg,#bb87ff,#97d3ff)}
  .pick-loc{font-weight:700;font-size:14px}
  .pick-firm{margin-left:auto;font-size:12px;color:var(--muted);font-family:"Space Mono",monospace}
  .pick-name{font-size:12.5px;color:var(--muted);margin-bottom:6px}
  .pick-marks{display:flex;flex-wrap:wrap;gap:12px;font-size:13.5px}
  .pm-o{color:#ff7171;font-weight:700} .pm-1{color:#ffc700;font-weight:600}
  .pick-chaos{margin-top:6px;font-size:11px;color:#ffc700}
  .tw-gen-box{margin-bottom:14px}
  .tier-box{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-bottom:14px}
  .tier-h{font-size:15px;font-weight:800;color:#ffc700;margin-bottom:10px}
  .tier-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
  .tier-tbl th{color:var(--muted);font-weight:600;text-align:center;padding:5px 4px;border-bottom:1px solid var(--line)}
  .tier-tbl td{text-align:center;padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.04)}
  .tier-tbl td:first-child{text-align:left}
  .tier-note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
  .mat-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .mat-tbl{border-collapse:collapse;font-size:12px;min-width:100%}
  .mat-tbl th{color:var(--muted);font-weight:600;padding:5px 8px;white-space:nowrap;border-bottom:1px solid var(--line)}
  .mat-tbl td{text-align:center;padding:6px 8px;white-space:nowrap;font-family:"Space Mono",monospace;font-weight:700}
  .mat-track{text-align:left!important;font-family:"Noto Sans JP",sans-serif!important;font-weight:700!important;color:var(--txt)}
  .mat-hi{color:#51b883;background:rgba(115,201,90,.1)} .mat-mid{color:#ffc700} .mat-lo{color:#ff7171} .mat-na{color:#3a4151}
  .tw-gen-btn{width:100%;font-size:14px;font-weight:700;background:#1da1f2;color:#fff;border:none;border-radius:10px;padding:12px}
  .tw-gen-out{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px 16px}
  .tw-text{font-size:13.5px;line-height:1.7;color:var(--txt);white-space:pre-wrap;font-family:"Noto Sans JP",sans-serif}
  .tw-meta{font-size:11px;color:var(--muted);margin:9px 0;font-family:"Space Mono",monospace}
  .tw-copy-btn{font-size:12px;font-weight:700;background:#57b8ff;color:#06212e;border:none;border-radius:8px;padding:8px 16px}
  .tw-x-btn{font-size:12px;font-weight:700;background:#000;color:#fff;border:1px solid #333;border-radius:8px;padding:8px 16px;margin-left:8px}
  .tw-x-btn:active{opacity:.8}
  .tw-hl-btn{font-size:12px;font-weight:700;background:linear-gradient(90deg,#ffd43d,#ff7171);color:#1a1206;border:none;border-radius:8px;padding:8px 16px;margin-left:8px;margin-top:6px}
  .tw-hl-btn:active{opacity:.85}
  .w5box{padding:6px 2px}
  .w5row{padding:10px 12px;border-bottom:1px solid var(--line)}
  .w5row:last-child{border:none}
  .w5rh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
  .w5rn{font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:16px;color:#ffc700}
  .w5nm{font-size:13px;color:var(--fg)}
  .w5firm{font-family:"Space Mono",monospace;font-size:11px;color:var(--muted)}
  .w5h{font-family:"Space Mono",monospace;font-size:12px;font-weight:700;color:var(--fg);margin-left:auto}
  .w5picks{display:flex;flex-wrap:wrap;gap:6px}
  .w5p{font-size:13px;background:var(--card2,#171c27);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
  .w5p b{color:#ffc700}
  .w5foot{font-size:11px;color:var(--muted);margin-top:8px;padding:8px 12px;line-height:1.5}
  .btn.allchk{flex:1;border-color:var(--rise);color:var(--rise);font-weight:700}
  .imgbtn{background:var(--div)!important}
  .track-block{margin-bottom:26px}
  .track-block-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--mode,var(--vel))}
  .tb-wx{font-size:13px;color:var(--muted);margin:2px 0 10px;padding:7px 11px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;line-height:1.7}
  .tb-wx b{color:var(--txt);font-weight:600}
  .tb-wx .wx-strip{letter-spacing:.02em}
  .track-block-h .tbn{font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:20px;letter-spacing:.04em;color:var(--txt)}
  .track-block-h .tbi{font-family:"Space Mono",monospace;font-size:11px;color:var(--muted)}
  .track-img-btn{background:var(--div);color:#062b0a;border:none;border-radius:8px;font-weight:700;padding:8px 14px;cursor:pointer;font-size:12.5px;white-space:nowrap}
  .track-img-btn.shutuba{border-color:#71c598;color:#71c598}

<script>
"use strict";
/* ===== エラー監視 =====
   ★なぜ要るか★ 本番でJSエラーが起きても、運営が自分のブラウザのコンソールを
   見ない限り気づけない。error_log.php に送って /errlog_view.php で一覧できるようにする。
   最初に置く（他のコードより先に走らせ、初期化中の例外も拾う）。
   1ページ内で最大5件まで（暴走時の連投防止）。送信自体が失敗しても握りつぶす。 */
(function () {
  var sent = 0;
  var MAX = 5;
  function report(msg, stack) {
    if (sent >= MAX) return;
    sent++;
    try {
      fetch("error_log.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          page: location.pathname,
          msg: String(msg == null ? "" : msg).slice(0, 500),
          stack: String(stack == null ? "" : stack).slice(0, 2000)
        }),
        keepalive: true
      }).catch(function () {});
    } catch (_) {}
  }
  window.addEventListener("error", function (e) {
    report(e.message, e.error && e.error.stack);
  });
  window.addEventListener("unhandledrejection", function (e) {
    var r = e.reason;
    report("unhandledrejection: " + (r && r.message ? r.message : r), r && r.stack);
  });
})();
/* ===== 合言葉ゲート（簡易・URL知られても合言葉が要る） =====
   ★平文で持たない★ view-source一目で合言葉が割れないよう、SHA-256ハッシュだけを埋め込む。
   これはサーバー側認証ではなく、あくまで「うっかり閲覧」を防ぐ簡易ゲートに留まる
   （本気で守るならサーバー側Basic認証が要る。docs/SCORING_AUDIT.md参照）。
   新しい合言葉に変えるときは変更後の文字列で以下を計算してPASSPHRASE_SHA256を差し替える:
     await crypto.subtle.digest("SHA-256", new TextEncoder().encode("新しい合言葉"))
       .then(b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join("")) */
const PASSPHRASE_SHA256 = "f0412d6deb4211f732c552943f41b41ace2328886681959a394b59c15a14ce75";
const GATE_KEY = "tweetGate.ok";
async function sha256Hex(s){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join("");
}
function openApp(){ document.getElementById("gate").style.display="none"; document.getElementById("app").style.display="block"; init(); try{ pruneOldPredictions(21); restoreSavedPredictions(); buildSavedPicker(); }catch(_){} }
function setupGate(){
  /* ★自動投稿(Cloudflare Browser Rendering)はゲートを自動通過★（2026-09-18）
     ヘッドレスは毎回localStorageが空でゲートを通れない。?auto=morning|evening|line の時だけ
     openApp()に進む。ゲートのパスはこのファイル内のハッシュ＝本物の秘匿ではなく、
     自動モードは公開予想の生成しかしないので通過を許す。 */
  try{ if(/^(morning|evening|line|monthly|weekly|card)$/.test(new URLSearchParams(location.search).get("auto")||"")){ openApp(); return; } }catch(_){}
  try{ if(localStorage.getItem(GATE_KEY)==="1"){ openApp(); return; } }catch(_){}
  const inp=document.getElementById("gatePw"), btn=document.getElementById("gateBtn"), err=document.getElementById("gateErr");
  const tryPw=async()=>{ if(await sha256Hex((inp.value||"").trim())===PASSPHRASE_SHA256){ try{localStorage.setItem(GATE_KEY,"1");}catch(_){ } openApp(); }
    else { err.textContent="合言葉が違います"; inp.value=""; } };
  btn.onclick=tryPw; inp.onkeydown=e=>{ if(e.key==="Enter") tryPw(); };
  setTimeout(()=>inp.focus(),100);
}

/* ===== テーマ ===== */
(function theme(){
  let t="dark"; try{ t=localStorage.getItem("oddsAnomaly.theme")||"dark"; }catch(_){}
  document.documentElement.setAttribute("data-theme", t==="light"?"light":"dark");
  document.addEventListener("DOMContentLoaded",()=>{
    const b=document.getElementById("themeBtn"); if(!b)return;
    const sync=()=>{ b.textContent=document.documentElement.getAttribute("data-theme")==="light"?"◑ ライト":"◐ ダーク"; };
    sync(); b.onclick=()=>{ const c=document.documentElement.getAttribute("data-theme")==="light"?"dark":"light";
      document.documentElement.setAttribute("data-theme",c); try{localStorage.setItem("oddsAnomaly.theme",c);}catch(_){ } sync(); };
  });
})();

/* ===== 共有ロジック（本体と同じパース・スコア） ===== */
const EXT={jockeyWet:{
  // JRA 雨×騎手（2020-2026集計・勝率差%。app側で×0.6加点）。表記はnetkeiba出馬表準拠
  "武豊":3.2, "横山武":2.9, "菅原明":3.9, "田口貫":3.7, "キング":5.4,   // 雨で上げる
  "北村宏":-2.9, "小崎":-2.8, "ルメール":-2.2, "川田":-1.7, "池添":-1.9   // 雨で下げる
}};
let MODE="nar";
/* 重賞の過去傾向（keiba.go.jp公式28年データから生成した jusho_profiles.json）。無ければ黙ってスキップ */
let JUSHO=null;
try{ fetch("jusho_profiles.json").then(r=>r.ok?r.json():null).then(j=>{JUSHO=j||null;}).catch(()=>{}); }catch(_){}
function normJusho(name){
  let s=String(name||"").replace(/第?[０-９0-9]+回/g,"").replace(/[\s　]+/g,"").replace(/ＧＩＩＩ|ＧＩＩ|ＧＩ|GIII|GII|GI|Jpn[ⅠⅡⅢ123]/g,"");
  const m=s.match(/^(.+?(?:大賞典|賞典|優駿|王冠|記念|カップ|ダービー|オークス|グランプリ|チャンピオンシップ|チャンピオン|マイルグランプリ|マイル|スプリント|ステークス|フェスタ|シンデレラマイル|プリンセス賞|クイーン賞|特別|盃|祭|賞|杯|典))/);
  return m?m[1]:s.slice(0,12);
}

/* ===== AI展開アニメ: スタート後→3角→4角→ゴール(AI予測順) をcanvasで動かし、動画(WebM/mp4)保存も可 =====

  const cv=document.getElementById("faCv"), cx=cv.getContext("2d");
  /* ---- コース定義: 回り(R/L)と最後の直線の公称長(m)。直線が長い場ほど横長の楕円になる ---- */
  const COURSE_GEO={
    "門別":{d:"R",st:330},"盛岡":{d:"L",st:300},"水沢":{d:"R",st:245},
    "浦和":{d:"L",st:220},"船橋":{d:"L",st:308},"大井":{d:"R",st:386},"川崎":{d:"L",st:300},

    "園田":{d:"R",st:213},"姫路":{d:"R",st:230},"高知":{d:"R",st:200},"佐賀":{d:"R",st:200},
    "東京":{d:"L",st:525},"中山":{d:"R",st:310},"京都":{d:"R",st:404},"阪神":{d:"R",st:474},
    "中京":{d:"L",st:412},"新潟":{d:"L",st:659},"福島":{d:"R",st:292},"小倉":{d:"R",st:293},
    "札幌":{d:"R",st:266},"函館":{d:"R",st:262}
  };
  const geo=COURSE_GEO[D.tk]||{d:"R",st:220};
  /* ---- コース楕円（回りと直線長を反映。ゴールは右回り=左下、左回り=右下） ---- */
  const LSlen=Math.max(300,Math.min(430, 340+(geo.st-200)*0.5));
  const X0=(W-LSlen)/2, X1=X0+LSlen, YT=100, YB=290, R=(YB-YT)/2, CY=(YT+YB)/2;
  const LS=X1-X0, LC=Math.PI*R, PERIM=2*LS+2*LC;
  function Praw(a){
    let d=((a%1)+1)%1*PERIM;
    if(d<LC){ // 右カーブ: (X1,YB)→(X1,YT) 右回り込み
      const t=d/LC, th=Math.PI/2 - t*Math.PI; // +90°→-90°
      return {x:X1+R*Math.cos(th), y:CY+R*Math.sin(th), ang:th-Math.PI/2};
    }
    d-=LC;
    if(d<LS){ // 上直線: (X1,YT)→(X0,YT)
      return {x:X1-d, y:YT, ang:Math.PI};
    }
    d-=LS;
    if(d<LC){ // 左カーブ(3角→4角): (X0,YT)→(X0,YB)
      const t=d/LC, th=-Math.PI/2 - t*Math.PI;
      return {x:X0+R*Math.cos(th), y:CY+R*Math.sin(th), ang:th-Math.PI/2};
    }
    d-=LC;
    // 下直線(ホーム): (X0,YB)→(X1,YB) ゴールへ
    return {x:X0+d, y:YB, ang:0};
  }
  /* 右回り(=時計回り)は左回り形状の左右ミラー。ラベルや馬もPを通るので自動で反転する */

  const dist=D.dist||1400;
  const total = dist<=1000?0.45 : dist<=1300?0.60 : dist<=1600?0.80 : dist<=1900?1.00 : 1.15;
  const aFin=0; // ゴール=下直線右端 → P(0)は右カーブ始点なので、ゴールaを直前に置く
  const A_GOAL=(2*LC+LS+LS)/PERIM; /* 下直線の右端=1.0=0 と同じ。ゴール地点a=1(=0) */
  function aOf(p){ return ((1 - (1-p)*total) % 1 + 1) % 1; } // p:0=スタート,1=ゴール
  const hs=D.horses.slice().sort((a,b)=>((a.st!=null?a.st:0.5)-(b.st!=null?b.st:0.5)));

  const key=h=>{ const st=h.st!=null?h.st:0.5, c3=h.c3!=null?h.c3:st, c4=h.c4!=null?h.c4:c3; return [st,c3,c4,h.goalX]; };
  const seg=[[0,0.33],[0.33,0.62],[0.62,0.90],[0.90,1.0]];

  const ease=t=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  function gapAt(h,pr){ const k=key(h);
    for(let si=0;si<seg.length;si++){ const [a,b]=seg[si];
      if(pr<=b||si===seg.length-1){ const lt=Math.min(1,Math.max(0,(pr-a)/((b-a)||1)));
        return k[si]+(k[Math.min(3,si+1)]-k[si])*ease(lt); } }
    return k[3]; }
  const SPREAD=0.13; // 馬群の縦長（コース全長比）
  const WAKU={1:["#f5f5f5","#111"],2:["#222228","#fff"],3:["#ff7171","#fff"],4:["#3a6fd8","#fff"],5:["#e8d24a","#111"],6:["#3ea55b","#fff"],7:["#e8862e","#fff"],8:["#e884b0","#111"]};
  let t0=performance.now(), stopA=false;
  /* 実況テロップと演出用の事前計算 */
  const _byStart=hs.slice().sort((a,b)=>(a.st!=null?a.st:0.5)-(b.st!=null?b.st:0.5));
  const _by4=hs.slice().sort((a,b)=>(a.c4!=null?a.c4:0.5)-(b.c4!=null?b.c4:0.5));
  const _byGoal=hs.slice().sort((a,b)=>a.goal-b.goal);
  const _ax=hs.find(z=>z.mk==="◎");
  const _pos=(arr,h)=>arr.indexOf(h)+1;
  const TELOP=[
    `${_byStart[0]?_byStart[0].nm:""}が先手を主張`+(_ax?`、◎${_ax.nm}は${_pos(_byStart,_ax)}番手`:""),
    _ax?`3コーナー、◎${_ax.nm}は${_pos(_by4,_ax)}番手で進出`:`3コーナー、隊列は変わらず`,
    _ax?`4コーナー、◎${_ax.nm}が${_pos(_by4,_ax)<=3?"好位で直線へ！":"外から直線へ"}`:"4コーナーを回って直線へ",
    `AI予測 1着${_byGoal[0]?_byGoal[0].nm:""}・2着${_byGoal[1]?_byGoal[1].nm:""}・3着${_byGoal[2]?_byGoal[2].nm:""}`
  ];
  function draw(now){ if(stopA) return;
    const t=((now-t0)%(DUR+HOLD)); const pr=Math.min(1,t/DUR);
    const prE=ease(pr);
    cx.clearRect(0,0,W,H);
    /* 背景: ナイター空→芝インフィールド→砂トラック→白ラチ */
    const sky=cx.createLinearGradient(0,0,0,H); sky.addColorStop(0,"#0d1024"); sky.addColorStop(1,"#141225");

    // トラック（砂・太リング）

    cx.lineWidth=46; cx.strokeStyle="#7c5f37";
    cx.beginPath(); for(let a=0;a<=1.001;a+=0.01){ const q=P(a); if(a===0)cx.moveTo(q.x,q.y); else cx.lineTo(q.x,q.y);} cx.closePath(); cx.stroke();
    cx.lineWidth=40; cx.strokeStyle="#93744a";
    cx.stroke();
    // 芝インフィールド
    const inf=cx.createRadialGradient(W/2,CY,20,W/2,CY,240);
    inf.addColorStop(0,"#1c4a2b"); inf.addColorStop(1,"#12301d");
    cx.fillStyle=inf;
    cx.beginPath(); for(let a=0;a<=1.001;a+=0.01){ const q=P(a); const sh=0.78; const x=W/2+(q.x-W/2)*sh, y=CY+(q.y-CY)*sh; if(a===0)cx.moveTo(x,y); else cx.lineTo(x,y);} cx.closePath(); cx.fill();
    // ラチ（内外の白柵）
    for(const sh of [0.885,1.115]){
      cx.beginPath(); for(let a=0;a<=1.001;a+=0.01){ const q=P(a); const x=W/2+(q.x-W/2)*sh, y=CY+(q.y-CY)*sh; if(a===0)cx.moveTo(x,y); else cx.lineTo(x,y);} cx.closePath();

    cx.fillStyle="#fff"; cx.font="bold 11px sans-serif"; cx.fillText("GOAL",g.x-14,g.y+34);
    const stq=P(aOf(0)); cx.fillStyle="#7fd1ae"; cx.font="bold 11px sans-serif"; cx.fillText("START",stq.x-17,stq.y-16);
    cx.fillStyle="#8b93a7"; cx.font="11px sans-serif";
    { const q3=P((LC+LS+LC*0.25)/PERIM), q4=P((LC+LS+LC*0.75)/PERIM);
      cx.fillText("3角", W/2+(q3.x-W/2)*1.26-9, CY+(q3.y-CY)*1.26+4);
      cx.fillText("4角", W/2+(q4.x-W/2)*1.26-9, CY+(q4.y-CY)*1.26+4); }
    /* ヘッダ */
    let ph=0; for(let si=0;si<seg.length;si++){ if(pr>=seg[si][0]) ph=si; }
    cx.fillStyle="#fff"; cx.font="bold 18px sans-serif"; cx.fillText(D.name,14,26);
    cx.fillStyle="#7fd1ae"; cx.font="bold 15px sans-serif"; cx.fillText(PH[ph]+"　"+(D.sf||"ダ")+dist+"m・"+(geo.d==="R"?"右回り":"左回り")+"（直線"+geo.st+"m）",14,46);
    cx.fillStyle="#5a6070"; cx.font="11px sans-serif"; cx.fillText("",W-96,20);
    /* 馬（上下動＋スピード線） */
    const pl=0.02+0.98*prE;
    hs.forEach(h=>{
      const p=Math.max(0,pl-gapAt(h,pr)*SPREAD/Math.max(0.3,total));
      const q=P(aOf(p));
      const off=((h.lane%3)-1)*9;
      const nx=Math.cos((q.ang||0)+Math.PI/2)*off, ny=Math.sin((q.ang||0)+Math.PI/2)*off;
      const bob=Math.sin(now/85+h.lane*1.7)*1.6*(pr<1?1:0.2);
      const x=q.x+nx, y=q.y+ny+bob;

      if(pr>0.02&&pr<1){

        cx.beginPath(); cx.moveTo(x-Math.cos(ang)*13,y-Math.sin(ang)*13); cx.lineTo(x-Math.cos(ang)*24,y-Math.sin(ang)*24); cx.stroke();

function b64url(s){
  const bytes=new TextEncoder().encode(s);
  let bin=""; bytes.forEach(b=>bin+=String.fromCharCode(b));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function unb64url(s){
  let b=String(s).replace(/-/g,"+").replace(/_/g,"/");
  while(b.length%4) b+="=";
  const bin=atob(b); const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function classLevelName(name){

  if(/2勝|２勝|1000万/.test(n)) return 5;
  if(/1勝|１勝|500万/.test(n)) return 4;
  if(/未勝利/.test(n)) return 3;
  if(/新馬/.test(n)) return 3;
  if(/A1|A2|Ａ1|Ａ2|A級/.test(n)) return 6;
  if(/B1|B2|B3|Ｂ1|B級/.test(n)) return 5;
  if(/C1|C2|C3|Ｃ1|C級/.test(n)) return 4;
  if(/認|2歳|3歳|２歳|３歳/.test(n)) return 3;
  if(/賞|特別|記念|杯|盃|ステークス|カップ|オープン/.test(n)) return 6; // 重賞・特別（グレード不明）
  return null;

function parsePastRace(cellHtml){
  const get=(cls)=>{ const m=cellHtml.match(new RegExp('class="'+cls+'"[^>]*>([\\s\\S]*?)</div>')); return m?m[1].replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ").replace(/\s+/g," ").trim():""; };
  const rid=(cellHtml.match(/\/race\/(\d{12})/)||[])[1]||null;
  const d01=get("Data01");    // タグ除去後 "2026.05.20 門別 11" など（日付・場・着順）
  // 着順の取得。netkeiba は着順1〜3着を色分けするため、class="Num" 以外の要素で
  // 出すことがある（class="Num" だけを見ると1〜3着が丸ごと消える＝報告のあった不具合）。
  // そこで「Numクラス」に依存せず、タグ除去済み Data01 の末尾トークンから着順を取る。
  //   例 "2026.05.20 門別 3" → 3着 /  "2026.01.19 名古屋 1" → 1着
  // 取消・除外・中止は数字にならないので null。数字が無ければ Num系クラスからも試す（保険）。
  let rank=null;

  const lastTok=parts.length?parts[parts.length-1]:"";
  if(/^\d{1,2}$/.test(lastTok)){
    rank=+lastTok;                 // Data01末尾が着順（"… 門別 3"）
  } else {
    // Data01末尾が数字でない（着順が別要素/別セルにある構造）→ セル全体から着順要素を探す。
    // class名に依存しないよう、Data01直後〜Data02手前の最初の 1〜2桁数字spanを着順とみなす。
    const seg = cellHtml.match(/class="Data01"[\s\S]*?(?=class="Data0[2-9]"|$)/);
    const rm = (seg?seg[0]:cellHtml).match(/>\s*(\d{1,2})\s*<\/(?:span|div)>/);
    if(rm) rank=+rm[1];
    else { const nm=cellHtml.match(/class="[^"]*\bNum\b[^"]*"[^>]*>\s*(\d{1,2})\s*</); if(nm) rank=+nm[1]; }
  }
  const d05=get("Data05");                                   // "ダ2400 2:36.0 良"
  const d03=get("Data03");                                   // "12頭 10番 6人 騎手 56.0"
  const d06=get("Data06");                                   // "6-6-7-8 (38.7) 484(-16)"

  const dist=+((d05.match(/[芝ダ](\d{3,4})/)||[])[1]||0)||null;

  //   良 / 稍(重) / 重 / 不(良)  → 正規化して 良・稍重・重・不良 に統一。
  //   ※順序に注意: 「稍重」「不良」を先に試し、無ければ1文字略記を拾う。
  let going=null;
  const gm=(d05||"").match(/稍重|不良|良|稍|不|重/);
  if(gm){ const g=gm[0]; going = g==="稍"?"稍重" : g==="不"?"不良" : g; }
  const fieldN=+((d03.match(/(\d{1,2})頭/)||[])[1]||0)||null;
  const pop=+((d03.match(/(\d{1,2})人/)||[])[1]||0)||null;
  // 騎手: Data03 = "頭数 馬番 人気 騎手名 斤量"。人気と斤量の間が騎手
  let jockey=null;
  const jm=d03.match(/\d{1,2}人\s*([^\d\s][^\d]*?)\s*\d{2}\.\d/);
  if(jm) jockey=jm[1].trim().replace(/\s+/g,"");
  const passing=(d06.match(/([\d]+(?:-[\d]+){1,3})/)||[])[1]||null;   // 通過順

  // 馬体重(増減): "480(+4)" "456(-2)" "470(0)"
  const wm=d06.match(/(\d{3})\(\s*([+-]?\d+)\s*\)/);
  const weight = wm? +wm[1] : null;
  const wdiff = wm? +wm[2] : null;
  // 走破タイム "2:36.0" → 秒
  const tm=d05.match(/(\d+):(\d{2}(?:\.\d)?)/);
  const time = tm? (+tm[1]*60 + parseFloat(tm[2])) : null;
  const turn=rid?turnOfRid(rid):null;
  // レース日付（Data01先頭 "2026.04.12"）→ YYYYMMDD
  let rdate=null;
  const dm=d01.match(/(\d{4})\.(\d{1,2})\.(\d{1,2})/);
  if(dm) rdate = dm[1]+String(dm[2]).padStart(2,"0")+String(dm[3]).padStart(2,"0");
  // 脚質: 通過順の最初のコーナー位置/頭数で判定
  let style=null;
  if(passing&&fieldN){ const first=+passing.split("-")[0]; const r=first/fieldN;
    style = r<=0.20?"逃":(r<=0.45?"先":(r<=0.75?"差":"追")); }

  const d02name=(d02.match(/>\s*([^<>\n]+?)\s*</)||d02.match(/([^<>\n]+)/)||[])[1]||"";
  const clv=classLevelFromBlock(d02, d02name);

          track: rid?trackNameOfRid(rid):null};
}

function parseShutuba(html){

    let belong=null;
    if(/Icon_MaruChi/.test(r)) belong="地";          // JRA: 地方所属馬(マル地)
    else if(/Icon_MaruGai/.test(r)) belong="外";     // JRA: 外国馬(マル外)
    else if(/Icon_kaku[A-Za-z]*Gai/.test(r)) belong="外";  // カク外
    else if(/Icon_HorseMark\s+Icon_kaku[A-Za-z]*Chi/.test(r)) belong="カク地";
    const wcell=r.match(/class="Weight"[^>]*>([\s\S]*?)<\/td>/);
    if(wcell){ const wt=wcell[1].replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ");
      const wm=wt.match(/(\d{3})\s*\(\s*([+-]?\d+)\s*\)/);
      if(wm){ weight=+wm[1]; wdiff=+wm[2]; }
      else { const wo=wt.match(/\b(\d{3})\b/); if(wo) weight=+wo[1]; }  // 増減無し(新馬等)
    }
    // 近走（Past セル）を最大5走パース。
    // netkeiba は着順1〜3着の走に class="Past Ranking_1/2/3"（色分け）を付ける。
    // 旧 /class="Past"[\s\S]*?<\/td>/ は class="Past" 完全一致前提のため、この複合クラスの
    // セルを正しく1セルとして拾えず、好走した近走(1〜3着)が丸ごと欠落していた
    // （＝報告のあった「3着だけ入ってない」の真因）。td単位で Past を含むセルを取る。
    const pastCells=r.match(/<td[^>]*class="[^"]*\bPast\b[^"]*"[\s\S]*?<\/td>/g)||[];
    const past=pastCells.map(parsePastRace)
      .filter(p=> p.rid || p.rank!=null || p.rdate || p.dist )   // 空(休養)セルを除外
      .slice(0,5);                                               // 有効走の中から最大5走
    // 血統・厩舎: Horse_Info セル内 Horse01=父, (母父), 所属・調教師
    let sire=null, damsire=null, trainer=null;
    // 調教師ID（/trainer/ID または /trainer/result/recent/ID）
    let trainerId=null;
    const trm=r.match(/\/trainer\/(?:result\/recent\/)?([0-9a-z]{4,7})\/?"/);
    if(trm && trm[1]!=="result") trainerId=trm[1];
    if(info){
      const txt=info[0].replace(/<[^>]+>/g,"\n").replace(/&nbsp;/g," ");
      const lines=txt.split("\n").map(s=>s.trim()).filter(s=>s);
      const idxName=lines.findIndex(s=>s===n[2]);
      for(let i=0;i<lines.length;i++){
        const ln=lines[i];
        if(ln===n[2]) continue;
        const ds=ln.match(/^\(([^)]{2,20})\)$/); if(ds&&!damsire){ damsire=ds[1]; continue; }
        if(/美浦|栗東|地方|・/.test(ln) && /[・]/.test(ln) && !trainer){ trainer=ln.replace(/\s+/g,""); continue; }
        if(!sire && /^[ァ-ヶA-Za-z][ァ-ヶーA-Za-z' .]{1,22}$/.test(ln) && (idxName<0||i<idxName)) sire=ln;
      }
    }
    // ブリンカー: 馬名直後の <span class="Mark">B</span>（Horse_Info内に限定。Rank_B等の誤検出を避ける）
    let blinker=false;
    if(info){ blinker=/<span class="Mark">\s*B\s*<\/span>/.test(info[0]); }
    if(!blinker){ // フォールバック: この馬のhorseリンク直後のMark
      const re2=new RegExp('/horse/'+hid+'[^"]*"[^>]*>\\s*'+name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*</a>\\s*<span class="Mark">\\s*B');
      blinker=re2.test(r);
    }
    // 性齢: 牡4 / 牝3 / セ7
    let sexAge=null;
    const barei=r.match(/class="Barei[^"]*"[^>]*>\s*([牡牝セせん騸]+)\s?(\d{1,2})/);
    if(barei) sexAge=barei[1].replace("せん","セ").replace("騸","セ")+barei[2];
    else { const sa=r.match(/([牡牝セせん騸]+)\s?(\d{1,2})/); if(sa) sexAge=sa[1].replace("せん","セ").replace("騸","セ")+sa[2]; }
    // 性別記号だけ（牡/牝/セ）
    let sex=null; if(sexAge){ const sm=sexAge.match(/^[牡牝セ]/); if(sm) sex=sm[0]; }
    entries[num]={num, name, waku:w?+w[1]:null, jockey, jockeyId, kinryo, hid, past, sire, damsire, trainer, trainerId, blinker, weight, wdiff, sexAge, sex, belong};
    order.push(num);
  });
  // コース条件
  const cond={going:null, weather:null, surface:null, dist:null, raceName:null};
  const d01=html.match(/RaceData01[\s\S]{0,400}/);
  if(d01){ const txt=d01[0].replace(/<[^>]+>/g," ").replace(/\s+/g," ");
    const g=txt.match(/馬場[:：]?\s*(良|稍重|重|不良)/); if(g) cond.going=g[1];
    const we=txt.match(/天候[:：]?\s*(晴|曇|雨|小雨|雪|小雪)/); if(we) cond.weather=we[1];
    const c=txt.match(/(芝|ダ|ダート)\s*(\d{3,4})m/); if(c){ cond.surface=c[1]==="芝"?"芝":"ダ"; cond.dist=+c[2]; } }
  const rn=html.match(/RaceName"?[^>]*>\s*([^<\n]{1,40}?)\s*</); if(rn) cond.raceName=rn[1].trim();
  // 今走の回り（race_idから）
  cond.turn = state.raceId? turnOfRid(state.raceId) : null;
  return {entries, order, cond};
}

function parseRaceListHTML(html){
  const out=[], seen=new Set();
  // race_id の全出現を順に拾う（shutuba/result/odds いずれのリンクでも可）
  const re=/race_id=(\d{12})/g; let m;
  while((m=re.exec(html))){
    const rid=m[1]; if(seen.has(rid)) continue; seen.add(rid);
    let win=html.slice(m.index, m.index+900);
    let tm=win.match(/(\d{1,2}:\d{2})/);
    let nm=win.match(/Item(?:Title|Long)"?[^>]*>\s*([^<\n]{1,40}?)\s*</i);
    /* ★中継ごしの一覧は形が違う（2026-11-15）★ 「*   [11R レース名 15:40 芝2200m 18頭 …](…race_id=…)」と、時刻と名前がリンクの前に来る。
       上の読み方（リンクの後ろを見る）だと次のレースの発走時刻を拾ってしまう（全レースが1つずつずれる）。同じ行の頭から読む。 */
    { const ls=html.lastIndexOf("\n", m.index)+1, line=html.slice(ls, m.index);
      const mk=line.match(/^\*?\s*\[(\d{1,2})R\s+(.+?)\s+(\d{1,2}:\d{2})\s/);
      if(mk){ tm=[mk[3],mk[3]]; nm=[mk[2],mk[2]]; win=line; } }
    // グレード: JRA=Icon_GradeType{1|2|3}。NAR=名前内の(JpnⅠ/Ⅱ/Ⅲ)や重賞表記、主要重賞名で判定
    const gm=win.match(/Icon_GradeType(\d+)/);
    let grade=null; if(gm){ const g=+gm[1]; if(g===1)grade="G1"; else if(g===2)grade="G2"; else if(g===3)grade="G3"; }
    const rawName = nm?decodeHtmlEntities(nm[1].trim()):"";
    if(!grade){
      // NAR: Jpn表記
      if(/Jpn\s*[Ⅰ1]|\(GⅠ\)|\(G1\)/.test(win)||/Jpn\s*[Ⅰ1]/.test(rawName)) grade="JpnⅠ";
      else if(/Jpn\s*[Ⅱ2]/.test(win)||/Jpn\s*[Ⅱ2]/.test(rawName)) grade="JpnⅡ";
      else if(/Jpn\s*[Ⅲ3]/.test(win)||/Jpn\s*[Ⅲ3]/.test(rawName)) grade="JpnⅢ";
      else if(/重賞/.test(win)) grade="重賞";
      else if(NAR_JUSHO.some(name=>rawName.includes(name))) grade="重賞";
    }
    out.push({race_id:rid, track:trackOf(rid), no:parseInt(rid.slice(10),10), post:tm?tm[1]:null, name:rawName, grade});
  }
  return out.sort((a,b)=> a.track===b.track ? a.no-b.no : 0);
}

/* ◎馬の各ボーナス内訳を計算（効果測定用。fundamentalScoreと同じ式を個別集計） */
let LIVE_BIAS={};  // 当日トラックバイアス実測 {tc:{inner,front,n,ts}}
/* 同開催の終了レース結果から「内/外枠・前/差し」の実決着を集計し、その日のコース補正を実測で上書き（盛らない=測ったまま） */
async function refreshLiveBias(tc, races){
  try{
    const ordered=(races||[]).slice().sort((a,b)=>a.no-b.no);
    let innerSum=0, frontSum=0, fN=0, miss=0;
    for(const r of ordered){
      let rows=[];
      try{ const html=await fetchDecoded(resultURL(r.race_id)); rows=parseResult(html)||[]; }catch(_){ rows=[]; }
      if(!rows.length){ if(fN>0) break; miss++; if(miss>=4) break; continue; }  // 未確定。1件でも確定後に空が来たら以降は未施行とみなし打ち切り
      if(rows.length<6) continue;  // 少頭は傾向が出にくいのでサンプルから除外（打ち切りはしない）
      const N=rows.length, top=rows.filter(x=>x.rank<=3);
      if(!top.length) continue;
      innerSum += (top.reduce((a,x)=>a+(1-(((+x.num)||N)-1)/Math.max(1,N-1)),0)/top.length - 0.5);  // 内枠度 1=最内
      let fv=0,fc=0;
      top.forEach(x=>{ if(x.passing){ const p1=+String(x.passing).split("-")[0]; if(p1>0){ fv+=(1-(p1-1)/Math.max(1,N-1)); fc++; } } });  // 1角通過 小=前
      if(fc) frontSum += (fv/fc - 0.5);
      fN++;
    }
    if(fN>=3){
      const k=4.0, cl=v=>Math.max(-2.5,Math.min(2.5,v));
      const inner=+cl((innerSum/fN)*k).toFixed(2), front=+cl((frontSum/fN)*k).toFixed(2);
      LIVE_BIAS[tc]={inner, front, n:fN, ts:Date.now()};
      const nm=(JRA_TRACK[tc]||NAR_TRACK[tc]||("場"+tc));
      toast(`本日傾向 ${nm}: 内${inner>=0?"+":""}${inner.toFixed(1)} / 前${front>=0?"+":""}${front.toFixed(1)}（${fN}R実測）`);
    } else { delete LIVE_BIAS[tc]; }
  }catch(_){}
}

function scoreBreakdown(num, ctx){
  const entries = ctx? ctx.entries : state.entries;
  const e=(entries&&entries[num])||{};
  const past=e.past||[];
  const rid = ctx? ctx.raceId : state.raceId;
  const race = ctx? ctx.race : state.race;
  const curSurf = race&&race.surface;
  const b={ jockey:0, sire:0, trainer:0, drop:0, rest:0, course:0 };
  if(rid && rid.slice(4,6)==="65") return b;   // ばんえいは別系統なので内訳対象外
  // 騎手
  if(e.jockeyId && JOCKEY_STATS[e.jockeyId]){
    const jst=JOCKEY_STATS[e.jockeyId];
    if(jst[1]>=30) b.jockey=+Math.max(0, Math.min(6, (jst[0]-15)*0.25)).toFixed(2);
  }
  // 血統
  if(e.sire && SIRE_STATS[e.sire] && curSurf){
    const ss=SIRE_STATS[e.sire];
    if(ss[0]+ss[2]>=30){
      const isTurf=(curSurf==="芝"); const runs=isTurf?ss[0]:ss[2], wins=isTurf?ss[1]:ss[3];
      let v=0;
      if(runs>=15) v+=Math.max(0, Math.min(3, (wins/runs*100-6)*0.5));
      if(ss[4]!=null && ss[4]>=1.5) v+=Math.min(2, (ss[4]-1.5)*2);
      b.sire=+v.toFixed(2);
    }
  }
  // 調教師
  if(e.trainerId && TRAINER_STATS[e.trainerId]){
    const ts=TRAINER_STATS[e.trainerId];
    if(ts[1]>=30) b.trainer=+Math.max(0, Math.min(3, (ts[0]-18)*0.18)).toFixed(2);
  }
  // 降級ボーナス
  const curClv = classLevelName(race&&race.name) || (ctx&&ctx.curClv) || null;
  if(curClv && past.length){
    let dropBonus=0;
    past.forEach((p,idx)=>{
      if(!p.clv || !p.rank || !p.fieldN) return;
      if(p.clv <= curClv) return;
      const up = Math.min(3, p.clv - curClv);
      const topHalf = p.rank <= Math.ceil(p.fieldN/2);
      const goodRun = p.rank <= Math.max(3, Math.ceil(p.fieldN*0.3));
      const recency = idx===0?1.0 : idx===1?0.7 : 0.5;
      if(goodRun) dropBonus += up*1.4*recency; else if(topHalf) dropBonus += up*0.6*recency;
    });
    b.drop=+Math.min(4, dropBonus).toFixed(2);
  }
  // 休養明け減点
  if(past.length && past[0].rdate && ctx && ctx.raceDate){
    const days = dateDiffDays(past[0].rdate, ctx.raceDate);
    if(days!=null && days>0){
      if(days>=70 && days<120) b.rest=-1.5;
      else if(days>=120 && days<180) b.rest=-3;
      else if(days>=180 && days<300) b.rest=-5;
      else if(days>=300) b.rest=-4;
      else if(days<=5) b.rest=-1;
    }
  }
  // コース有利度
  if(rid){
    const tc=rid.slice(4,6); const fieldN=entries?Object.keys(entries).length:0; const myNum=+num;
    let fb=0, fn=0;
    past.forEach((p,idx)=>{ if(p.style){ fn++; if(p.style==="逃"||p.style==="先") fb+=(idx===0?1:0.7); } });
    const isFront = fn>0 && (fb/fn)>=0.45;
    let bias=COURSE_BIAS[tc];
    if(!bias){ const jb=COURSE_BIAS_JRA[tc]; if(jb) bias = /ダ/.test((ctx&&ctx.race&&ctx.race.surface)||"") ? jb.dirt : jb.turf; }
    const _lb=LIVE_BIAS[tc]; if(_lb && _lb.n>=3){ bias={inner:((bias&&bias.inner)||0)+_lb.inner, front:((bias&&bias.front)||0)+_lb.front}; }
    if(bias && fieldN>0){
      let v=0;
      if(bias.inner){ const ip=1-(myNum-1)/Math.max(1,fieldN-1); v+=ip*bias.inner; }
      if(bias.front && isFront) v+=bias.front;
      b.course=+v.toFixed(2);
    }
  }
  return b;
}
/* 出走馬の脚質傾向を判定: front(逃/先) / closer(差/追) / mid */
function styleType(e){
  const ps=(e&&e.past)||[]; let fb=0,cb=0,n=0;
  ps.forEach((pp,idx)=>{ if(pp.style){ n++; const w=(idx===0?1:0.7);
    if(pp.style==="逃"||pp.style==="先") fb+=w; else if(pp.style==="差"||pp.style==="追") cb+=w; } });
  if(!n) return null;
  if(fb/n>=0.45) return "front";
  if(cb/n>=0.45) return "closer";
  return "mid";

/* スピード指数: 過去走の走破タイムを競馬場別基準タイム差(馬身)に換算。馬場補正で良相当に正規化。0.6*ベスト+0.4*近走加重平均 */
function speedIndex(e){
  const ps=(e&&e.past)||[]; const figs=[];
  for(let i=0;i<ps.length && i<5;i++){ const p=ps[i];
    if(!p||!p.time||!p.surf||!p.dist||!p.rid) continue;
    const b=BASE_TIME[p.rid.slice(4,6)+p.surf+p.dist]; if(!b) continue;

    if(p.going && p.going!=="良"){ const off=GOING_OFF[p.surf+"|"+p.going]; if(off==null) continue; t-=off; }

  const best=Math.max(...figs.map(f=>f.fig));
  let wa=0,ws=0; figs.forEach(f=>{wa+=f.fig*f.w;ws+=f.w;});
  const si = 0.6*best + 0.4*(wa/ws);

  return Math.max(-15, Math.min(15, si));

      /* レースレベル: 3着内だった過去走の「標準タイム−勝ちタイム相当」。速いレースで通用した実績 */

        if(_std){ const _rsv=_std-p.time; if(_rsv>-8 && _rsv<8){ if(rlBest==null||_rsv>rlBest) rlBest=_rsv; } }
      }
      if(p.rank==null||!p.fieldN) return;
      const recency = idx===0?1.0 : idx===1?0.8 : idx===2?0.6 : 0.4;
      let posScore = 1 - 2*( (p.rank-1) / Math.max(1,p.fieldN-1) );

      }

      else if(curClv && p.clv && p.clv<curClv && posScore>0){
        const down=Math.min(3, curClv-p.clv);
        posScore *= Math.max(0.6, 1 - down*0.13);
      }
      const popBeat = p.pop? (p.pop - p.rank)/Math.max(1,p.fieldN) : 0;
      const v = (posScore*0.7 + popBeat*0.6) * recency;
      perf += v; n += recency;
      if(curTurn && p.turn===curTurn){ turnPerf+=posScore*recency; turnN+=recency; }
      if(curSurf && p.surf===curSurf){ surfPerf+=posScore*recency; surfN+=recency; }
      if(curDist && p.dist && Math.abs(p.dist-curDist)<=200){ distPerf+=posScore*recency; distN+=recency; }
      if(p.last3f && p.last3f<last3fBest) last3fBest=p.last3f;
      if(p.style==="逃"||p.style==="先"){ frontBias += recency; }

    /* ★2026-07-25追加: 重賞休み明けボーナス★

    if(distN>0) s += __T('距離適性',(distPerf/distN) * 10);

    if(wet) s += __T('前付け',frontRatio*10); else s += __T('前付け',frontRatio*2);

    // 降級ボーナス: 今走より格上クラスで「通用してた」走があれば加点（格上の実力者が降りてきた）
    if(curClv){
      let dropBonus=0;

        if(p.clv <= curClv) return;                       // 格上の走だけ対象

    if(ss[0]+ss[2]>=30){

      const runs=isTurf?ss[0]:ss[2], wins=isTurf?ss[1]:ss[3];
      if(runs>=15) s+=__T('血統(馬場)',Math.max(0, Math.min(3, (wins/runs*100-6)*0.5)));  // 産駒勝率6%超から加点, 12%で満点3
      if(ss[4]!=null && ss[4]>=1.5) s+=__T('血統(EI)',Math.min(2, (ss[4]-1.5)*2));      // EI 1.5→0点, 2.5→2点

  }
  // 休養明け減点: 前走からの間隔が長いほど割引（レース勘・調整の不安）
  // ★2026-07-25: 重賞は上の「重賞休養」ブロックが逆方向（長期休養ほど加点）の

  //   bt_interval_all.py・432,255走で確認: 一般戦は長期休養ほど下がる、重賞は逆、

  if(!isJraStakes && past.length && past[0].rdate && ctx && ctx.raceDate){
    const days = dateDiffDays(past[0].rdate, ctx.raceDate);
    if(days!=null && days>0){

      else if(days>=120 && days<180) s-=3;

  // コース別 脚質・枠 有利度（南関の各場の傾向。馬番＋脚質で加点）

    // その馬の脚質傾向（逃げ先行寄りか）。frontRatioは上で算出済みだが此処で再取得
    const past2=e.past||[];
    let fb=0, fn=0;
    past2.forEach((p,idx)=>{ if(p.style){ fn++; if(p.style==="逃"||p.style==="先") fb+=(idx===0?1:0.7); } });
    const isFront = fn>0 && (fb/fn)>=0.45;   // 逃げ先行型
    let bias = COURSE_BIAS[tc];
    if(!bias){ const jb=COURSE_BIAS_JRA[tc]; if(jb) bias = /ダ/.test((typeof ctx!=="undefined"&&ctx&&ctx.race&&ctx.race.surface)||"") ? jb.dirt : jb.turf; }
    const _lb=LIVE_BIAS[tc]; if(_lb && _lb.n>=3){ bias={inner:((bias&&bias.inner)||0)+_lb.inner, front:((bias&&bias.front)||0)+_lb.front}; }
    if(bias && fieldN>0){
      // 内枠有利度: 馬番が内ほど加点（内枠係数×コース強度）
      if(bias.inner){
        const innerPos = 1 - (myNum-1)/Math.max(1,fieldN-1);  // 1番=1.0, 最外=0

  return s;

/* ばんえい専用スコア。着順実績・斤量・馬体重・騎手で評価（上がり/回り/血統は使わない） */
function baneiScore(num, e, past, ctx){
  let s=50;
  // 着順実績（近走の着順。フィールドサイズは基本10頭）
  if(past.length){
    let perf=0, n=0;
    past.forEach((p,idx)=>{
      if(p.rank==null||!p.fieldN) return;
      const recency = idx===0?1.0 : idx===1?0.8 : idx===2?0.6 : 0.4;
      const posScore = 1 - 2*((p.rank-1)/Math.max(1,p.fieldN-1));  // 1着=+1, 最下位=-1
      perf += posScore*recency; n += recency;
    });
    if(n>0) s += (perf/n) * 30;   // 着順実績を重視
  }
  // 馬体重（ばんえいは大きい＝パワー。900kg超が標準、1000kg超は強力）
  if(e.weight){
    if(e.weight>=1050) s += 4;
    else if(e.weight>=1000) s += 2.5;
    else if(e.weight>=950) s += 1;
    else if(e.weight<900) s -= 2;   // 小柄はパワー不足
  }
  // 斤量（負担重量。重いほど不利。ばんえいはハンデが大きい）
  if(e.kinryo){
    const kg=+e.kinryo;
    if(kg>0){
      // 同レース内の相対は取れないので、絶対値で。重量級は減点
      if(kg>=680) s -= 3;
      else if(kg>=660) s -= 1.5;
      else if(kg<=600) s += 1.5;   // 軽ハンデは有利
    }
  }
  /* ★2026-07-24追加: 馬体重の増減★
     bt_banei.jsで検証（holdout6,149R・人気帯統制）: 増加した馬は複勝率がやや高い
     （そりを曳く力を測る種目のため、平地と違い「増加=マイナス」ではない）。
     baneiScore単体の複勝率47.0%→47.6%へ改善（train/holdout両方で一貫）。
     年齢・クラス複勝率も試したが、年齢は上乗せ効果なし、クラス複勝率は
     +1.2pt改善したもののkeiba.go.jp公式CSVの条件区分が元で、
     netkeiba出馬表からは同じ形で再現できないため不採用（バックテストと
     本番の入力がズレる＝盛った数字になるリスクがあるため見送り）。 */
  if(e.wdiff!=null && isFinite(+e.wdiff)){
    const wd=+e.wdiff;
    if(wd>=15) s += 3;
    else if(wd>=6) s += 1.5;
    else if(wd<=-15) s -= 3;
    else if(wd<=-6) s -= 1.5;
  }
  // 騎手成績（ばんえい専門騎手。JOCKEY_STATSに居れば反映）
  if(e.jockeyId && JOCKEY_STATS[e.jockeyId]){
    const js=JOCKEY_STATS[e.jockeyId];   // [複勝率%, 騎乗数]
    if(js[1]>=30) s += Math.max(0, Math.min(6, (js[0]-15)*0.25));
  }
  return s;
}
/* YYYYMMDD同士の日数差 */
function dateDiffDays(from, to){
  const p=(s)=>{ const m=/^(\d{4})(\d{2})(\d{2})$/.exec(s); return m? new Date(+m[1],+m[2]-1,+m[3]) : null; };
  const a=p(from), b=p(to); if(!a||!b) return null;
  return Math.round((b-a)/86400000);
}

function raceCancelInfo(html){
  const m=html.match(/Race_Infomation_Box"[^>]*>([^<]*)</);
  if(m){
    const t=m[1].trim();
    if(/取り止め|中止|順延/.test(t)) return t;
  }
  /* ★文言が無いまま不成立になるレースがある★
     2026/7/28 金沢4R は Race_Infomation_Box が
     「レース確定後10分前後で公開予定です。」のままで、
     ページ全体に「中止」「取消」の語が一度も出てこない。
     唯一の手がかりが **払戻が全券種「返還」** であること。

     これを取れないと decided=false かつ cancelled=false になり、
     答え合わせの打ち切り（後続を取得しない）が誤って発動して、
     5R以降が全部「結果待ち」のまま残った。

     ★実測（生HTMLでの「返還」出現数）★
       通常のレース(金沢3R/10R) : 0
       不成立のレース(金沢4R)    : 9（全9券種）
       1頭だけ出走取消の部分返還 : その馬の単複ぶんのみ（数個）
     0と9の間は十分に開いているので、6以上を不成立とみなす。
     「返還が1つでもあれば」にすると部分返還を誤判定する。 */
  const ret=(html.match(/返還/g)||[]).length;
  if(ret>=6) return "全券種返還（レース不成立）";
  return null;
}
function parseResult(html){
  const out=[];
  // db.netkeiba形式（race_table_01: 着/枠/馬番/馬名/性齢/斤量/騎手/タイム…）
  if(/race_table_01/.test(html) && !/class="Rank"/.test(html)){
    const dtrs=(html.match(/<tr[\s\S]*?<\/tr>/g)||[]).filter(t=>/\/horse\//.test(t));
    dtrs.forEach(t=>{
      const cells=[...t.matchAll(/<td[^>]*>([\s\S]*?)<\/td>/g)].map(c=>c[1].replace(/<[^>]+>/g,"").replace(/&nbsp;/g," ").trim());
      if(cells.length<8) return;
      const rank=parseInt(cells[0],10); if(!isFinite(rank)) return;
      const waku=parseInt(cells[1],10)||null;
      const num=String(parseInt(cells[2],10));
      const name=(t.match(/\/horse\/[A-Za-z]?[0-9][A-Za-z0-9]{5,11}\/?"[^>]*>\s*([^<]{1,30}?)\s*</)||[])[1]||cells[3]||"";
      let pop=null; const popIdx=cells.findIndex((c,i)=>i>7 && /^\d{1,2}$/.test(c) && +c<=18);
      if(popIdx>=0) pop=+cells[popIdx];
      let last3f=null; for(const c of cells){ if(/^\d{2}\.\d$/.test(c)){ const v=+c; if(v>=30&&v<=45){ last3f=v; break; } } }
      // 通過順（n-n-n-n 形式のセル）→ 脚質
      let passing=null,style=null;
      for(const c of cells){ if(/^\d+(-\d+){1,3}$/.test(c)){ passing=c; break; } }
      const cleanName=/[\uFFFD\u0000-\u001F]/.test(name)?"":name;
      out.push({rank, waku, num, name:cleanName, jockey:cells[6]||"", pop, timeSec:timeToSec(cells[7]), time:cells[7]||null, last3f, passing});
    });
    out.sort((a,b)=>a.rank-b.rank);
    const okName=out.some(o=>o.name&&o.name.length>=2);
    return (out.length>=2 && out[0].rank===1 && okName)? out : [];
  }
  const trs=html.match(/<tr[\s\S]*?<\/tr>/g)||[];
  trs.forEach(r=>{
    if(!/class="Rank"/.test(r)) return;
    const rk=r.match(/class="Rank"[^>]*>\s*(\d{1,2})\s*</); if(!rk) return;
    const rank=parseInt(rk[1],10); if(!isFinite(rank)) return;
    // 枠: class="Num WakuN" の div値 / 馬番: 次の class="Num ..." の div値
    const waku=(r.match(/class="Num Waku(\d+)"/)||[])[1];
    const numCells=[]; r.replace(/class="Num [^"]*"[^>]*>\s*<div[^>]*>\s*(\d{1,2})\s*</g,(_,n)=>{numCells.push(n);return"";});
    // numCells[0]=枠, [1]=馬番 （Waku→Txt_C の順）。馬番は最後の数値を採用
    const num = numCells.length>=2 ? String(parseInt(numCells[1],10)) : (numCells.length===1?String(parseInt(numCells[0],10)):null);
    const name=(r.match(/\/horse\/[A-Za-z]?[0-9][A-Za-z0-9]{5,11}[^"]*"[^>]*title="([^"]{1,30})"/)||r.match(/HorseNameSpan">([^<]{1,30})</)||r.match(/\/horse\/[A-Za-z]?[0-9][A-Za-z0-9]{5,11}[^"]*"[^>]*>([^<]{1,30})</)||[])[1]||"";
    const jk=(r.match(/\/jockey\/(?:result\/recent\/)?\d+[^"]*"[^>]*>\s*([^<]{1,16}?)\s*</)||[])[1]||"";
    const ninki=r.match(/Odds_Ninki[^>]*>\s*(?:<span[^>]*>)?\s*(\d{1,2})/)||r.match(/Popular[^>]*>\s*(?:<span[^>]*>)?\s*(\d{1,2})/);
    const pop=ninki?+ninki[1]:null;
    const cells=[]; r.replace(/<t[dh][^>]*>([\s\S]*?)<\/t[dh]>/g,(_,c)=>{cells.push(c.replace(/<[^>]+>/g,"").trim());return"";});
    const time=cells.find(c=>/^\d:\d{2}\.\d$/.test(c))||null;
    const decs=cells.filter(c=>/^\d{1,3}\.\d$/.test(c));
    const last3f=decs.find(c=>{const v=+c;return v>=30&&v<=45;})||null;
    if(!num) return;
    // 文字化け・ゴミ名を弾く: 置換文字や制御文字を含む、または日本語/英数を全く含まない名前は無効
    const cleanName = /[\uFFFD\u0000-\u001F]/.test(name) ? "" : name;
    out.push({rank, waku:waku?+waku:null, num, name:cleanName, jockey:jk, pop, timeSec:timeToSec(time), time, last3f:last3f?+last3f:null});
  });
  out.sort((a,b)=>a.rank-b.rank);
  // 妥当性チェック: 着順が1から連続してない / 名前が全部空 なら未確定とみなし破棄
  const ranks=out.map(o=>o.rank);
  const hasName=out.some(o=>o.name && o.name.length>=2);
  const seqOk = ranks.length>=2 && ranks[0]===1;
  if(!hasName || !seqOk) return [];
  return out;
}

/* 払戻金パース → {tansho:[{nums:[4],yen:130}], fukusho:[...], umaren, umatan, wide, fuku3, tan3} */
function parsePayouts(html){
  const pay={tansho:[],fukusho:[],umaren:[],umatan:[],wide:[],fuku3:[],tan3:[]};
  const clsMap={Tansho:"tansho",Fukusho:"fukusho",Umaren:"umaren",Umatan:"umatan",Wide:"wide",Fuku3:"fuku3",Tan3:"tan3"};
  for(const cls in clsMap){
    const m=html.match(new RegExp('class="'+cls+'"[\\s\\S]{0,600}?</tr>'));
    if(!m) continue;
    const block=m[0];
    // 組番: <td class="Result"> 内の <div><span>N</span></div>（空spanは無視）/ 金額: <td class="Payout"> 内の NNN円
    const resultPart=(block.match(/class="Result"[\s\S]*?<\/td>/)||[block])[0];
    const numTokens=[...resultPart.matchAll(/<span>\s*(\d{1,2})\s*<\/span>/g)].map(x=>x[1]);
    const payPart=(block.match(/class="Payout"[\s\S]*?<\/td>/)||[""])[0];
    const yens=[...payPart.matchAll(/([\d,]+)\s*円/g)].map(x=>+x[1].replace(/,/g,""));
    if(!yens.length || !numTokens.length) continue;
    // 1組あたりの馬番数: 単=1 複=1 馬連/ワイド/馬単=2 3連複/単=3
    const per = (cls==="Tansho"||cls==="Fukusho")?1 : (cls==="Fuku3"||cls==="Tan3")?3 : 2;
    // numTokensを yens.length 組に分配（複勝/ワイドは複数組）
    let idx=0;
    for(let k=0;k<yens.length;k++){
      const nums=numTokens.slice(idx, idx+per); idx+=per;
      if(nums.length<per) break;
      pay[clsMap[cls]].push({nums:nums.map(n=>String(+n)), yen:yens[k]});
    }
  }
  return pay;
}

/* 複数CORSプロキシ。1つ落ちても順に試す */
const PROXY_LIST=[ "proxy.php?url=", "https://corsproxy.io/?url=", "https://netkeiba-proxy.kajisho5.workers.dev/raw?url=", "https://api.codetabs.com/v1/proxy/?quest=" ];
let _proxyOK=null;
/* 本体アプリで設定したプロキシ(自前Worker等)をlocalStorage経由で共有 */
function userProxyPrefix(){ try{ const p=(localStorage.getItem("sw_proxy_prefix")||"").trim(); return /workers\.dev|\/raw\?url=/.test(p)?p:""; }catch(e){ return ""; } }
function innerFromProxied(u){
  // Base64版（proxy.php?u=...）を先に復元
  const m=/proxy\.php\?u=([A-Za-z0-9\-_]+)/.exec(u);
  if(m){ try{ return unb64url(m[1]); }catch(_){} }
  const up=userProxyPrefix();
  const prefixes = up ? [up, ...PROXY_LIST] : PROXY_LIST.slice();
  for(const p of prefixes){
    if(p && u.startsWith(p)){
      const rest=u.slice(p.length);
      if(p.endsWith("=")){ try{ return decodeURIComponent(rest); }catch(_){ return rest; } }
      return rest;
    }
  }
  return null;
}
function wrapProxy(prefix, inner){
  // 自前proxy.php は ?url=https://... の形だと お名前.comのWAFがSSRF攻撃と誤判定してブロックするため、
  // URLをBase64URLにして ?u= で渡す（proxy.php側は u= / url= の両対応）
  if(prefix.indexOf("proxy.php")>=0) return prefix.replace(/\?url=$/,"").replace(/\?u=$/,"")+"?u="+b64url(inner);
  return prefix.endsWith("=") ? prefix+encodeURIComponent(inner) : prefix+inner;
}
function looksValid(text){
  if(!text) return false;

  if(/error code: \d+/i.test(head)) return false;
  if(/<title>\s*Just a moment/i.test(head)) return false;
  const tr=text.trim();
  if(tr.startsWith("{")||tr.startsWith("[")) return tr.length>=2;
  return text.length>=200;
}
async function fetchDecoded(url){
  const inner=innerFromProxied(url);
  if(!inner){
    const res=await fetch(url,{headers:{Accept:"text/html,*/*"},cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    return decodeBytes(await res.arrayBuffer());
  }
  /* 遅れて出す回（late=1）は時間が限られる（自動投稿は7分で打ち切る）。朝と同じ条件にそろえる意味でも、結果とオッズは取りに行かない
     （朝8:30にはどちらもまだ無い）。取れない時に外の中継を順に回るのもやめる（1レースで数十秒かかる）。 */
  const _lateRun=(window.__LATE_NOW!=null);
  if(_lateRun && /\/race\/result\.html|api_get_(jra|nar)_odds|odds_get_form/.test(inner)) throw new Error("遅れて出す回は取らない");
  const order=[];
  const up=userProxyPrefix();
  if(up) order.push(up);
  if(_proxyOK && !order.includes(_proxyOK)) order.push(_proxyOK);
  for(const p of PROXY_LIST){ if(!order.includes(p)) order.push(p); }
  /* ★自動投稿の回（?auto=）は、自分のサイトの中継だけを使う（2026-11-21）★
     中央のオッズや結果が取れない時、外の中継を順に試して1件あたり最大20秒かかっていた。11/21 の朝は中央24レースでこれが積み重なり、
     7分の制限時間のうちに半分（12/24）までしか進まず、9:20・9:40 の出し直しが失敗した。外の中継はどれも通っていなかった（14回中14回失敗）。 */
  const _autoRun=/[?&]auto=/.test(location.search||"");
  if(_lateRun || _autoRun) order.length=1;
  let lastErr=null;
  for(const prefix of order){
    try{
      const headers={Accept:"text/html,*/*"};
      if(prefix.includes("r.jina.ai")) headers["X-Return-Format"]="html";
      /* cache:"no-store" 必須。レース結果は時間で変わるため、
         発走前に取得した「結果なし」HTMLがキャッシュされると、
         レース確定後に再取得しても古い空データが返り続ける（答え合わせが永久に「結果待ち」になる） */
      const res=await fetch(wrapProxy(prefix,inner),{headers,cache:"no-store"});
      if(!res.ok){ lastErr=new Error("HTTP "+res.status); continue; }
      const text=decodeBytes(await res.arrayBuffer());
      if(!looksValid(text)){ lastErr=new Error("空応答"); continue; }
      _proxyOK=prefix; return text;
    }catch(e){ lastErr=e; }
  }
  throw lastErr||new Error("全プロキシ失敗");
}
/* 文字コード自動判定: HTMLのcharset宣言→なければEUC-JP/UTF-8を試して日本語が多い方 */
function decodeBytes(buf){
  const bytes=new Uint8Array(buf);
  // 先頭2KBをlatin1で読んでcharset宣言を探す
  let head=""; for(let i=0;i<Math.min(2048,bytes.length);i++) head+=String.fromCharCode(bytes[i]);
  const m=head.match(/charset=["']?([\w-]+)/i);
  if(m){
    const cs=m[1].toLowerCase();
    try{
      if(/utf-?8/.test(cs)) return new TextDecoder("utf-8",{fatal:false}).decode(buf);
      if(/euc/.test(cs))    return new TextDecoder("euc-jp",{fatal:false}).decode(buf);
      if(/shift|sjis/.test(cs)) return new TextDecoder("shift_jis",{fatal:false}).decode(buf);
    }catch(_){}
  }
  // 宣言が無い/不明: 両方fatalで試して、例外が出ない方を採用。両方OKなら日本語が多い方
  const jpCount=(s)=>{ let n=0; for(let i=0;i<s.length;i++){ const c=s.charCodeAt(i); if((c>=0x3040&&c<=0x30ff)||(c>=0x4e00&&c<=0x9fff)) n++; } return n; };
  let euc=null, utf=null;
  try{ euc=new TextDecoder("euc-jp",{fatal:true}).decode(buf); }catch(_){}
  try{ utf=new TextDecoder("utf-8",{fatal:true}).decode(buf); }catch(_){}
  if(euc && utf) return jpCount(utf)>=jpCount(euc)? utf : euc;
  if(utf) return utf;
  if(euc) return euc;
  // どちらもfatalで失敗→非厳格でUTF-8（より一般的）
  return new TextDecoder("utf-8",{fatal:false}).decode(buf);
}

function logOddsSnapshot(rid, odds, post){

    if(!rid || !odds || !Object.keys(odds).length) return;
    const date=($("#date") && $("#date").value ? $("#date").value.trim() : "") || jstTodayStr();
    /* ★2026-07-30追加: 発走までの残り分数(mtp)と発走時刻(post)も記録する★
       これが無いと「7分前のオッズ vs 2分前のオッズ」に振り分けられない。
       実際、5ヶ月分の記録が貯まっていたのに ts(絶対時刻)しか無く、
       間隔も2時間差と5分差が混在していて**時系列検証に使えなかった**。
       同じ轍を踏まないよう、記録の時点で発走基準の相対時間を持たせる。 */
    let mtp=null;
    try{
      const pm=(typeof parsePostMin==="function")?parsePostMin(post):null;
      if(pm!=null && typeof jstNowMin==="function") mtp=pm-jstNowMin();
    }catch(_){}
    fetch("oddslog.php?action=save", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ rid:String(rid), mode:MODE, date, ts:Date.now(),
                             post:(post||null), mtp:mtp, odds })
    }).catch(()=>{});
  }catch(_){}
}
async function fetchWinOdds(rid, post){   /* postは発走時刻'HH:MM'。オッズ記録に残す残り分数の計算に使う */
  try{
    const txt=await fetchDecoded(oddsURL(rid));
    let j=null; try{ j=JSON.parse(txt); }catch(_){ return null; }
    const out={};
    if(j.ary_odds){ // NAR
      for(const k in j.ary_odds){ const e=j.ary_odds[k]; const num=String(parseInt(k,10));
        const od=parseFloat(e.Odds); const pop=e.Ninki!=null?+e.Ninki:null;
        // オッズ0.0は取消・オッズ未確定を表す（人気だけ便宜値が入る）。有効オッズ(1.0以上)のみ採用。
        if(isFinite(od) && od>=1.0) out[num]={odds:od, pop}; }
    } else if(j.data && j.data.odds && j.data.odds["1"]){ // JRA
      const d=j.data.odds["1"];
      for(const k in d){ const num=String(parseInt(k,10)); const arr=d[k];
        const od=parseFloat(arr[0]); const pop=arr[2]!=null?parseInt(arr[2],10):null;
        if(isFinite(od) && od>=1.0) out[num]={odds:od, pop}; }
    }
    if(Object.keys(out).length) logOddsSnapshot(rid, out, post);
    return Object.keys(out).length? out : null;
  }catch(_){ return null; }
}
/* 信頼度スコア(0-100): ◎(または○)が「予想で抜けてるか」×「人気でも支持されてるか」
   - scored: fundamentalScoreで降順ソート済み [{num,name,s}]
   - odds: fetchWinOdds結果 or null
   軸(◎)が1番人気付近かつスコア差が大きいほど高い。人気薄を推してる時は下がる。 */
/* ===== ◎複勝見込み（LTR較正・2026-07-30） =====
   スコアの抜け具合 c=0.6*gap+0.4*nextGap を、holdout(2023〜)の10分位×実測複勝率に
   写像する（backtest/calib_ltr.py → data/ltr_calib.json。オッズ不使用=事前条件）。
   ★表示専用★ 判定(狙い目/見送り)の閾値は従来のfirmnessのまま＝蓄積記録の意味を変えない。 */
/* ばんえい専用モデルの点数（backtest/build_banei_pred.py が毎朝作る。docs/FACTS.md 2026-11-14）。読めなければ null＝今までの手作りの点数で並べる */
let _BANEI_PRED_P=null;
function loadBaneiPred(){
  if(_BANEI_PRED_P) return _BANEI_PRED_P;
  _BANEI_PRED_P=fetch("data/banei_pred.json?_="+Date.now(),{cache:"no-store"})
    .then(r=>r.ok?r.json():null).then(j=>(j&&j.races)?j:null).catch(()=>null);
  return _BANEI_PRED_P;
}
let _LTR_CALIB=null, _LTR_CALIB_P=null;
function loadLtrCalib(){
  if(_LTR_CALIB_P) return _LTR_CALIB_P;
  _LTR_CALIB_P=fetch("data/ltr_calib.json",{cache:"no-cache"})
    .then(r=>r.ok?r.json():null).then(j=>{ _LTR_CALIB=j; return j; }).catch(()=>null);
  return _LTR_CALIB_P;
}
function ltrCalibProb(vals, topNum, key){
  const t=_LTR_CALIB && _LTR_CALIB[key || (MODE==="jra"?"jra":"nar")];
  if(!t || !t.edges || !t.p) return null;
  const nums=Object.keys(vals);
  if(nums.length<5) return null;
  const arr=nums.map(n=>vals[n]);
  const top=vals[topNum]; if(top==null) return null;
  const max=Math.max.apply(null,arr);
  if(top<max) return null;   // ◎がLTR最上位でない（当地補正等）→ 較正の前提外なので出さない
  const min=Math.min.apply(null,arr);
  const spread=(max-min)||1;
  const mean=arr.reduce((a,b)=>a+b,0)/arr.length;
  const second=Math.max.apply(null,arr.filter((_,i)=>nums[i]!==String(topNum)));
  const c=0.6*(top-mean)/spread + 0.4*(top-second)/spread;
  let b=0; while(b<t.edges.length && c>t.edges[b]) b++;
  return t.p[b]!=null? Math.round(t.p[b]) : null;
}
function firmness(scored, odds, markIdx){
  // markIdx: 0=◎, 1=○
  if(!scored || scored.length<2) return null;
  const me=scored[markIdx]; if(!me) return null;
  // 1) スコアの抜け具合: 自分のスコアが全体平均からどれだけ上か（0-1）
  const ss=scored.map(x=>x.s);
  const max=Math.max(...ss), min=Math.min(...ss), mean=ss.reduce((a,b)=>a+b,0)/ss.length;
  const spread=(max-min)||1;
  const gap=(me.s-mean)/spread; // だいたい 0〜1（上位ほど大）
  // 2) 次位との差（◎が○をどれだけ引き離すか）。markIdx=0のとき有効
  const nextGap = (markIdx+1<scored.length) ? (me.s-scored[markIdx+1].s)/spread : 0;
  // 3) 人気の裏付け: ◎の単勝人気。1番人気=満点、人気薄=減点
  let popScore=0.5; // オッズ無しは中立
  if(odds && odds[me.num] && odds[me.num].pop){
    const p=odds[me.num].pop;
    // 1人気=1.0, 2=0.82, 3=0.66, 4=0.52, 5=0.4, 6+=逓減
    popScore = p<=1?1.0 : p<=2?0.82 : p<=3?0.66 : p<=4?0.52 : p<=5?0.4 : Math.max(0.12, 0.4 - (p-5)*0.06);
  } else if(odds && odds[me.num] && odds[me.num].odds){
    // 人気が無くオッズだけある場合、オッズから簡易人気度
    const o=odds[me.num].odds;
    popScore = o<=2?1.0 : o<=3.5?0.8 : o<=6?0.6 : o<=10?0.45 : o<=20?0.3 : 0.15;
  }
  // 合成: 予想の抜け具合(gap, nextGap) と 人気裏付け(popScore) を重み付け
  // ◎は人気裏付けを重めに、○は予想スコア寄りに
  const base = markIdx===0
    ? 0.34*clamp01(gap) + 0.22*clamp01(nextGap*1.5+0.2) + 0.44*popScore
    : 0.50*clamp01(gap) + 0.50*popScore;
  return Math.round(clamp01(base)*100);
}
function clamp01(v){ return Math.max(0, Math.min(1, v)); }

/* ★自動投稿（Cloudflareのヘッドレス）用フォント読み込み（2026-10-30）★
   クラウドのChromeには Saira Condensed / Space Mono / Noto Sans JP が入っておらず、
   画像の数字や見出しが代わりのフォントで描かれていた。描く前にWebフォントを読み込んで登録する。
   手元の画面（?auto 無し）では呼ばない＝今までと同じ見た目。 */
async function ensureAutoFonts(){
  if(window.__autoFontsDone) return;
  const B="/odds/fonts/";   // 自前で配信（OFL。ライセンス文も同じフォルダ）。外部CDNが落ちても崩れない
  const list=[
    ["Noto Sans JP", B+"NotoSansJP-VF.ttf", "100 900"],
    ["Saira Condensed", B+"SairaCondensed-SemiBold.ttf", "600"],
    ["Saira Condensed", B+"SairaCondensed-Bold.ttf", "700"],
    ["Saira Condensed", B+"SairaCondensed-ExtraBold.ttf", "800"],
    ["Space Mono", B+"SpaceMono-Regular.ttf", "400"],
    ["Space Mono", B+"SpaceMono-Bold.ttf", "700"],
  ];
  const res=await Promise.allSettled(list.map(async([fam,url,w])=>{
    const f=new FontFace(fam,`url(${url})`,{weight:w, display:"block"});
    await f.load(); document.fonts.add(f); return fam+" "+w;
  }));
  try{ await ensureFFonts(); }catch(_){}   // 投稿画像の数字の書体
  window.__autoFontsDone=true;
  window.__autoFonts=res.map(r=>r.status==="fulfilled"?r.value:("NG "+String(r.reason&&r.reason.message||r.reason)));
}

/* 荒れ指数 0-100。高いほど波乱含み。オッズ未確定なら頭数のみで簡易算出 */
function chaosIndex(odds, scored, marks, fieldN){
  let score=0;  const parts=[];
  // ① 頭数（多いほど紛れる）: 16頭=満点付近
  const fieldPt = Math.min(20, Math.max(0, (fieldN-7))*2.2);
  score += fieldPt;
  if(fieldN>=14) parts.push("多頭数");

  if(odds){
    // オッズ配列（人気順）
    const arr=Object.values(odds).filter(o=>o.odds>0).sort((a,b)=>a.odds-b.odds);
    if(arr.length>=3){
      // ② 1番人気が抜けてない（単勝が高い）: 1番人気3.0以下=堅い、5.0以上=割れ
      const fav=arr[0].odds;
      const favPt = fav<=2.0?0 : fav<=3.0?6 : fav<=4.5?16 : fav<=6?24 : 30;
      score += favPt;
      if(fav>=4.5) parts.push("抜けた本命なし");
      // ③ 上位人気が団子（1〜3番人気のオッズ差が小さい）
      const spread3 = (arr[2].odds-arr[0].odds);
      const congPt = spread3<=1.5?14 : spread3<=3?8 : spread3<=5?3 : 0;
      score += congPt;
      if(spread3<=1.5) parts.push("上位人気が団子");
      // ④ 人気薄まで売れてる（10番人気でも一定オッズ＝広く売れてる）
      if(arr.length>=10){
        const p10=arr[9].odds;
        if(p10<=50) { score+=8; parts.push("人気が割れている"); }
      }
    }
    // ⑤ 自分の◎が人気薄（穴を本命視）
    const O=marks.find(m=>m.mk==="◎");
    if(O && O.pop){
      if(O.pop>=8){ score+=18; parts.push("本命が大穴"); }
      else if(O.pop>=5){ score+=10; parts.push("本命が人気薄"); }
    }
  } else {
    parts.push("オッズ未確定");
  }
  score=Math.round(Math.min(100, score));
  return { score, parts, hasOdds:!!odds };
}
/* 印の人気・オッズから買い目の助言を生成。オッズ未確定なら null */
// NAR 場別 1番人気信頼度（人気キャリブBT 844R より。w=1番人気勝率% p=複勝率%）
const NAR_TRACK_REL = {
  "46":{w:56,p:81,lab:"堅い"}, "47":{w:56,p:73,lab:"堅い"}, "30":{w:52,p:77,lab:"堅い"}, "44":{w:51,p:83,lab:"堅い"},
  "55":{w:47,p:82,lab:"やや堅"}, "54":{w:46,p:74,lab:"やや堅"}, "45":{w:46,p:66,lab:"やや堅"}, "50":{w:45,p:77,lab:"やや堅"},
  "35":{w:44,p:71,lab:"標準"}, "65":{w:43,p:71,lab:"標準"},
  "48":{w:40,p:69,lab:"やや荒"}, "42":{w:33,p:72,lab:"荒れ"}, "36":{w:30,p:60,lab:"荒れ"}

function buildAdvice(marks, hasOdds, field, firmO, raceId){
  if(!hasOdds) return null;
  const O=marks.find(m=>m.mk==="◎"), Ma=marks.find(m=>m.mk==="○"), Sa=marks.find(m=>m.mk==="▲");
  if(!O) return null;
  const pop=(m)=> (m&&m.pop)? m.pop : 99;
  const oOdds = O.odds||null;
  const pO=pop(O), p1=pop(Ma), p2=pop(Sa);
  const tags=[];           // 注意書き（配当妙味）
  let buy=null;            // 買い目の助言

  // 上位人気が印に集中しているか（人気決着型）
  const top3pops=[pO,p1,p2].filter(p=>p<99);
  const allFav = top3pops.length>=2 && top3pops.every(p=>p<=4);
  const oFav = pO<=2 || (oOdds!=null && oOdds<=3.0);

  // ── 配当妙味の注意（要望2） ──
  if(allFav && oFav){
    tags.push("人気決着型・配当は安め");
  } else if(oFav){
    tags.push("本命人気・単勝の妙味薄");
  }
  // 印に人気薄が多い（波乱含み）
  const sukePops=marks.filter(m=>m.mk==="△"||m.mk==="▲").map(pop).filter(p=>p<99);
  const longshots=sukePops.filter(p=>p>=7).length;
  if(pO>=6) tags.push("本命が人気薄・一発妙味");
  else if(longshots>=2 && !oFav) tags.push("相手に人気薄・好配当の目");

  // ── 買い目の助言（要望6） ──
  if(allFav && oFav){
    // 人気サイドで堅い → 軸を絞る
    buy = "手堅く ◎→○▲ の馬連・馬単中心。3連系は点数を絞って";
  } else if(oFav && (p1>=5 || p2>=5)){
    // 本命堅い・相手に妙味 → 本命軸で相手広げる
    buy = "◎は信頼。相手に中穴 → ◎軸の3連複・馬単で配当を上乗せ";
  } else if(pO>=6){
    // 本命が人気薄 → 当たれば大きい
    buy = "◎が人気薄 → 当たれば高配当。複勝・ワイドで保険も";
  } else if(longshots>=2){
    // 波乱含み → 広く
    buy = "人気割れ・波乱含み → ◎の複勝を軸に三連複で手広く";
  } else {
    /* ★軸は◎1頭に絞る★ 「◎○を軸に」と書いていたが、実測と食い違っていた。
       17.5万レースで x-y-z を総当たりした結果（bt_xyz_grid.js）:
         馬連 ◎軸→▲△(x=1,y=4) 前半75.6% / 後半69.6%
         馬連 ◎○軸→▲△(x=2,y=5) 前半72.3% / 後半68.3%
       前半・後半とも◎軸が上（+3.4pt / +1.3pt）。
       代わりに的中率は54.9%→34.1%と落ちるので、そこは文面で断る。
       なお実際の買い目ロジック(core/personas.js BETSTYLE)は元から全部◎軸で、
       この一文だけが実装と食い違っていた。 */
    buy = "◎を軸に ○▲△ へ馬連・ワイド（軸を2頭に広げると回収率は下がる）";
  }
  // 少頭数×狙い目 → ◎複勝が妙味（OOS検証済: 中山東京101% / 札幌函館103%）
  if(field!=null && field<=10 && firmO!=null && firmO>=60){
    tags.push("少頭数×狙い目 → ◎複勝が妙味");
  }
  // NAR 場の荒れ度（1番人気信頼度・実データ）
  if(raceId){ var _tc=String(raceId).slice(4,6); var rel=NAR_TRACK_REL[_tc];
    if(rel){ tags.push("この場: 1番人気"+rel.lab+"（勝率"+rel.w+"%/複"+rel.p+"%）");
      // 券種提案（荒れ度 × 信頼度）
      if(rel.w<=40 && firmO!=null && firmO<45) buy="荒れ場×低信頼 → 手広く安く（◎絡み3連複フォメ or 見送り）";
      else if(rel.w<=40 && firmO!=null && firmO>=60) buy="荒れ場×狙い目 → ◎複勝を軸に中穴へワイド流し（配当妙味）";
      else if(rel.w>=50 && firmO!=null && firmO>=60) buy="堅い場×狙い目 → ◎単・◎複を厚く（本命堅い、手広くしない）";
      else if(rel.w>=50 && firmO!=null && firmO<45) buy="堅い場×低信頼 → 本命が飛びやすい状況、見送り寄り";
    }
  }
  return { tags, buy };
}

function _swModal(message, withCancel){
  return new Promise(res=>{
    const bd=document.createElement("div"); bd.className="sw-modal-bd";
    const cancel = withCancel ? '<button class="sw-modal-btn" data-v="0">キャンセル</button>' : '';
    bd.innerHTML=`<div class="sw-modal"><div class="sw-modal-msg"></div><div class="sw-modal-btns">${cancel}<button class="sw-modal-btn primary" data-v="1">OK</button></div></div>`;
    bd.querySelector(".sw-modal-msg").textContent=message;
    document.body.appendChild(bd);
    requestAnimationFrame(()=>bd.classList.add("show"));
    const done=(v)=>{ bd.classList.remove("show"); setTimeout(()=>bd.remove(),180); res(v); };
    bd.querySelectorAll(".sw-modal-btn").forEach(b=>b.onclick=()=>done(b.dataset.v==="1"));
    bd.addEventListener("click",e=>{ if(e.target===bd && withCancel) done(false); });
  });
}

function diffPredictions(prev, now){
  const pm={}; (prev.races||[]).forEach(r=>pm[r.no]=r);
  const out=[];
  (now.races||[]).forEach(r=>{
    const p=pm[r.no]; if(!p) return;
    const ps=stateOf(p), ns=stateOf(r);
    // ◎の変更
    const pO=(p.marks||[]).find(m=>m.mk==="◎"), nO=(r.marks||[]).find(m=>m.mk==="◎");
    const oChanged = pO&&nO && String(pO.num)!==String(nO.num);
    // 状態の変更
    const sChanged = ps!==ns;
    if(oChanged || sChanged){
      out.push({ no:r.no, name:r.name,
        oChanged, oFrom:pO?pO.num:null, oTo:nO?nO.num:null,
        sChanged, sFrom:ps, sTo:ns });
    }
  });
  return out;
}

   ユーザー「発走する直前とか結果出た後に見送りとか狙い目にするとかやめてね。不信感になるから」。
   ロックしていない場は、取り直すたびに全レースを今のオッズで採点し直していたため、
   発走後・確定後のレースまで信頼度(firmO)＝見送り判定が動いていた。
   発走時刻を過ぎたレースは、直前まで出していた予想（このセッションの最新、無ければサーバー保存分）を使う。
   場のロック（狙い目を確定）がある場はロックが優先。手動ボタン（狙い目に/見送りに等）は今まで通り効く。 */
const FREEZE_KEYS=["marks","ranked","firmO","firm1","oProb","hasOdds","field","chaos"];

function freezeStarted(res, date, tc, prev){

  const lk=loadLock(date,tc); if(lk && lk.firm && lk.firm[res.no]!=null) return res;   // ロックが優先
  const p=prev.races.find(x=>x && x.no===res.no);

  FREEZE_KEYS.forEach(k=>{ if(p[k]!==undefined && p[k]!==null) out[k]=p[k]; });

function fetchTrackWeather(tc, date){
  const geo=TRACK_GEO[tc]; if(!geo) return Promise.resolve(null);
  const key=tc+"."+date;
  if(_WX_CACHE[key]) return _WX_CACHE[key];
  /* Open-Meteo: 無料・キー不要・CORS可。past_days=1で前日実績、forecast_days=3で
     明日の予想（前夜に取る）もカバー。プロキシ不要（netkeibaではないのでWAF無関係） */
  const url="https://api.open-meteo.com/v1/forecast?latitude="+geo[0]+"&longitude="+geo[1]
    +"&hourly=precipitation,weather_code,temperature_2m&daily=precipitation_sum"
    +"&past_days=1&forecast_days=3&timezone=Asia%2FTokyo";
  /* 失敗したら少し待ってもう2回まで取り直す（2026-11-13。1回の失敗でその場の天気が全部出なくなっていた） */
  const _get=async function(){
    for(let i=0;i<3;i++){
      try{ const r=await fetch(url); if(r.ok){ const j=await r.json(); if(j) return j; } }catch(_){}
      if(i<2) await new Promise(function(res){ setTimeout(res, 700*(i+1)); });
    }
    return null;
  };
  _WX_CACHE[key]=_get();
  return _WX_CACHE[key];
}

/* 場ブロックに天気行を差し込む。blockEl=null なら #out 先頭（単一場フロー用） */
async function attachTrackWeather(tc, blockEl, date, races){
  try{
    const wx=await fetchTrackWeather(tc, date);
    if(!wx||!wx.hourly||!wx.hourly.time) return;
    const iso=date.slice(0,4)+"-"+date.slice(4,6)+"-"+date.slice(6,8);
    const pd=new Date(+date.slice(0,4), +date.slice(4,6)-1, +date.slice(6,8)-1);
    const prevIso=pd.getFullYear()+"-"+String(pd.getMonth()+1).padStart(2,"0")+"-"+String(pd.getDate()).padStart(2,"0");
    // 前日の降水量（実績 or 予報）
    let prevSum=null;
    if(wx.daily&&wx.daily.time){
      const di=wx.daily.time.indexOf(prevIso);
      if(di>=0) prevSum=wx.daily.precipitation_sum[di];
    }
    // 当日の時間別（発走枠: 最初の発走1時間前〜最終発走）
    const posts=(races||[]).map(r=>{const m=/^(\d{1,2}):(\d{2})$/.exec(String(r.post||"").trim());return m?+m[1]:null;}).filter(h=>h!=null);
    const h0=posts.length?Math.max(6,Math.min.apply(null,posts)-1):9;
    const h1=posts.length?Math.min(22,Math.max.apply(null,posts)):17;
    const hours=[];
    let dayCum=0, rainHours=0;
    const hmap={};   // 時間→{code,temp}（共有画像の発走時刻天気に使う）
    for(let i=0;i<wx.hourly.time.length;i++){
      const t=wx.hourly.time[i];
      if(t.slice(0,10)!==iso) continue;
      const h=+t.slice(11,13);
      const mm=wx.hourly.precipitation[i];
      const code=(wx.hourly.weather_code||[])[i];
      const temp=(wx.hourly.temperature_2m||[])[i];
      hmap[h]={code, temp:(temp==null?null:temp)};
      if(h<=h1 && mm!=null) dayCum+=mm;   // 発走枠の終わりまでの当日累積
      if(h>=h0 && h<=h1){
        hours.push({h, mm:(mm==null?0:mm), code});
        if(mm>=0.3) rainHours++;
      }
    }
    _WX_HOURLY[tc]=hmap;
    if(!hours.length) return;
    // 時間帯ストリップ（雨の時間は mm/h を明記）
    const strip=hours.map(x=>{
      const e=_wxEmoji(x.code);
      return x.mm>=0.3? `${x.h}時${e}${x.mm.toFixed(x.mm<10?1:0)}` : `${x.h}時${e}`;
    }).join(" ");
    const cum=(prevSum!=null?prevSum:0)+dayCum;
    let line2=`前日${prevSum!=null?prevSum.toFixed(1):"?"}mm＋当日${dayCum.toFixed(1)}mm＝累積<b>${cum.toFixed(1)}mm</b>`;
    /* 馬場見込み（実測較正・223,737R）。区分は水の効き方が違うので3つ:
       narD=地方ダート / jraD=中央ダート / jraT=中央芝（芝は渋りにくい）。
       中央は同日に芝とダートが混在するので、その場のレース構成で優勢な方を選ぶ。 */
    /* 保存用に区分と見込みを外に出しておく（表示だけで消さない） */
    let _wxSeg="narD", _wxExp=null;
    {
      const gbr=await loadGoingByRain();
      let segLabel="";
      if(MODE==="jra"){
        const nT=(races||[]).filter(r=>/芝/.test(String(r.surface||r.name||""))).length;
        const nD=(races||[]).length-nT;
        _wxSeg=(nT>nD)?"jraT":"jraD";
        segLabel=(_wxSeg==="jraT")?"芝":"ダ";
      }
      const seg=gbr&&gbr.seg&&gbr.seg[_wxSeg];
      if(seg){
        const bin=cum<0.5?"0":cum<3?"1-3":cum<10?"3-10":cum<25?"10-25":"25+";
        const e=seg[bin];
        if(e&&e.p){
          const shibu=Math.round(10*(100-e.p["良"]))/10;
          _wxExp={ bin:bin, shibu:shibu, p:e.p, n:e.n };
          line2+=` ｜ 馬場見込み${segLabel?"("+segLabel+")":""}: <b>${shibu>=50?"渋る":"良寄り"}</b>（同降水量帯の実測: 良${e.p["良"]}% 稍${e.p["稍"]}% 重${e.p["重"]}% 不${e.p["不"]}% / ${e.n.toLocaleString()}R）`;
        }
      }
    }
    /* ★予想と一緒にサーバーへ残す★ 当日の実馬場と突き合わせて
       「降水量→馬場見込み」の較正が当たっていたか後から検証するため。
       表示用の文字列ではなく数値で持つ（文字列だと集計できない）。 */
    try{
      _WX_SAVE[tc]={ prev:(prevSum!=null?+prevSum.toFixed(1):null),
                     day:+dayCum.toFixed(1), cum:+cum.toFixed(1),
                     rainHours:rainHours, seg:_wxSeg, exp:_wxExp };
    }catch(_){}
    const div=document.createElement("div");
    div.className="tb-wx";
    div.innerHTML=`<span class="wx-strip">${strip}</span><br>${line2}`;
    if(blockEl){
      const h=blockEl.querySelector(".track-block-h");
      if(h) h.insertAdjacentElement("afterend", div); else blockEl.insertBefore(div, blockEl.firstChild);
    }else{
      const out=$("#out"); if(out) out.insertBefore(div, out.firstChild);
    }
  }catch(_){}
}

async function buildLinePlan(){
