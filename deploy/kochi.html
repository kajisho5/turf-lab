function _swModal(message, withCancel){
  return new Promise(res=>{
    const bd=document.createElement("div"); bd.className="sw-modal-bd";

    const done=(v)=>{ bd.classList.remove("show"); setTimeout(()=>bd.remove(),180); res(v); };

    bd.addEventListener("click",e=>{ if(e.target===bd && withCancel) done(false); });
  });
}

function b64url(s){
  const bytes=new TextEncoder().encode(s);
  let bin=""; bytes.forEach(b=>bin+=String.fromCharCode(b));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}

/* tweet.html からの依存抽出漏れ（v356時点で欠落。fetchDecodedが呼ぶのに未定義だった） */
function looksValid(text){
  if(!text) return false;
  const head=text.slice(0,200);
  if(/error code: \d+/i.test(head)) return false;
  if(/<title>\s*Just a moment/i.test(head)) return false;
  const tr=text.trim();
  if(tr.startsWith("{")||tr.startsWith("[")) return tr.length>=2;
  return text.length>=200;
}


/* --- resolve_deps.py が tweet.html から補完した依存関数 --- */
function parsePastRace(cellHtml){
  const get=(cls)=>{ const m=cellHtml.match(new RegExp('class="'+cls+'"[^>]*>([\\s\\S]*?)</div>')); return m?m[1].replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ").replace(/\s+/g," ").trim():""; };
  const rid=(cellHtml.match(/\/race\/(\d{12})/)||[])[1]||null;
  const d01=get("Data01");    // タグ除去後 "2026.05.20 門別 11" など（日付・場・着順）
  // 着順の取得。netkeiba は着順1〜3着を色分けするため、class="Num" 以外の要素で
  // 出すことがある（class="Num" だけを見ると1〜3着が丸ごと消える＝報告のあった不具合）。
  // そこで「Numクラス」に依存せず、タグ除去済み Data01 の末尾トークンから着順を取る。
  //   例 "2026.05.20 門別 3" → 3着 /  "2026.01.19 名古屋 1" → 1着
  // 取消・除外・中止は数字にならないので null。数字が無ければ Num系クラスからも試す（保険）。
  let rank=null;
  const parts=d01.split(/\s+/).filter(Boolean);
  const lastTok=parts.length?parts[parts.length-1]:"";
  if(/^\d{1,2}$/.test(lastTok)){
    rank=+lastTok;                 // Data01末尾が着順（"… 門別 3"）
  } else {
    // Data01末尾が数字でない（着順が別要素/別セルにある構造）→ セル全体から着順要素を探す。
    // class名に依存しないよう、Data01直後〜Data02手前の最初の 1〜2桁数字spanを着順とみなす。
    const seg = cellHtml.match(/class="Data01"[\s\S]*?(?=class="Data0[2-9]"|$)/);
    const rm = (seg?seg[0]:cellHtml).match(/>\s*(\d{1,2})\s*<\/(?:span|div)>/);
    if(rm) rank=+rm[1];
    else { const nm=cellHtml.match(/class="[^"]*\bNum\b[^"]*"[^>]*>\s*(\d{1,2})\s*</); if(nm) rank=+nm[1]; }
  }
  const d05=get("Data05");                                   // "ダ2400 2:36.0 良"
  const d03=get("Data03");                                   // "12頭 10番 6人 騎手 56.0"
  const d06=get("Data06");                                   // "6-6-7-8 (38.7) 484(-16)"
  const surf=(d05.match(/(芝|ダ)/)||[])[1]||null;
  const dist=+((d05.match(/[芝ダ](\d{3,4})/)||[])[1]||0)||null;
  // 馬場状態。地方(nar)は「稍」「不」の1文字略記で出ることがあるため、2文字表記も1文字も拾う。
  //   良 / 稍(重) / 重 / 不(良)  → 正規化して 良・稍重・重・不良 に統一。
  //   ※順序に注意: 「稍重」「不良」を先に試し、無ければ1文字略記を拾う。
  let going=null;
  const gm=(d05||"").match(/稍重|不良|良|稍|不|重/);
  if(gm){ const g=gm[0]; going = g==="稍"?"稍重" : g==="不"?"不良" : g; }
  const fieldN=+((d03.match(/(\d{1,2})頭/)||[])[1]||0)||null;
  const pop=+((d03.match(/(\d{1,2})人/)||[])[1]||0)||null;
  // 騎手: Data03 = "頭数 馬番 人気 騎手名 斤量"。人気と斤量の間が騎手
  let jockey=null;
  const jm=d03.match(/\d{1,2}人\s*([^\d\s][^\d]*?)\s*\d{2}\.\d/);
  if(jm) jockey=jm[1].trim().replace(/\s+/g,"");
  const passing=(d06.match(/([\d]+(?:-[\d]+){1,3})/)||[])[1]||null;   // 通過順
  const last3f=+((d06.match(/\((\d{2}\.\d)\)/)||[])[1]||0)||null;
  // 馬体重(増減): "480(+4)" "456(-2)" "470(0)"
  const wm=d06.match(/(\d{3})\(\s*([+-]?\d+)\s*\)/);
  const weight = wm? +wm[1] : null;
  const wdiff = wm? +wm[2] : null;
  // 走破タイム "2:36.0" → 秒
  const tm=d05.match(/(\d+):(\d{2}(?:\.\d)?)/);
  const time = tm? (+tm[1]*60 + parseFloat(tm[2])) : null;
  const turn=rid?turnOfRid(rid):null;
  // レース日付（Data01先頭 "2026.04.12"）→ YYYYMMDD
  let rdate=null;
  const dm=d01.match(/(\d{4})\.(\d{1,2})\.(\d{1,2})/);
  if(dm) rdate = dm[1]+String(dm[2]).padStart(2,"0")+String(dm[3]).padStart(2,"0");
  // 脚質: 通過順の最初のコーナー位置/頭数で判定
  let style=null;
  if(passing&&fieldN){ const first=+passing.split("-")[0]; const r=first/fieldN;
    style = r<=0.20?"逃":(r<=0.45?"先":(r<=0.75?"差":"追")); }
  const d02=(cellHtml.match(/class="Data02"[^>]*>([\s\S]*?)<\/div>/)||[])[1]||"";
  const d02name=(d02.match(/>\s*([^<>\n]+?)\s*</)||d02.match(/([^<>\n]+)/)||[])[1]||"";
  const clv=classLevelFromBlock(d02, d02name);
  return {rid, rank, surf, dist, going, time, fieldN, pop, passing, last3f, turn, style, jockey, weight, wdiff, jump:/障/.test(d05||""), clv, rdate,
          track: rid?trackNameOfRid(rid):null};
}

function classLevelFromBlock(data02html, name){
  const g=(data02html||"").match(/Icon_GradeType(\d)/);
  if(g){ const v=+g[1]; if(v===1)return 10; if(v===2)return 9; if(v===3)return 8; }
  if(/Jpn\s*Ⅰ|JpnⅠ|Jpn1/.test(data02html||"")) return 10;
  if(/Jpn\s*Ⅱ|JpnⅡ|Jpn2/.test(data02html||"")) return 9;
  if(/Jpn\s*Ⅲ|JpnⅢ|Jpn3/.test(data02html||"")) return 8;
  return classLevelName(name);
}

function classLevelName(name){
  if(!name) return null;

  if(/オープン|ＯＰ|\(L\)|（Ｌ）|リステッド/.test(n)) return 7;
  if(/3勝|３勝|1600万/.test(n)) return 6;
  if(/2勝|２勝|1000万/.test(n)) return 5;
  if(/1勝|１勝|500万/.test(n)) return 4;

function decodeBytes(buf){
  const bytes=new Uint8Array(buf);
  // 先頭2KBをlatin1で読んでcharset宣言を探す
  let head=""; for(let i=0;i<Math.min(2048,bytes.length);i++) head+=String.fromCharCode(bytes[i]);
  const m=head.match(/charset=["']?([\w-]+)/i);
  if(m){
    const cs=m[1].toLowerCase();
    try{
      if(/utf-?8/.test(cs)) return new TextDecoder("utf-8",{fatal:false}).decode(buf);
      if(/euc/.test(cs))    return new TextDecoder("euc-jp",{fatal:false}).decode(buf);
      if(/shift|sjis/.test(cs)) return new TextDecoder("shift_jis",{fatal:false}).decode(buf);
    }catch(_){}
  }
  // 宣言が無い/不明: 両方fatalで試して、例外が出ない方を採用。両方OKなら日本語が多い方
  const jpCount=(s)=>{ let n=0; for(let i=0;i<s.length;i++){ const c=s.charCodeAt(i); if((c>=0x3040&&c<=0x30ff)||(c>=0x4e00&&c<=0x9fff)) n++; } return n; };
  let euc=null, utf=null;
  try{ euc=new TextDecoder("euc-jp",{fatal:true}).decode(buf); }catch(_){}
  try{ utf=new TextDecoder("utf-8",{fatal:true}).decode(buf); }catch(_){}
  if(euc && utf) return jpCount(utf)>=jpCount(euc)? utf : euc;
  if(utf) return utf;
  if(euc) return euc;
  // どちらもfatalで失敗→非厳格でUTF-8（より一般的）
  return new TextDecoder("utf-8",{fatal:false}).decode(buf);
}

function decodeHtmlEntities(s){
  if(s==null) return s;
  return String(s)
    .replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">")
    .replace(/&quot;/g,'"').replace(/&#0?39;/g,"'").replace(/&apos;/g,"'")
    .replace(/&nbsp;/g," ")
    .replace(/&#(\d+);/g,(m,n)=>String.fromCharCode(+n))
    .replace(/&#x([0-9a-fA-F]+);/g,(m,n)=>String.fromCharCode(parseInt(n,16)));
}

function drawKochiCurveImage(){
  const d=KOCHI_CURVE; const bals=d.bals;

  const C={bg1:"#0a0e16",bg2:"#121826",card:"#171c27",line:"#333333",txt:"#ffffff",
           muted:"#b3b3b3",sub:"#cccccc",green:"#51b883",gold:"#ffd43d",red:"#ff7171",blue:"#57b8ff"};
  const W=1200, H=675;  // 16:9

  const x=cv.getContext("2d");
  const bgg=x.createLinearGradient(0,0,0,H); bgg.addColorStop(0,C.bg1); bgg.addColorStop(1,C.bg2);
  x.fillStyle=bgg; x.fillRect(0,0,W,H);
  const RR=(px,py,pw,ph,r)=>{x.beginPath();x.moveTo(px+r,py);x.arcTo(px+pw,py,px+pw,py+ph,r);x.arcTo(px+pw,py+ph,px,py+ph,r);x.arcTo(px,py+ph,px,py,r);x.arcTo(px,py,px+pw,py,r);x.closePath();};

  // ===== ヘッダ =====
  const padX=56;
  x.fillStyle=C.gold; RR(padX,44,6,52,3); x.fill();
  x.fillStyle=C.txt; x.font="700 36px 'Noto Sans JP',sans-serif"; x.textBaseline="alphabetic";

  // ===== グラフ領域（左右に余白確保・Y軸ラベル用の左マージン） =====
  const gL=padX+70, gR=W-padX, gT=150, gB=H-160;
  const gw=gR-gL, gh=gB-gT;
  const mn=Math.min(...bals,0), mx=Math.max(...bals,0);
  const range=(mx-mn)||1;
  const yOf=v=> gT+gh - (v-mn)/range*gh;
  const xOf=i=> gL + i/(bals.length-1)*gw;

  // 横グリッド（4分割）＋Y軸ラベル（万円・左に配置）
  x.font="500 18px 'Noto Sans JP',sans-serif"; x.textAlign="right";
  for(let k=0;k<=4;k++){
    const v=mn+range*k/4; const gy=yOf(v);
    x.strokeStyle=C.line; x.globalAlpha=(k===0||k===4)?0.6:0.3; x.lineWidth=1;
    x.beginPath(); x.moveTo(gL,gy); x.lineTo(gR,gy); x.stroke(); x.globalAlpha=1;
    x.fillStyle=C.muted;
    x.fillText(`${v>=0?"+":""}${(v/10000).toFixed(0)}万`, gL-14, gy+6);
  }
  x.textAlign="left";
  // ゼロライン強調
  const zy=yOf(0);
  x.strokeStyle=C.muted; x.globalAlpha=0.5; x.lineWidth=1.5; x.setLineDash([6,4]);
  x.beginPath(); x.moveTo(gL,zy); x.lineTo(gR,zy); x.stroke(); x.setLineDash([]); x.globalAlpha=1;

  // 収支エリア塗り（ゼロ基準・上下グラデ）
  x.beginPath();
  bals.forEach((v,i)=>{ const px=xOf(i),py=yOf(v); if(i===0)x.moveTo(px,py); else x.lineTo(px,py); });
  x.lineTo(xOf(bals.length-1),zy); x.lineTo(xOf(0),zy); x.closePath();
  const fillG=x.createLinearGradient(0,gT,0,gB);
  fillG.addColorStop(0,"rgba(81,184,131,0.28)"); fillG.addColorStop(1,"rgba(81,184,131,0.02)");
  x.fillStyle=fillG; x.fill();

  // 収支ライン（金・太め・角丸ジョイン）
  x.beginPath();
  bals.forEach((v,i)=>{ const px=xOf(i),py=yOf(v); if(i===0)x.moveTo(px,py); else x.lineTo(px,py); });
  x.strokeStyle=C.gold; x.lineWidth=3; x.lineJoin="round"; x.lineCap="round"; x.stroke();

  // 最終点に丸ドット＋現在値ラベル
  const lastX=xOf(bals.length-1), lastY=yOf(bals[bals.length-1]);
  x.fillStyle=C.gold; x.beginPath(); x.arc(lastX,lastY,7,0,7); x.fill();
  x.fillStyle=C.bg1; x.beginPath(); x.arc(lastX,lastY,3,0,7); x.fill();

  // ピーク/最大DDの注記（控えめ）
  const peakI=bals.indexOf(mx);
  x.fillStyle=C.green; x.font="700 18px 'Noto Sans JP',sans-serif"; x.textAlign="center";
  x.fillText(`最高 +${(mx/10000).toFixed(0)}万`, Math.min(gR-70,Math.max(gL+70,xOf(peakI))), yOf(mx)-16);
  x.textAlign="left";

  // ===== 下部：統計カード（4枚・elevation風） =====
  const cardY=H-118, cardH=76, gap=16;
  const cardW=(W-padX*2-gap*3)/4;

    ["1回の掛け金","4,000円",C.sub,"⭐2頭・40点"],

    ["回収率(ROI)",`${d.roi}%`,C.gold,"638戦・全期間"],

  ];
  cards.forEach((c,i)=>{
    const cx=padX+i*(cardW+gap);
    // 影
    x.save(); x.shadowColor="rgba(0,0,0,0.3)"; x.shadowBlur=12; x.shadowOffsetY=3;
    x.fillStyle=C.card; RR(cx,cardY,cardW,cardH,16); x.fill(); x.restore();
    x.strokeStyle=C.line; x.lineWidth=1; RR(cx,cardY,cardW,cardH,16); x.stroke();
    x.fillStyle=C.muted; x.font="500 16px 'Noto Sans JP',sans-serif"; x.fillText(c[0], cx+18, cardY+26);
    x.fillStyle=c[2]; x.font="700 32px 'Noto Sans JP',sans-serif"; x.fillText(c[1], cx+18, cardY+58);
    if(c[3]){ x.fillStyle=C.muted; x.font="500 14px 'Noto Sans JP',sans-serif"; x.textAlign="right"; x.fillText(c[3], cx+cardW-16, cardY+26); x.textAlign="left"; }
  });

  // ===== フッター =====
  x.fillStyle=C.muted; x.font="500 16px 'Noto Sans JP',sans-serif";
  x.fillText("SW TURF LAB", padX, H-20);
  x.textAlign="right"; x.fillText("※過去成績であり将来の的中・回収を保証するものではありません", W-padX, H-20); x.textAlign="left";
  x.fillStyle=C.gold; x.fillRect(0,H-5,W,5);
  return cv;
}

      x.fillStyle="#ffffff"; x.font="700 18px 'Noto Sans JP',sans-serif"; x.fillText(combo.length>52?combo.slice(0,50)+"…":combo, pad+22, oy+22);
      oy+=40;
    });
    y+=oBoxH+20;
  }
  // フッター注記
  x.fillStyle=C.muted; x.font="500 16px 'Noto Sans JP',sans-serif";
  x.fillText("※1,166Rのpayback実測。過去成績で未来を保証するものではありません。", pad, y+10);
  x.fillStyle=C.purp; x.font="700 16px 'Noto Sans JP',sans-serif";
  x.fillText("#SWTURFLAB #高知競馬", pad, y+40);
  // 実際に使った高さでトリミングしたキャンバスを返す
  const finalH=Math.min(H, y+66);
  const out=document.createElement("canvas"); out.width=W; out.height=finalH;
  out.getContext("2d").drawImage(cv,0,0);
  return out;
}

function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function fetchDecoded(url){
  const inner=innerFromProxied(url);
  if(!inner){
    const res=await fetch(url,{headers:{Accept:"text/html,*/*"},cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    return decodeBytes(await res.arrayBuffer());
  }
  const order=[];
  const up=userProxyPrefix();
  if(up) order.push(up);
  if(_proxyOK && !order.includes(_proxyOK)) order.push(_proxyOK);
  for(const p of PROXY_LIST){ if(!order.includes(p)) order.push(p); }
  let lastErr=null;
  for(const prefix of order){
    try{
      const headers={Accept:"text/html,*/*"};
      if(prefix.includes("r.jina.ai")) headers["X-Return-Format"]="html";
      /* cache:"no-store" 必須。レース結果は時間で変わるため、
         発走前に取得した「結果なし」HTMLがキャッシュされると、
         レース確定後に再取得しても古い空データが返り続ける（答え合わせが永久に「結果待ち」になる） */
      const res=await fetch(wrapProxy(prefix,inner),{headers,cache:"no-store"});
      if(!res.ok){ lastErr=new Error("HTTP "+res.status); continue; }
      const text=decodeBytes(await res.arrayBuffer());
      if(!looksValid(text)){ lastErr=new Error("空応答"); continue; }
      _proxyOK=prefix; return text;
    }catch(e){ lastErr=e; }
  }
  throw lastErr||new Error("全プロキシ失敗");
}

async function fetchWinOdds(rid){
  try{

    let j=null; try{ j=JSON.parse(txt); }catch(_){ return null; }
    const out={};
    if(j.ary_odds){ // NAR
      for(const k in j.ary_odds){ const e=j.ary_odds[k]; const num=String(parseInt(k,10));
        const od=parseFloat(e.Odds); const pop=e.Ninki!=null?+e.Ninki:null;
        // オッズ0.0は取消・オッズ未確定を表す（人気だけ便宜値が入る）。有効オッズ(1.0以上)のみ採用。
        if(isFinite(od) && od>=1.0) out[num]={odds:od, pop}; }
    } else if(j.data && j.data.odds && j.data.odds["1"]){ // JRA
      const d=j.data.odds["1"];
      for(const k in d){ const num=String(parseInt(k,10)); const arr=d[k];

        if(isFinite(od) && od>=1.0) out[num]={odds:od, pop}; }

function innerFromProxied(u){
  // Base64版（proxy.php?u=...）を先に復元
  const m=/proxy\.php\?u=([A-Za-z0-9\-_]+)/.exec(u);
  if(m){ try{ return unb64url(m[1]); }catch(_){} }
  const up=userProxyPrefix();
  const prefixes = up ? [up, ...PROXY_LIST] : PROXY_LIST.slice();
  for(const p of prefixes){
    if(p && u.startsWith(p)){
      const rest=u.slice(p.length);
      if(p.endsWith("=")){ try{ return decodeURIComponent(rest); }catch(_){ return rest; } }
      return rest;
    }
  }
  return null;
}

function parseRaceListHTML(html){
  const out=[], seen=new Set();
  // race_id の全出現を順に拾う（shutuba/result/odds いずれのリンクでも可）
  const re=/race_id=(\d{12})/g; let m;
  while((m=re.exec(html))){
    const rid=m[1]; if(seen.has(rid)) continue; seen.add(rid);
    const win=html.slice(m.index, m.index+900);
    const tm=win.match(/(\d{1,2}:\d{2})/);
    const nm=win.match(/Item(?:Title|Long)"?[^>]*>\s*([^<\n]{1,40}?)\s*</i);
    // グレード: JRA=Icon_GradeType{1|2|3}。NAR=名前内の(JpnⅠ/Ⅱ/Ⅲ)や重賞表記、主要重賞名で判定
    const gm=win.match(/Icon_GradeType(\d+)/);
    let grade=null; if(gm){ const g=+gm[1]; if(g===1)grade="G1"; else if(g===2)grade="G2"; else if(g===3)grade="G3"; }
    const rawName = nm?decodeHtmlEntities(nm[1].trim()):"";
    if(!grade){
      // NAR: Jpn表記
      if(/Jpn\s*[Ⅰ1]|\(GⅠ\)|\(G1\)/.test(win)||/Jpn\s*[Ⅰ1]/.test(rawName)) grade="JpnⅠ";
      else if(/Jpn\s*[Ⅱ2]/.test(win)||/Jpn\s*[Ⅱ2]/.test(rawName)) grade="JpnⅡ";
      else if(/Jpn\s*[Ⅲ3]/.test(win)||/Jpn\s*[Ⅲ3]/.test(rawName)) grade="JpnⅢ";
      else if(/重賞/.test(win)) grade="重賞";
      else if(NAR_JUSHO.some(name=>rawName.includes(name))) grade="重賞";
    }
    out.push({race_id:rid, track:trackOf(rid), no:parseInt(rid.slice(10),10), post:tm?tm[1]:null, name:rawName, grade});
  }
  return out.sort((a,b)=> a.track===b.track ? a.no-b.no : 0);
}

function parseShutuba(html){
  const entries={}; const order=[]; const scratched=[];
  // 馬柱は各馬が大きな行。/horse/ を含む tr を1頭として扱う
  let rows=html.match(/<tr[^>]*class="[^"]*HorseList[^"]*"[\s\S]*?<\/tr>/g);
  if(!rows||!rows.length){ rows=(html.match(/<tr[\s\S]*?<\/tr>/g)||[]).filter(t=>/\/horse\/[A-Za-z]?\d+/.test(t)); }
  rows.forEach(r=>{
    // 馬柱: 枠=<td class="WakuN">N</td>, 馬番=<td class="Waku">M</td>（数字サフィックス無し）
    const w=r.match(/class="Waku(\d)"/);
    let u=r.match(/class="Waku"[^>]*>\s*(\d{1,2})\s*</);   // 馬番（馬柱の正式位置）
    if(!u) u=r.match(/class="[^"]*Umaban[^"]*"[^>]*>\s*(\d{1,2})/) || r.match(/<td[^>]*class="[^"]*Txt_C[^"]*"[^>]*>\s*(\d{1,2})\s*</);
    // 馬名は Horse_Info セル内の馬名リンク（Horse02）から取る。近走の相手馬リンクを拾わないよう限定
    const info=r.match(/class="Horse_Info"[\s\S]*?(?=<td|<\/tr>)/);
    let n=null;
    if(info){ n=info[0].match(/\/horse\/([A-Za-z]?\d+)\/?"[^>]*>\s*(?:<[^>]+>\s*)*([^<]{1,30}?)\s*</); }
    if(!n) n=r.match(/\/horse\/([A-Za-z]?\d+)[^"]*"[^>]*title="([^"]{1,30})"/); // titleフォールバック
    if(!n) n=r.match(/\/horse\/([A-Za-z]?\d+)[^"]*"[^>]*>\s*([^<]{1,30}?)\s*</);
    if(!u||!n) return;
    const num=String(parseInt(u[1],10)), name=n[2].trim(), hid=n[1];
    // 出走取消・競走除外: entriesに入れず scratched へ退避（採点・印・買い目から完全除外）。過去走セルは判定前に除去
    const _rCur=r.replace(/<td[^>]*class="[^"]*\bPast\b[^"]*"[\s\S]*?<\/td>/g,"");
    if(/class="[^"]*Cancel[^"]*"/.test(_rCur) || /取消|除外/.test(_rCur.replace(/<[^>]+>/g," "))){ scratched.push({num, name, waku:(w?+w[1]:null)}); return; }
    if(entries[num]) return;
    let jockey="", jockeyId=null;
    const jm=r.match(/\/jockey\/(?:result\/recent\/)?([A-Za-z0-9]{4,7})\/?[^"]*"[^>]*>\s*([^<]{1,16}?)\s*</);
    if(jm){ jockeyId=jm[1]; jockey=jm[2].trim(); }
    // 斤量
    let kinryo=null; const kin=r.match(/\b(\d{2}\.\d)\b/g);
    if(kin){ for(const k of kin){ const v=+k; if(v>=48&&v<=63){ kinryo=v; break; } } }
    // 今走の馬体重(増減): class="Weight" セル内 "482(-4)"（当日発表後のみ。未発表は空）
    let weight=null, wdiff=null;
    // 所属アイコン: Icon_kakuChi=カク地(地方所属馬が交流競走に出走)。
    //   ※地方主催レースでは地元所属馬にアイコンが付かないため、「アイコン無し=JRA」とは
    //     断定できない。交流戦の判定にはレース名を使う（betPlan/raceFocus参照）。
    //     ここでは参考情報として、カク地マークの有無だけ記録する。
    let belong=null;
    if(/Icon_MaruChi/.test(r)) belong="地";          // JRA: 地方所属馬(マル地)
    else if(/Icon_MaruGai/.test(r)) belong="外";     // JRA: 外国馬(マル外)
    else if(/Icon_kaku[A-Za-z]*Gai/.test(r)) belong="外";  // カク外
    else if(/Icon_HorseMark\s+Icon_kaku[A-Za-z]*Chi/.test(r)) belong="カク地";
    const wcell=r.match(/class="Weight"[^>]*>([\s\S]*?)<\/td>/);
    if(wcell){ const wt=wcell[1].replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ");
      const wm=wt.match(/(\d{3})\s*\(\s*([+-]?\d+)\s*\)/);
      if(wm){ weight=+wm[1]; wdiff=+wm[2]; }
      else { const wo=wt.match(/\b(\d{3})\b/); if(wo) weight=+wo[1]; }  // 増減無し(新馬等)
    }
    // 近走（Past セル）を最大5走パース。
    // netkeiba は着順1〜3着の走に class="Past Ranking_1/2/3"（色分け）を付ける。
    // 旧 /class="Past"[\s\S]*?<\/td>/ は class="Past" 完全一致前提のため、この複合クラスの
    // セルを正しく1セルとして拾えず、好走した近走(1〜3着)が丸ごと欠落していた
    // （＝報告のあった「3着だけ入ってない」の真因）。td単位で Past を含むセルを取る。
    const pastCells=r.match(/<td[^>]*class="[^"]*\bPast\b[^"]*"[\s\S]*?<\/td>/g)||[];
    const past=pastCells.map(parsePastRace)
      .filter(p=> p.rid || p.rank!=null || p.rdate || p.dist )   // 空(休養)セルを除外
      .slice(0,5);                                               // 有効走の中から最大5走
    // 血統・厩舎: Horse_Info セル内 Horse01=父, (母父), 所属・調教師
    let sire=null, damsire=null, trainer=null;
    // 調教師ID（/trainer/ID または /trainer/result/recent/ID）
    let trainerId=null;
    const trm=r.match(/\/trainer\/(?:result\/recent\/)?([0-9a-z]{4,7})\/?"/);
    if(trm && trm[1]!=="result") trainerId=trm[1];
    if(info){
      const txt=info[0].replace(/<[^>]+>/g,"\n").replace(/&nbsp;/g," ");
      const lines=txt.split("\n").map(s=>s.trim()).filter(s=>s);
      const idxName=lines.findIndex(s=>s===n[2]);
      for(let i=0;i<lines.length;i++){
        const ln=lines[i];
        if(ln===n[2]) continue;
        const ds=ln.match(/^\(([^)]{2,20})\)$/); if(ds&&!damsire){ damsire=ds[1]; continue; }
        if(/美浦|栗東|地方|・/.test(ln) && /[・]/.test(ln) && !trainer){ trainer=ln.replace(/\s+/g,""); continue; }
        if(!sire && /^[ァ-ヶA-Za-z][ァ-ヶーA-Za-z' .]{1,22}$/.test(ln) && (idxName<0||i<idxName)) sire=ln;
      }
    }
    // ブリンカー: 馬名直後の <span class="Mark">B</span>（Horse_Info内に限定。Rank_B等の誤検出を避ける）
    let blinker=false;
    if(info){ blinker=/<span class="Mark">\s*B\s*<\/span>/.test(info[0]); }
    if(!blinker){ // フォールバック: この馬のhorseリンク直後のMark
      const re2=new RegExp('/horse/'+hid+'[^"]*"[^>]*>\\s*'+name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*</a>\\s*<span class="Mark">\\s*B');
      blinker=re2.test(r);
    }
    // 性齢: 牡4 / 牝3 / セ7
    let sexAge=null;
    const barei=r.match(/class="Barei[^"]*"[^>]*>\s*([牡牝セせん騸]+)\s?(\d{1,2})/);
    if(barei) sexAge=barei[1].replace("せん","セ").replace("騸","セ")+barei[2];
    else { const sa=r.match(/([牡牝セせん騸]+)\s?(\d{1,2})/); if(sa) sexAge=sa[1].replace("せん","セ").replace("騸","セ")+sa[2]; }
    // 性別記号だけ（牡/牝/セ）
    let sex=null; if(sexAge){ const sm=sexAge.match(/^[牡牝セ]/); if(sm) sex=sm[0]; }
    entries[num]={num, name, waku:w?+w[1]:null, jockey, jockeyId, kinryo, hid, past, sire, damsire, trainer, trainerId, blinker, weight, wdiff, sexAge, sex, belong};
    order.push(num);
  });
  // コース条件
  const cond={going:null, weather:null, surface:null, dist:null, raceName:null};
  const d01=html.match(/RaceData01[\s\S]{0,400}/);
  if(d01){ const txt=d01[0].replace(/<[^>]+>/g," ").replace(/\s+/g," ");
    const g=txt.match(/馬場[:：]?\s*(良|稍重|重|不良)/); if(g) cond.going=g[1];
    const we=txt.match(/天候[:：]?\s*(晴|曇|雨|小雨|雪|小雪)/); if(we) cond.weather=we[1];
    const c=txt.match(/(芝|ダ|ダート)\s*(\d{3,4})m/); if(c){ cond.surface=c[1]==="芝"?"芝":"ダ"; cond.dist=+c[2]; } }
  const rn=html.match(/RaceName"?[^>]*>\s*([^<\n]{1,40}?)\s*</); if(rn) cond.raceName=rn[1].trim();
  // 今走の回り（race_idから）
  cond.turn = state.raceId? turnOfRid(state.raceId) : null;
  return {entries, order, cond};
}

  html+=`<div class="g1-line" style="color:#7ee07e"><b>検証について</b> ★かつて掲げた⭐フォメの回収156%/169%は「後知恵の⭐」（そのレース自身の最終角位置）で算出しており、発走前に賭けられる⭐では再現できませんでした（撤回）。⭐は妙味の目印としてのみ使ってください。${haveOdds?"":"<span style='color:#ff9a8a'>※オッズ未取得＝⭐は出ません。発走15分前に再押しで人気確定→⭐判定。</span>"}</div>`;
  if(starsBelow.length){ html+=`<div class="g1-starrow" style="margin-top:8px;padding:6px 8px;background:rgba(255,210,74,0.08);border:1px solid rgba(255,210,74,0.3);border-radius:8px;font-size:14px;color:#ffd24a">⭐ 妙味候補（人気薄×先行・実測複勝35%／印上位外から）: ${starsBelow.map(x=>`${g1esc(x.name)}${x.pop?`(${x.pop}人気)`:""}`).join(" / ")}</div>`; }
  /* ★出走全頭のタグ★（ユーザー要望 2026-08-02「他の馬にも⭐や×や☑を付けたい」）
     印(◎○▲△)は本体AIのまま動かさず、高知特有の癖を"タグ"として上乗せする。

  {

    html+=`<div style="margin-top:10px;border-top:1px solid #2a2a33;padding-top:8px">

    html+=scored.map(x=>{

      const t=tg.map(([s,col,ti])=>`<span title="${escapeHtml(ti)}" style="color:${col};font-weight:800;margin-left:5px">${s}</span>`).join("");
      const od=x.odds?`<span style="color:#b3b3b3;font-size:12px;margin-left:6px">${x.pop?x.pop+"人気 ":""}${x.odds}倍</span>`:"";
      return `<div style="display:flex;align-items:center;gap:6px;padding:3px 0;font-size:14px;${mk?"":"opacity:.85"}">

    }).join("");
    html+=`</div>`;
  }
  /* Twitter向けテキスト（展開・見どころ・買い方・正直な検証数字） */
  try{
    const kt=kochiTweetText(c, cond, scored, stars, haveOdds);
    const enc=encodeURIComponent(kt);
    html+=`<div class="g1-tw" style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="kochiCopyBtn" data-tw="${escapeHtml(kt)}" style="flex:1;min-width:120px;font-size:14px;font-weight:700;padding:8px;border-radius:8px;border:1px solid #3a9ae0;background:none;color:#7ec8f0">📋 ツイート文</button>

      <button class="kochiImgBtn" style="flex:1;min-width:120px;font-size:14px;font-weight:700;padding:8px;border-radius:8px;border:1px solid #ffd43d;background:none;color:#ffd43d">🏇 フォメ画像</button>
      <button class="kochiCurveBtn" style="flex:1;min-width:120px;font-size:14px;font-weight:700;padding:8px;border-radius:8px;border:1px solid #51b883;background:none;color:#51b883">📈 過去成績</button>
    </div>`;
  }catch(_){}
  const cardEl=(function(){ card.innerHTML=html; return card; })();
  { const cb=cardEl.querySelector(".kochiCopyBtn"); if(cb) cb.onclick=()=>{ try{ navigator.clipboard.writeText(cb.dataset.tw); cb.textContent="✓ コピーした"; setTimeout(()=>cb.textContent="📋 ツイート文",1500);}catch(_){} };
    const ib=cardEl.querySelector(".kochiImgBtn"); if(ib) ib.onclick=()=>{ try{ const cv=drawKochiFormaImage(c,cond,scored); if(!cv){swAlert("⭐妙味馬がいないため画像は作れません（オッズ確定後に再取得を）");return;} cv.toBlob(b=>{ const f=new File([b],"kochi_forma.png",{type:"image/png"}); if(navigator.canShare&&navigator.canShare({files:[f]})){ navigator.share({files:[f]}); } else { const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="kochi_forma.png"; a.click(); } }); }catch(e){ swAlert("画像生成エラー: "+e.message); } }; }
    { const cb2=cardEl.querySelector(".kochiCurveBtn"); if(cb2) cb2.onclick=()=>{ try{ const cv=drawKochiCurveImage(); cv.toBlob(b=>{ const f=new File([b],"kochi_curve.png",{type:"image/png"}); if(navigator.canShare&&navigator.canShare({files:[f]})){ navigator.share({files:[f]}); } else { const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="kochi_curve.png"; a.click(); } }); }catch(e){ swAlert("グラフ生成エラー: "+e.message); } }; }
  return cardEl;
}

function shutubaURL(rid){
  const base = MODE==="nar" ? "https://nar.netkeiba.com/race/shutuba_past.html" : "https://race.netkeiba.com/race/shutuba_past.html";
  return pxy(base+"?race_id="+rid);
}

function styleType(e){
  const ps=(e&&e.past)||[]; let fb=0,cb=0,n=0;
  ps.forEach((pp,idx)=>{ if(pp.style){ n++; const w=(idx===0?1:0.7);
    if(pp.style==="逃"||pp.style==="先") fb+=w; else if(pp.style==="差"||pp.style==="追") cb+=w; } });
  if(!n) return null;
  if(fb/n>=0.45) return "front";
  if(cb/n>=0.45) return "closer";
  return "mid";
}

function swAlert(message){ return _swModal(message, false); }

function trackOf(rid){ const c=rid.slice(4,6); const map=MODE==="nar"?NAR_TRACK:JRA_TRACK; return map[c]||(MODE==="nar"?"NAR:"+c:"場"+c); }

function turnOfRid(rid){ const c=String(rid).slice(4,6); if(TURN_BY_TRACK[c]) return TURN_BY_TRACK[c];
  // 地方: 大半が右回り（門別・大井等は右、川崎・船橋等も右）。例外少数だが近似で右。
  return "右"; }

function unb64url(s){
  let b=String(s).replace(/-/g,"+").replace(/_/g,"/");
  while(b.length%4) b+="=";
  const bin=atob(b); const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function userProxyPrefix(){ try{ const p=(localStorage.getItem("sw_proxy_prefix")||"").trim(); return /workers\.dev|\/raw\?url=/.test(p)?p:""; }catch(e){ return ""; } }

function wrapProxy(prefix, inner){
  // 自前proxy.php は ?url=https://... の形だと お名前.comのWAFがSSRF攻撃と誤判定してブロックするため、
  // URLをBase64URLにして ?u= で渡す（proxy.php側は u= / url= の両対応）
  if(prefix.indexOf("proxy.php")>=0) return prefix.replace(/\?url=$/,"").replace(/\?u=$/,"")+"?u="+b64url(inner);
  return prefix.endsWith("=") ? prefix+encodeURIComponent(inner) : prefix+inner;
}

let MODE="nar";
async function findKochiFinals(date){
  const url="https://nar.netkeiba.com/top/race_list_sub.html?kaisai_date="+date;
  const html=await fetchDecoded(pxy(url));
  const ids=[...new Set((html.match(/race_id=(\d{12})/g)||[]).map(s=>s.replace("race_id=","")))]
    .filter(rid=>rid.slice(4,6)==="54");
  if(!ids.length) return {finals:[],reason:"no_kochi"};
  const finals=[];
  for(const rid of ids.sort().reverse()){
    try{
      const sh=await fetchDecoded(shutubaURL(rid));
      const m=sh.match(/RaceName"?[^>]*>\s*([^<\n]{1,40}?)\s*</);
      const nm=m?decodeHtmlEntities(m[1].trim()):"";
      if(/ファイナル/.test(nm)){ finals.push({race_id:rid,name:nm,trackName:"高知"}); break; }
    }catch(_){}
  }
  return {finals, reason: finals.length?"ok":"no_final"};
}
async function runKochiStandalone(){
  const host=document.getElementById("kochiOut");
  const date=(document.getElementById("kochiDate").value||"").replace(/-/g,"")||jstTodayStr();
  host.innerHTML='<div class="g1-loading">🐴 '+date.slice(4,6)+'/'+date.slice(6,8)+' 高知のファイナルレースを探しています…</div>';
  let res;
  try{ res=await findKochiFinals(date); }
  catch(e){ host.innerHTML='<div class="g1-loading">⚠ 通信エラー: '+escapeHtml(e.message)+'<br>時間を置いて再試行してください。</div>'; return; }
  if(res.reason==="no_kochi"){ host.innerHTML='<div class="g1-loading">この日は高知競馬の開催がありません。（日付を確認してください）</div>'; return; }
  if(res.reason==="no_final"){ host.innerHTML='<div class="g1-loading">本日の高知にファイナルレースが見つかりませんでした。<br>ファイナルは主に最終レース。時間をおいて再取得してください。</div>'; return; }
  host.innerHTML='<div class="g1-loading">⭐ ファイナル発見: '+escapeHtml(res.finals[0].name)+'。解析中…</div>';
  const blocks=[];
  for(const c of res.finals){ try{
    const html=await fetchDecoded(shutubaURL(c.race_id)); const ps=parseShutuba(html); const ents=ps.entries||{}; const cond=ps.cond||{};
    const nums=Object.keys(ents); if(nums.length<5) continue;
    let odds=null; try{ odds=await fetchWinOdds(c.race_id); }catch(_){}
    const scored=nums.map(n=>{ const r=kochiSpecialScore(ents[n]); const o=(odds&&odds[n])?odds[n]:null; return {num:String(n), name:(ents[n]&&ents[n].name)||"", sp:r.s, jk:r.jk, wk:r.wk, sr:r.sr, st:r.st, e:ents[n], odds:o?o.odds:null, pop:o?o.pop:null}; });
    const mx=Math.max(...scored.map(x=>x.sp)); let zz=0; scored.forEach(x=>zz+=Math.exp((x.sp-mx)/0.5)); scored.forEach(x=>x.spp=Math.exp((x.sp-mx)/0.5)/zz);
    const haveOdds=scored.some(x=>x.odds>0);
    if(haveOdds){ let z=0; scored.forEach(x=>{ if(x.odds>0) z+=1/x.odds; }); scored.forEach(x=>{ x.mp=(x.odds>0&&z>0)?(1/x.odds)/z:0; x.blend=x.spp+2*x.mp;
        if(x.pop===1) x.blend*=0.72; else if(x.pop>=4&&x.pop<=5) x.blend*=1.18; else if(x.pop>=6&&x.pop<=7) x.blend*=1.10;
        x.starFinal=(x.pop>=4&&x.pop<=8&&x.st==="front"); }); scored.sort((a,b)=>b.blend-a.blend); }
    else { scored.forEach(x=>{x.blend=x.spp;}); scored.sort((a,b)=>b.sp-a.sp); }
    /* ★印は本体AI(LTR)に統一する★（2026-08-02）
       これまでこのページは独自スコア(kochiSpecialScore＋人気補正)で並べており、
       同じレースなのに tweet.html＝Twitterに出す印と ○▲△ が総入れ替えになっていた
       （利用者から見て「どっちが本当の予想か」が破綻。しかも人気補正＝オッズ依存で
        「予想はオッズ前に出す」の建前とも矛盾していた）。
       ★採点関数をコピーしない★ このページは手書きコピー方式で過去に写し忘れで
       4回壊れた(v357/359/360/364)。だから計算し直さず、本体が保存した予想
       （＝実際にツイートした印そのもの）を単一の正として読む。 */
    let markSrc="local";
    try{
      const pr=await fetch(`predictions.php?action=list&date=${date}&mode=nar`,{headers:{Accept:"application/json"}}).then(r=>r.ok?r.json():null).catch(()=>null);
      const rec=((pr&&pr.records)||[]).find(r=>String(r.tc)==="54");
      const saved=rec&&(rec.races||[]).find(r=>String(r.race_id)===String(c.race_id));
      const order=saved&&(saved.marks||[]).map(m=>String(m.num));
      if(order&&order.length>=3){
        const rank=new Map(order.map((n,i)=>[n,i]));
        scored.sort((a,b)=>{
          const ra=rank.has(a.num)?rank.get(a.num):99, rb=rank.has(b.num)?rank.get(b.num):99;
          return ra!==rb ? ra-rb : (b.blend||b.sp)-(a.blend||a.sp);   // 印外は従来順で後ろに
        });
        markSrc="ltr";
      }
    }catch(_){}
    blocks.push(renderKochiBlock(c,cond,scored,haveOdds,markSrc));
  }catch(e){} }
  host.innerHTML="";
  if(!blocks.length){ host.innerHTML='<div class="g1-loading">解析に失敗。オッズ確定前だと⭐が出ないことがあります。締切15分前に再取得を。</div>'; return; }
  blocks.forEach(b=>host.appendChild(b));
}
