<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="'Noto Sans JP','Noto Sans CJK JP',sans-serif">
<title>初回セットアップ</title>
<rect width="1280" height="800" fill="#FFFFFF"/>
<rect x="0" y="0" width="220" height="800" rx="0" fill="#00118F"/>
<text x="24" y="48" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="start">TURF LAB</text>
<text x="24" y="72" font-size="16" font-weight="400" fill="#FFFFFF" text-anchor="start">デスクトップ（仮）</text>
<text x="32" y="120" font-size="18" font-weight="400" fill="#FFFFFF" text-anchor="start">今日のレース</text>
<text x="32" y="176" font-size="18" font-weight="400" fill="#FFFFFF" text-anchor="start">成績</text>
<rect x="12" y="202" width="196" height="48" rx="6" fill="#0031D8"/>
<text x="32" y="232" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="start">設定</text>
<rect x="220" y="0" width="1060" height="56" rx="0" fill="#F2F2F2"/>
<line x1="220" y1="56" x2="1280" y2="56" stroke="#CCCCCC" stroke-width="1"/>
<text x="244" y="35" font-size="16" font-weight="400" fill="#1A1A1A" text-anchor="start">初回セットアップ</text>
<text x="1256" y="35" font-size="16" font-weight="400" fill="#595959" text-anchor="end">サンプル表示（架空データ）</text>
<text x="244" y="100" font-size="26" font-weight="700" fill="#1A1A1A" text-anchor="start">はじめの設定</text>
<rect x="244" y="128" width="1012" height="108" rx="8" fill="#F2F2F2" stroke="#CCCCCC" stroke-width="1"/>
<text x="272" y="168" font-size="20" font-weight="700" fill="#1A1A1A" text-anchor="start">JRA-VANとの接続</text>
<text x="272" y="204" font-size="18" font-weight="400" fill="#1A1A1A" text-anchor="start">接続できました（JV-Link 5.0.0）</text>
<rect x="1090" y="162" width="140" height="40" rx="20" fill="#E6F5EC"/>
<text x="1160" y="189" font-size="18" font-weight="700" fill="#0C472A" text-anchor="middle">完了</text>
<rect x="244" y="252" width="1012" height="108" rx="8" fill="#F2F2F2" stroke="#CCCCCC" stroke-width="1"/>
<text x="272" y="292" font-size="20" font-weight="700" fill="#1A1A1A" text-anchor="start">データの初回取得</text>
<text x="272" y="328" font-size="18" font-weight="400" fill="#1A1A1A" text-anchor="start">過去のレースを取っています… 62%</text>
<rect x="272" y="340" width="700" height="10" rx="5" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>
<rect x="272" y="340" width="434" height="10" rx="5" fill="#0031D8"/>
<rect x="1090" y="286" width="140" height="40" rx="20" fill="#FBF5E0"/>
<text x="1160" y="313" font-size="18" font-weight="700" fill="#6E5600" text-anchor="middle">取得中</text>
<rect x="244" y="376" width="1012" height="108" rx="8" fill="#F2F2F2" stroke="#CCCCCC" stroke-width="1"/>
<text x="272" y="416" font-size="20" font-weight="700" fill="#1A1A1A" text-anchor="start">試用期間</text>
<text x="272" y="452" font-size="18" font-weight="400" fill="#1A1A1A" text-anchor="start">30日間、すべての機能が使えます（あと30日）</text>
<rect x="1090" y="410" width="140" height="40" rx="20" fill="#E6F5EC"/>
<text x="1160" y="437" font-size="18" font-weight="700" fill="#0C472A" text-anchor="middle">利用中</text>
<rect x="244" y="500" width="1012" height="108" rx="8" fill="#F2F2F2" stroke="#CCCCCC" stroke-width="1"/>
<text x="272" y="540" font-size="20" font-weight="700" fill="#1A1A1A" text-anchor="start">ライセンスキー</text>
<text x="272" y="576" font-size="18" font-weight="400" fill="#1A1A1A" text-anchor="start">製品版を購入した方は、ここに入力します</text>
<rect x="272" y="560" width="460" height="40" rx="4" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
<text x="284" y="588" font-size="18" font-weight="400" fill="#1A1A1A" text-anchor="start">XXXX-••••-••••-••••</text>
<rect x="1090" y="534" width="140" height="44" rx="6" fill="#0031D8"/>
<text x="1160" y="563" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">確認する</text>
<rect x="244" y="636" width="1012" height="144" rx="8" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>
<text x="272" y="674" font-size="18" font-weight="700" fill="#1A1A1A" text-anchor="start">ご利用にあたって</text>
<text x="272" y="708" font-size="16" font-weight="400" fill="#1A1A1A" text-anchor="start">データはこのPCの中だけに保存します。外部には送りません。</text>
<text x="272" y="738" font-size="16" font-weight="400" fill="#1A1A1A" text-anchor="start">JRA-VANのサービスが終わったら、取得したデータは削除してください。</text>
<text x="272" y="768" font-size="16" font-weight="400" fill="#1A1A1A" text-anchor="start">お問い合わせ：support@example.com（サンプル）</text>
</svg>
