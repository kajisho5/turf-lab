<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="'Inter','Noto Sans JP','Noto Sans CJK JP',sans-serif">
<title>初回セットアップ</title>
<rect width="1280" height="800" fill="#0B0C0E"/>
<rect x="0" y="0" width="240" height="800" rx="0" fill="#08090A"/>
<line x1="240" y1="0" x2="240" y2="800" stroke="#26282D" stroke-width="1"/>
<rect x="20" y="22" width="28" height="28" rx="7" fill="#5E6AD2"/>
<text x="34" y="43" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">T</text>
<text x="60" y="43" font-size="18" font-weight="600" fill="#E6E7EA" text-anchor="start">TURF LAB</text>
<text x="24" y="96" font-size="16" font-weight="400" fill="#9498A1" text-anchor="start">ワークスペース</text>
<rect x="24" y="126" width="8" height="8" rx="4" fill="#26282D"/>
<text x="46" y="140" font-size="17" font-weight="400" fill="#9498A1" text-anchor="start">今日のレース</text>
<text x="214" y="140" font-size="16" font-weight="400" fill="#9498A1" text-anchor="end">G T</text>
<rect x="24" y="174" width="8" height="8" rx="4" fill="#26282D"/>
<text x="46" y="188" font-size="17" font-weight="400" fill="#9498A1" text-anchor="start">成績</text>
<text x="214" y="188" font-size="16" font-weight="400" fill="#9498A1" text-anchor="end">G R</text>
<rect x="10" y="208" width="220" height="40" rx="6" fill="#1F2127"/>
<rect x="24" y="222" width="8" height="8" rx="4" fill="#5E6AD2"/>
<text x="46" y="236" font-size="17" font-weight="600" fill="#E6E7EA" text-anchor="start">設定</text>
<text x="214" y="236" font-size="16" font-weight="400" fill="#9498A1" text-anchor="end">G S</text>
<line x1="0" y1="728" x2="240" y2="728" stroke="#26282D" stroke-width="1"/>
<text x="24" y="762" font-size="16" font-weight="400" fill="#9498A1" text-anchor="start">Ctrl+K で検索</text>
<line x1="240" y1="56" x2="1280" y2="56" stroke="#26282D" stroke-width="1"/>
<text x="264" y="35" font-size="16" font-weight="400" fill="#9498A1" text-anchor="start">初回セットアップ</text>
<text x="1256" y="35" font-size="16" font-weight="400" fill="#9498A1" text-anchor="end">サンプル表示（架空データ）</text>
<text x="264" y="100" font-size="26" font-weight="700" fill="#F2F3F5" text-anchor="start">はじめの設定</text>
<rect x="264" y="128" width="992" height="108" rx="8" fill="#141517" stroke="#26282D" stroke-width="1"/>
<text x="272" y="168" font-size="20" font-weight="700" fill="#F2F3F5" text-anchor="start">JRA-VANとの接続</text>
<text x="272" y="204" font-size="18" font-weight="400" fill="#F2F3F5" text-anchor="start">接続できました（JV-Link 5.0.0）</text>
<rect x="1090" y="162" width="140" height="40" rx="20" fill="#10281E"/>
<text x="1160" y="189" font-size="18" font-weight="700" fill="#5FD39A" text-anchor="middle">完了</text>
<rect x="264" y="252" width="992" height="108" rx="8" fill="#141517" stroke="#26282D" stroke-width="1"/>
<text x="272" y="292" font-size="20" font-weight="700" fill="#F2F3F5" text-anchor="start">データの初回取得</text>
<text x="272" y="328" font-size="18" font-weight="400" fill="#F2F3F5" text-anchor="start">過去のレースを取っています… 62%</text>
<rect x="272" y="340" width="700" height="10" rx="5" fill="#0B0C0E" stroke="#26282D" stroke-width="1"/>
<rect x="272" y="340" width="434" height="10" rx="5" fill="#5E6AD2"/>
<rect x="1090" y="286" width="140" height="40" rx="20" fill="#2B2312"/>
<text x="1160" y="313" font-size="18" font-weight="700" fill="#E9C05A" text-anchor="middle">取得中</text>
<rect x="264" y="376" width="992" height="108" rx="8" fill="#141517" stroke="#26282D" stroke-width="1"/>
<text x="272" y="416" font-size="20" font-weight="700" fill="#F2F3F5" text-anchor="start">試用期間</text>
<text x="272" y="452" font-size="18" font-weight="400" fill="#F2F3F5" text-anchor="start">30日間、すべての機能が使えます（あと30日）</text>
<rect x="1090" y="410" width="140" height="40" rx="20" fill="#10281E"/>
<text x="1160" y="437" font-size="18" font-weight="700" fill="#5FD39A" text-anchor="middle">利用中</text>
<rect x="264" y="500" width="992" height="108" rx="8" fill="#141517" stroke="#26282D" stroke-width="1"/>
<text x="272" y="540" font-size="20" font-weight="700" fill="#F2F3F5" text-anchor="start">ライセンスキー</text>
<text x="272" y="576" font-size="18" font-weight="400" fill="#F2F3F5" text-anchor="start">製品版を購入した方は、ここに入力します</text>
<rect x="272" y="560" width="460" height="40" rx="4" fill="#0B0C0E" stroke="#F2F3F5" stroke-width="2"/>
<text x="284" y="588" font-size="18" font-weight="400" fill="#F2F3F5" text-anchor="start">XXXX-••••-••••-••••</text>
<rect x="1090" y="534" width="140" height="44" rx="6" fill="#5E6AD2"/>
<text x="1160" y="563" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">確認する</text>
<rect x="264" y="636" width="992" height="144" rx="8" fill="#0B0C0E" stroke="#26282D" stroke-width="1"/>
<text x="272" y="674" font-size="18" font-weight="700" fill="#F2F3F5" text-anchor="start">ご利用にあたって</text>
<text x="272" y="708" font-size="16" font-weight="400" fill="#F2F3F5" text-anchor="start">データはこのPCの中だけに保存します。外部には送りません。</text>
<text x="272" y="738" font-size="16" font-weight="400" fill="#F2F3F5" text-anchor="start">JRA-VANのサービスが終わったら、取得したデータは削除してください。</text>
<text x="272" y="768" font-size="16" font-weight="400" fill="#F2F3F5" text-anchor="start">お問い合わせ：support@example.com（サンプル）</text>
</svg>
